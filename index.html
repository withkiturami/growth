   + (it.summary ? '<p>'+imark(it.summary)+'</p>' : '') + '</div>';
}
/* ── 발송본(PDF) 재현 ────────────────────────────────────────
   letter1p.py 의 pick() 을 그대로 옮긴 것이다. 한쪽만 고치면 갈라진다.
   · 대상 자료 : ARTS (letter1p.py 도 arts.json 을 쓴다. ISSUES 와 수록 범위가
     다르므로 반드시 ARTS 를 써야 PDF 와 같은 결과가 나온다)
   · 점수 감쇠 : 주당 1.2 (대문 score() 의 0.55 와 다르다 — 발송본은 최근성 우선)
   · 주간 성장은 그 주에 소식이 없는 주가 많아 8주 → 12주 → 전체로 창을 넓힌다.
     그래서 발송본에는 이전 주 기사가 올라올 수 있다 (화면에 날짜로 드러낸다) */
var NOT_GROWTH = {"기타":1};
function sendScore(a, ref){
  var wk = (Date.parse(ref+"T12:00:00Z") - Date.parse(a.date+"T12:00:00Z")) / 6048e5;
  return subjScore(a.title) + (CATW[a.cat] || 0)
       + Math.min(a.cov || 1, 10) * 0.25
       + (a.official ? 1.5 : 0) - wk * 1.2;
}
function pickSend(ref, wantSoc, n){
  n = n || 3;
  var pool = (ARTS || []).filter(function(a){
    if((a.cat === "사회공헌") !== wantSoc) return false;
    if(!wantSoc && (NOT_GROWTH[a.cat] || (CATW[a.cat] || 0) < 2)) return false;
    if(subjScore(a.title) < (wantSoc ? 1 : 2)) return false;
    return a.date <= ref;
  }).sort(function(x, y){ return sendScore(y, ref) - sendScore(x, ref); });
  /* 그 주(월~일) 기사를 먼저 싣고 모자랄 때만 이전 주에서 채운다 (요청 2026-09-23 :
     "매주 월요일, 그 전주의 기사들을 바탕으로"). 창은 일 단위 — 6 = 그 주 */
  var out = [], wins = wantSoc ? [6, null] : [6, 56, 84, null], k, i2;
  for(k = 0; k < wins.length; k++){
    for(i2 = 0; i2 < pool.length && out.length < n; i2++){
      var a = pool[i2];
      if(out.indexOf(a) >= 0) continue;
      if(wins[k] !== null){
        var d = (Date.parse(ref+"T12:00:00Z") - Date.parse(a.date+"T12:00:00Z")) / 864e5;
        if(d > wins[k]) continue;
      }
      out.push(a);
    }
    if(out.length >= n) break;
  }
  return out.slice(0, n);
}
/* 왼쪽 호 목록의 높이를 오른쪽 본문에 맞춘다 — 바닥 단차 제거 (요청 2026-09-21)
   본문이 화면보다 길면 화면 높이까지만(붙어 따라오는 목록이므로 그 이상은 의미가 없다) */
function railFit(){
  var rail = document.querySelector(".arail"), pane = document.getElementById("ipane");
  if(!rail || !pane) return;
  /* 탭이 숨어 있을 땐 높이가 0 이라 그대로 쓰면 목록이 사라진다 */
  if(!pane.offsetHeight){ rail.style.removeProperty("max-height"); return; }
  if(window.innerWidth <= 1100){ rail.style.removeProperty("max-height"); return; }
  /* css 쪽이 !important 라 인라인만으로는 안 먹는다 */
  rail.style.setProperty("max-height",
    Math.min(window.innerHeight - 32, pane.offsetHeight) + "px", "important");
}
window.addEventListener("resize", railFit);

function ipane(){
  var i = ISSUES[icur], items = i.items.filter(ihit);
  /* 대문 두 칸과 같은 기준으로 나눈다 (2026-09-09)
       주간 동행         = 사회공헌
       주간 성장         = 귀뚜라미가 주체(2점 이상) + 수상·실적·수출·기술 (대문 eligible 과 동일)
       업계 · 시장 동향  = 나머지 (업계 동향 · 기타 · 귀뚜라미가 주체가 아닌 기사)
     PDF 뉴스레터(letter1p.py)도 같은 두 이름을 쓴다. */
  var soc = items.filter(isSoc);
  var grw = items.filter(function(x){ return !isSoc(x) && eligible(x); });
  var ind = items.filter(function(x){ return !isSoc(x) && !eligible(x); });
  /* 발송본(PDF) 구성 : 주간 동행 3 + 주간 성장 3. letter1p.py 와 같은 결과가 나온다.
     성장 소식이 없는 주가 많아 이전 주 기사가 올라올 수 있으므로 날짜로 드러낸다 */
  var sSoc = pickSend(i.end, true, 3), sGrw = pickSend(i.end, false, 3);
  var inWk = function(a){ return a.date >= i.start && a.date <= i.end; };
  var scard = function(a){
    return '<div class="acard sc'+(inWk(a) ? '' : ' old')+'">'
     + '<div class="imeta"><span class="num">'+fd(a.date)+'</span>'
     + '<span class="chip">'+esc(a.cat)+'</span>'
     + (a.official ? '<span class="chip off">공식 보도자료</span>' : '')
     + '<span class="num">보도 '+(a.cov||1)+'건</span>'
     + (inWk(a) ? '' : '<span class="chip pw">이전 주</span>') + '</div>'
     + '<h3><a href="'+esc(a.link)+'" target="_blank" rel="noopener">'+imark(a.title)+'</a></h3>'
     + (a.summary ? '<p>'+imark(a.summary)+'</p>' : '') + '</div>';
  };
  var nOld = sSoc.concat(sGrw).filter(function(a){ return !inWk(a); }).length;

  var h = '<div class="dhead"><h2>Vol. '+i.vol+'</h2>'
    + '<span class="chip">'+wkLabel(i.start)+'</span>'
    + '<span class="chip num">'+fd(i.start)+' ~ '+fd(i.end)+'</span>'
    + (i.pdf ? '<span class="spacer"></span><a class="pdfb" id="pdfb" href="'+esc(i.pdf)+'"'
        /* download 이름은 파일 이름을 그대로 쓴다. 한글 이름을 넣으면 크로미움이
           이름을 버리고 'download' 로 저장하는 경우가 있어 파일명을 아스키로 둔다 */
        + ' download="'+esc(i.pdf.split("/").pop())+'" rel="noopener"'
        + ' aria-label="Vol. '+i.vol+' 발송본 PDF 내려받기">'
        + '<span class="pi" aria-hidden="true">↓</span>PDF 내려받기</a>' : '')
    + '</div>'
    + (i.pdf ? '<p class="pdfmsg" id="pdfmsg" hidden></p>' : '');

  /* ── 이 호의 본문 = 발송본 그대로 (요청 2026-09-10) ──
     "PDF 와 뉴스레터는 동일하게 간다. 양식이 달라지더라도 실리는 기사는 같게,
      주 간 중복 발송은 괜찮다" 는 결정에 따라 발송본 6건을 본문으로 올린다.
     그 주에만 있던 나머지 기사는 아래 접힌 칸에 남겨 기록을 잃지 않는다. */
  var sIds = {};
  sSoc.concat(sGrw).forEach(function(a){ sIds[a.date + "|" + a.title] = 1; });
  var rest = items.filter(function(x){ return !sIds[x.date + "|" + x.title]; });

  h += '<div class="sbh"><b>이 호에 실린 기사</b>'
    + '<span class="sbn">주간 동행 '+sSoc.length
    + '건 + 주간 성장 '+sGrw.length+'건</span>'
    + (nOld ? '<span class="chip pw">이전 주에서 '+nOld+'건</span>' : '') + '</div>'
    + '<div class="sbg">'
    + '<div class="isect so">주간 동행</div><div class="isect gr">주간 성장</div>'
    /* 좌우를 행 단위로 짝지어 넣는다 — 같은 순번끼리 한 줄에 놓으면
       그리드가 행 높이를 큰 쪽에 맞춰 두 칸의 높이가 어긋나지 않는다
       (요청 2026-09-21 : "주간 동행 · 성장 같은 높이면 좋겠어") */
    + (function(){
        var n = Math.max(sSoc.length, sGrw.length), o = "", r;
        if(!n) return '<div class="empty">없음</div><div class="empty">없음</div>';
        for(r = 0; r < n; r++)
          o += (sSoc[r] ? scard(sSoc[r]) : '<div class="scgap"></div>')
             + (sGrw[r] ? scard(sGrw[r]) : '<div class="scgap"></div>');
        return o;
      })()
    + '</div>'
    + '<p class="sbf">성장 소식이 없는 주에는 8주 → 12주 순으로 창을 넓혀 채우므로 '
    + '이전 주 기사가 다시 실릴 수 있습니다(중복 허용). 제목을 누르면 기사로 이동합니다.</p>';

  /* ── 그 주 확인분 중 발송본에 빠진 기사 : 접어 둔다 ── */
  if(rest.length){
    var rs = rest.filter(isSoc), rg = rest.filter(function(x){ return !isSoc(x) && eligible(x); });
    var ri = rest.filter(function(x){ return !isSoc(x) && !eligible(x); });
    h += '<button class="ttog rtog" id="rtog" aria-expanded="false" aria-controls="rwrap">'
      + '<span class="cv" aria-hidden="true">›</span>이번 주 그 외 소식 '+rest.length+'건 더 보기</button>'
      + '<div id="rwrap" hidden>'
      + (rs.length ? '<div class="isect so">주간 동행</div>' + rs.map(icard).join("") : '')
      + (rg.length ? '<div class="isect gr">주간 성장</div>' + rg.map(icard).join("") : '')
      + (ri.length ? '<div class="isect">업계 · 시장 동향</div>' + ri.map(icard).join("") : '')
      + '</div>';
  }
  if(!items.length && !sSoc.length && !sGrw.length)
    h += '<div class="empty">검색어에 해당하는 기사가 이 호에 없습니다.</div>';
  document.getElementById("ipane").innerHTML = h;
  railFit();
  /* ── PDF 단추 : 파일이 없을 때 브라우저 오류 화면으로 튀지 않게 한다 ──
     원인 (2026-09-10 재현) : index.html 만 받아 열면 pdf 폴더가 없어
     ERR_FILE_NOT_FOUND / "이 사이트에서 사용할 수 없는 파일" 화면으로 넘어간다.
     또 file:// 에서는 download 속성이 무시되고 '이동' 이 되어 페이지가 사라진다.
     → 클릭을 가로채 ① 웹(http/https)이면 있는지 먼저 확인하고 내려받고
                    ② 로컬 파일이면 새 창으로 열고 안내를 함께 띄운다 */
  var pb = document.getElementById("pdfb"), pm = document.getElementById("pdfmsg");
  function pmsg(t, bad){
    if(!pm) return;
    pm.textContent = t; pm.className = "pdfmsg" + (bad ? " bad" : ""); pm.hidden = false;
  }
  if(pb) pb.onclick = function(e){
    e.preventDefault();
    var url = pb.getAttribute("href"), nm = pb.getAttribute("download");
    var save = function(){
      var a = document.createElement("a");
      a.href = url; a.download = nm;
      document.body.appendChild(a); a.click(); a.remove();
    };
    if(location.protocol === "file:"){
      /* 로컬에서는 있는지 확인할 방법이 없다(파일 접근 제한). 새 창으로 띄우고 안내한다 */
      window.open(url, "_blank");
      pmsg("로컬 파일로 열었을 때는 새 창에서 PDF 가 뜹니다. 창이 비거나 오류가 나면 "
         + "index.html 과 같은 위치에 pdf 폴더가 있는지 확인하세요. 웹에 올린 뒤에는 바로 저장됩니다.");
      return;
    }
    if(pm){ pm.hidden = true; }
    fetch(url, {method: "HEAD"}).then(function(r){
      if(r.ok){ save(); return; }
      pmsg("PDF 파일을 찾을 수 없습니다 (" + r.status + "). "
         + "index.html 과 함께 pdf 폴더를 올렸는지 확인하세요 : " + url, true);
    })["catch"](function(){
      /* HEAD 를 막는 서버도 있다. 확인이 안 되면 그냥 시도한다 */
      save();
    });
  };

  var rt = document.getElementById("rtog"), rw = document.getElementById("rwrap");
  if(rt && rw) rt.onclick = function(){
    var on = rw.hidden;
    rw.hidden = !on;
    rt.setAttribute("aria-expanded", on ? "true" : "false");
    rt.querySelector(".cv").textContent = on ? "⌄" : "›";
  };
}

/* 화면(빌드) 확인 배지 : 예전에는 mk.py 가 찍어 주는 문자열을 손으로 그대로
   옮겨 적었는데, 직접 손을 댄 뒤 깜빡하면 배지만 옛날 시각에 멈춰 있었다
   (2026-09-16). document.lastModified 는 이 파일을 올릴 때(깃허브 커밋/배포)
   브라우저가 서버 응답에서 읽어오는 진짜 수정 시각이라 손으로 관리할 필요가
   없다 — 파일을 새로 올리기만 하면 배지도 저절로 맞다 */
var _buildTxt = (function(){
  try{
    var d = new Date(document.lastModified);
    if(isNaN(d.getTime())) return "";
    var p2 = function(n){ return (n < 10 ? "0" : "") + n; };
    return "화면 " + p2(d.getMonth() + 1) + "-" + p2(d.getDate())
      + " " + p2(d.getHours()) + ":" + p2(d.getMinutes());
  }catch(e){ return ""; }
})();

/* ── 모바일 : 지도 배율(1·2·3배) + 전달 기록으로 이동 ─────────────
   폰에서는 지도의 가로폭이 화면폭에 묶여 '크게'를 눌러도 커지지 않는다.
   그래서 화면폭을 넘겨 그리고 손가락으로 끌어 보게 한다.
   배율을 바꾸면 고른 곳이 화면 가운데로 오도록 스크롤을 맞춘다 */
(function(){
  var host = $("#mleft"), bar = $("#mzoom");
  if(!host || !bar) return;
  var z = 1;
  function center(){
    var box = host.querySelector("#map");
    if(!box) return;
    var g = box.querySelector('.mk.sel .dot') || box.querySelector('.mk .dot');
    if(!g){ box.scrollLeft = (box.scrollWidth - box.clientWidth) / 2; return; }
    var r = g.getBoundingClientRect(), b = box.getBoundingClientRect();
    box.scrollLeft += (r.left + r.width/2) - (b.left + b.width/2);
    box.scrollTop  += (r.top  + r.height/2) - (b.top  + b.height/2);
  }
  function set(n){
    z = n;
    host.style.setProperty("--mz", n);
    Array.prototype.forEach.call(bar.children, function(b){
      b.setAttribute("aria-pressed", (+b.dataset.z === n) ? "true" : "false"); });
    setTimeout(center, 30);
  }
  Array.prototype.forEach.call(bar.children, function(b){
    b.onclick = function(){ set(+b.dataset.z); };
  });
  set(1);
  /* 창을 닫으면 배율을 1배로 되돌린다 (다음에 열 때 전체가 보이게) */
  var close = $("#mclose");
  if(close) close.addEventListener("click", function(){ set(1); });
})();

/* ══ 관리자 전용 조회수 카운터 (2026-09-16 추가, 2026-09-16 실제 슬러그로 확정,
   2026-09-16 캐시 우회 수정) ══
   - CounterAPI.dev 무료 서비스 사용, 워크스페이스 "임진우's Workspace"(Public) 아래 카운터 2개
   - 워크스페이스가 Public이라 API 키 없이 브라우저에서 바로 up/get 호출 가능
   - 응답 필드명은 up_count/count/value 순으로 있는 것을 사용 (실제 응답 확인 전까지는 추정치)
   - 새로고침/재방문해도 안 올라간다는 문제 확인 — 원인은 API 가 아니라 브라우저 캐시였다.
     매번 정확히 같은 URL(.../up, .../{slug})로 fetch 하다 보니, 서버가 캐시 금지 헤더를
     안 주는 경우 브라우저가 실제 요청을 보내지 않고 이전 응답을 그대로 재사용해서
     같은 URL을 여러 번 호출해도 실제로는 한 번만 서버에 도달했다(주소창에 직접
     쳐서 여러 번 열어도 1번만 오른 현상과 일치). → 매 호출마다 캐시버스터
     쿼리(_=시각+난수)를 붙이고 fetch 에 cache:"no-store" 도 같이 줘서 항상 진짜
     네트워크 요청이 나가게 한다 — 요청 2026-09-16, 12차 */
(function(){
  var WORKSPACE = "s-team-55-5544";
  var SLUG_TOTAL = "first-counter-5544";   // 총 조회수 (Counter Name: total-views)
  var SLUG_UNIQUE = "unique-visitor";      // 고유 방문자
  var BASE = "https://api.counterapi.dev/v2/" + WORKSPACE + "/";

  function noCache(url){
    return url + (url.indexOf("?") >= 0 ? "&" : "?") + "_=" + Date.now()
      + Math.random().toString(36).slice(2);
  }
  function hit(slug){
    return fetch(noCache(BASE + slug + "/up"), { cache: "no-store" })
      .then(function(r){ return r.json(); }).catch(function(){ return null; });
  }
  function get(slug){
    return fetch(noCache(BASE + slug + "/"), { cache: "no-store" })
      .then(function(r){ return r.json(); }).catch(function(){ return null; });
  }
  function readCount(res){
    var d = res && res.data;
    if(!d) return "-";
    if(d.up_count != null) return d.up_count;
    if(d.count != null) return d.count;
    if(d.value != null) return d.value;
    return "-";
  }

  /* 총 조회수 : 매 로드마다 +1 */
  hit(SLUG_TOTAL);

  /* 고유 방문자 : 이 브라우저에서 처음 방문일 때만 +1 */
  var UKEY = "kt_growth_uid_v1";
  try {
    if(!localStorage.getItem(UKEY)){
      localStorage.setItem(UKEY, "1");
      hit(SLUG_UNIQUE);
    }
  } catch(e){}

  /* 관리자 전용 표시 : ?admin=1 로 접속했을 때만 우측 하단에 보여준다 */
  if(/[?&]admin=1(&|$)/.test(location.search)){
    Promise.all([get(SLUG_TOTAL), get(SLUG_UNIQUE)]).then(function(res){
      var t = readCount(res[0]);
      var u = readCount(res[1]);
      var box = document.createElement("div");
      box.style.cssText = "position:fixed;bottom:14px;right:14px;z-index:9999;background:#111;color:#fff;"
        + "font:12px/1.5 -apple-system,'Malgun Gothic',sans-serif;padding:10px 14px;border-radius:10px;opacity:.92";
      box.textContent = "● 관리자 보기 · 총 조회수 " + t + " · 고유 방문자 " + u;
      document.body.appendChild(box);
    });
  }
})();

render();
</script>
