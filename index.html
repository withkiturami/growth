/* ⑥ 첫 화면 띠 · 글자 25% */
.intro .ib{padding:48px 28px 43px!important}
.intro .ib::before,.intro .ib::after{max-width:650px!important;height:2.5px!important}
.intro .ib::before{margin-bottom:33px!important}
.intro .ib::after{margin-top:30px!important}
.intro .ilogo{height:35px!important;margin:0 auto 25px!important}
.intro .ik{font-size:clamp(37px,8vw,75px)!important}
.intro .ie{font-size:clamp(15px,2vw,20px)!important}

/* ⑦ 시세 카드 이름 · 추이 제목을 섹션 제목(19px) 수준으로 */
.mcard .n{font-size:19px!important}
.tf figcaption{font-size:19px!important}
.tf figcaption span{font-size:13px!important}

/* ⑧ 최저 · 최고 두 배 */
.tpk{font-size:29px!important}
.tpc{font-size:18px!important}

/* ⑨ 박스 안 문구 가운데 정렬 */
.stat{align-items:center!important;text-align:center!important}
.stat b.num{justify-content:center!important}
.mcard{text-align:center!important}
.mcard .t,.mcard .v{justify-content:center!important}
.mcard .mg .ml,.mcard .mg .mr{justify-content:center!important}
.hsum.big b{text-align:center!important}
.hsum.big b i,.hsum.big b span{text-align:center!important}

/* ⑩ 2026년 사회공헌 5칸 : 글씨 + 여백 */
.stats{gap:16px!important}
.stat{padding:21px 18px!important}
.stat .sl{font-size:14.5px!important}
.stat b.num{font-size:35px!important;margin-top:8px!important}
.stat b.num em{font-size:17px!important}
.stat .sn{font-size:13px!important;margin-top:6px!important}
@media (max-width:520px){ .stat b.num{font-size:29px!important} }

/* ⑪ 시세 : 당일값 크기는 그대로 두고 나머지 20% */
.mcard .u{font-size:14.5px!important}
.mcard .ml,.mcard .mr{font-size:16px!important}
.mcard .chg{font-size:17.5px!important}
.mcard .dt{font-size:14.5px!important}
.mgroup{font-size:16.5px!important}

/* ══ 첫 확인 후 보정 (2026-09-07) ══════════════════════════ */
/* ⑧ 2배(32px)로는 그래프 밖으로 넘친다 → 26px + 글자폭 보정 */
.tpk{font-size:26px!important}
.tpc{font-size:16px!important}

/* ⑪ 두 칸(당월평균 | 전월대비)에 20% 키운 글씨가 안 들어가 잘렸다
      → 한 줄에 하나씩 · 가운데 정렬 */
.mcard .mg{grid-template-columns:1fr!important;gap:4px 0!important;margin-top:8px!important}
.mcard .ml,.mcard .mr{justify-content:center!important;gap:8px!important}
.mcard .dt{white-space:normal!important;overflow:visible!important;
  text-overflow:clip!important;line-height:1.45!important}

/* ② 크게 보기 : 패널 제목줄을 걷어내 지도에 높이를 더 준다
      (창 위쪽에 이미 '나눔의 발자취' 제목이 있다) */
.mleft>.panel>.bars:not(.mrow){display:none!important}
.mleft .ylegend{margin-top:6px!important;font-size:14px!important}
.mleft .bars.mrow{margin-bottom:6px!important}

/* ② 한 걸음 더 — 연도 단추와 범례를 지도 위(빈 바다)로 띄워
      패널 높이를 전부 지도에 준다. 748 → 800 대(약 +7%) */
.mleft>.panel{position:relative;padding:6px!important}
.mleft>.panel>.bars.mrow{position:absolute;top:10px;left:12px;right:12px;z-index:3;
  margin:0!important}
.mleft>.panel>.bars.mrow .seg.mon{background:var(--card);
  box-shadow:0 1px 2px rgba(18,60,122,.10),0 6px 16px rgba(18,60,122,.10)}
.mleft>.panel>.mtogwrap,.mleft>.panel>.monwrap{position:absolute;top:52px;left:12px;
  right:12px;z-index:3}
.mleft .ylegend{position:absolute;bottom:10px;left:14px;z-index:3;margin:0!important;
  background:var(--card);border-radius:10px;padding:7px 12px;
  box-shadow:0 1px 2px rgba(18,60,122,.10),0 6px 16px rgba(18,60,122,.10);max-width:52%}
.mleft #map{flex:1 1 auto;min-height:0;height:100%}

/* ══════════════════════════════════════════════════════════════
   추가 요청 4건 (2026-09-08)
   ══════════════════════════════════════════════════════════════ */

/* ① 시세 카드 : 두 줄 형식(당월평균|전월대비)으로 되돌리고 글씨는 최대로.
   4칸 배치에서 칸 폭이 266px 이라 라벨 12.5 / 값 15.5 가 한계다.
   (라벨 13·값 16 은 '미국 달러 ₩1,406' 이 1px 넘친다 — 실측) */
.panel.mkt{padding-left:16px!important;padding-right:16px!important}
.mgrid{gap:10px!important;grid-template-columns:repeat(4,minmax(0,1fr))!important}
@media (max-width:1279px){ .mgrid{grid-template-columns:repeat(2,minmax(0,1fr))!important} }
@media (max-width:699px){ .mgrid{grid-template-columns:1fr!important} }
.mcard{padding:13px 9px 11px!important}
.mcard .mg{grid-template-columns:1fr auto!important;gap:5px 4px!important;margin-top:8px!important}
.mcard .ml,.mcard .mr{gap:6px!important;white-space:nowrap;
  justify-content:flex-start!important}
.mcard .mr{justify-content:flex-end!important}
.mcard .ml span,.mcard .mr span{font-size:12.5px!important}
.mcard .ml b,.mcard .mr b,.mcard .chg{font-size:15.5px!important}

/* ② 뉴스레터 : 왼쪽 호 목록과 기사 제목(링크)만 키운다. 요약은 그대로 */
.iv{font-size:16.5px!important}
.iv em{font-size:13px!important}
.im{font-size:13.5px!important}
.ili{padding:13px 15px!important}
.isect{font-size:14px!important}
.acard h3{font-size:19.5px!important;line-height:1.4!important;font-weight:700!important}
/* .acard p (요약) 는 13px 그대로 둔다 */

/* ③ 크게 보기 : 연도·월별을 왼쪽 한 칸에 모으고 지도를 그 오른쪽으로 밀어낸다.
   월별을 펼쳐도 지도를 덮지 않는다. 지도는 패널 높이를 전부 쓴다 */
@media (min-width:1001px){
  .mleft>.panel{display:grid!important;grid-template-columns:238px minmax(0,1fr);
    grid-template-rows:auto auto 1fr;gap:8px 12px;align-content:start;
    position:relative;padding:10px!important}
  .mleft>.panel>.bars.mrow{position:static!important;grid-column:1;grid-row:1;
    margin:0!important;flex-wrap:wrap;gap:8px}
  .mleft>.panel>.bars.mrow .spacer{display:none!important}
  .mleft>.panel>.bars.mrow .seg.mon{flex-wrap:wrap}
  .mleft>.panel>.monwrap{position:static!important;grid-column:1;grid-row:2;margin:0!important}
  .mleft>.panel>.monwrap .seg.mon{flex-wrap:wrap}
  .mleft>.panel>#map{grid-column:2;grid-row:1 / span 3;height:100%;padding:0!important}
  .mleft .ylegend{position:static!important;grid-column:1;grid-row:3;align-self:end;
    margin:0!important;max-width:none!important;background:none!important;
    box-shadow:none!important;padding:0!important}
}

/* ④ 선택한 지역 상세 : 숫자 위주라 크게 — 일반 화면·크게 화면 모두 */
.detail .dhead h2,.detail h2{font-size:27px!important}
.detail .chip{font-size:13px!important;padding:2px 10px!important}
.kv dt,.d2 .kv dt{font-size:16px!important}
.kv dd,.d2 .kv dd{font-size:20px!important;line-height:1.35!important}
.d2 .kv{gap:6px 12px!important}
.dside .dsum{font-size:15.5px!important;line-height:1.5!important}
.dside .dlink,.dlink{font-size:16px!important}
.dcov{font-size:14px!important}
.mright .kv dt{font-size:16px!important}
.mright .kv dd{font-size:20px!important}

/* ③ 보정 — 폭이 좁으면 왼쪽 칸을 비워 두는 값이 더 크다(1180px 에서 지도 534px 로 줄었다).
   1400px 이상에서만 지도를 오른쪽으로 밀고, 그 아래에서는 지도를 폭 전체로 두고
   연도·월별을 지도 위(왼쪽 바다)에 카드로 얹는다. 자리는 여전히 왼쪽 위 한 곳이다 */
@media (min-width:1001px) and (max-width:1399px){
  .mleft>.panel>#map{grid-column:1 / -1!important}
  .mleft>.panel>.bars.mrow,.mleft>.panel>.monwrap{z-index:3;
    background:var(--card);border-radius:11px;padding:7px!important;
    box-shadow:0 1px 2px rgba(18,60,122,.10),0 6px 16px rgba(18,60,122,.12)}
  /* 월별을 왼쪽 아래로 펼치면 서울·김포 라벨을 덮는다 → 위쪽 한 줄로 길게 펼친다
     (그 띠는 바다·북쪽 여백이라 지도를 가리지 않는다) */
  .mleft>.panel>.monwrap{grid-column:1 / -1!important;justify-self:start;
    max-width:calc(100% - 212px)}
  .mleft>.panel>.monwrap .seg.mon{flex-wrap:nowrap!important}
  .mleft>.panel>.monwrap .seg.mon button{font-size:11px!important;padding:4px 6px!important}
  .mleft .ylegend{z-index:3;background:var(--card)!important;border-radius:11px;
    padding:7px 11px!important;
    box-shadow:0 1px 2px rgba(18,60,122,.10),0 6px 16px rgba(18,60,122,.12)!important}
}

/* ══════════════════════════════════════════════════════════════
   배경 아트 (2026-09-08)
   색은 회장님 작품에서 뽑았다 :
     일출 주황 #EF8229 · 황금 #F5B341 · 청록 #8FC7C4
     인디고 #586FB7 · 심야 남청 #332F4E · 연두 #81AA65 / #B8CE5C
   구도는 그림의 '산 능선 + 호수 반영' 을 아주 옅게 옮긴 것이고,
   색 덩어리는 네 모서리로 몰아 화면 가운데(본문 자리)는 비워 둔다.
   전체 잉크량은 화면의 20% 안쪽 — 카드가 얹히면 대부분 가려진다.
   끄려면 .bgart{display:none} 한 줄이면 된다.
   ══════════════════════════════════════════════════════════════ */
.bgart{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  opacity:.44;contain:paint}
.bgart svg{width:100%;height:100%;display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bgart{opacity:.38}}
:root[data-theme="dark"] .bgart{opacity:.38}
/* 본문은 배경 위에 */
.wrap{position:relative;z-index:1}
/* 카드가 배경을 확실히 덮게 (투명 배경이던 곳만) */
.panel,.hpanel,.hpanel2{background:var(--card)}
@media (prefers-reduced-motion:reduce){ .bgart{opacity:.5} }

/* ══ 바탕 물색 (REAL Summit 2026 방식) ═══════════════════════
   그 사이트의 실제 선언은
     radial-gradient(circle at 0% 0%, #EEF3FB, #FDFDFD 45%, #EEF3FB)
   흰 종이가 아니라 아주 옅은 찬 물색이 깔려 있어 심심함이 사라진다.
   여기에 오른쪽 아래를 회장님 그림의 일출 쪽으로 살짝 기울였다 */
body{background-image:radial-gradient(125% 95% at 6% 0%,
  #EDF3FC 0%, #FDFDFD 38%, #F6F9FE 74%, #FFF6EB 100%)!important;
  background-attachment:fixed!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{
  background-image:radial-gradient(125% 95% at 6% 0%,
    #0B1220 0%, #080C15 46%, #120E12 100%)!important}}
:root[data-theme="dark"] body{background-image:radial-gradient(125% 95% at 6% 0%,
  #0B1220 0%, #080C15 46%, #120E12 100%)!important}

/* ══ 뉴스레터 탭 : 왼쪽 목록 한 줄 · 오른쪽 글씨 확대 (2026-09-08) ══ */
/* 왼쪽 칸이 280px 이라 'Vol. 2026-35 8월 4주차 / 08.24(월) · 3건' 이 두 줄로 꺾였다 */
.arch{grid-template-columns:372px minmax(0,1fr)!important;gap:24px!important}
@media (max-width:1100px){ .arch{grid-template-columns:1fr!important} }
.ili{display:grid!important;grid-template-columns:auto 1fr;align-items:baseline;
  gap:12px!important;padding:14px 16px!important}
.ili .iv,.ili .im,.ili .ilipdf{white-space:nowrap!important}
.ili .im{text-align:right;font-size:14px!important}
.iv{font-size:17.5px!important}
.iv em{font-size:14px!important;margin-left:8px!important}
.search{font-size:15px!important;padding:12px 14px!important}

/* 오른쪽 : 호 제목 · 기간 칩 */
#ipane .dhead h2{font-size:28px!important}
#ipane .dhead .chip{font-size:14.5px!important;padding:3px 12px!important}
#ipane .dsum{font-size:15px!important}
/* 섹션 제목 (함께 나눈 소식 / 업계 · 시장 동향) */
.isect{font-size:17px!important;letter-spacing:.06em!important;margin:26px 0 14px!important}
/* 기사 머리줄 (날짜 · 분류 · 보도 건수 · 매체) */
.imeta{font-size:14px!important;gap:10px!important;margin-bottom:6px!important}
.imeta .chip{font-size:13.5px!important;padding:2px 10px!important}
/* 기사 제목(하이퍼링크) 과 요약 */
.acard h3{font-size:21px!important;line-height:1.4!important}
.acard p{font-size:14px!important;line-height:1.6!important}
.acard{padding:17px 2px 15px!important}

/* ══ 2026년 사회공헌 지표 : 기준 문구를 빼고 숫자를 키운다 (2026-09-08) ══ */
.stat{padding:24px 18px!important}
.stat .sl{font-size:16px!important}
.stat b.num{font-size:44px!important;margin-top:9px!important}
.stat b.num em{font-size:20px!important}
@media (max-width:520px){ .stat b.num{font-size:34px!important} }

/* ══ 모바일 : 크게 보기가 잘리던 것 (2026-09-08) ══════════════
   원인 세 가지
   ① .mleft 가 flex:1 1 auto 라 줄어드는데 안쪽 패널은 min-height:62vh 로 버텨
      패널이 부모 밖으로 밀려 아래 [선택 지역] 칸을 덮었다
   ② 연도·월별 단추를 지도 위에 절대배치해 둔 것이 좁은 화면에서 요약 카드와 겹쳤다
   ③ svg 를 height:100% 로 늘려 잘렸다
   → 좁은 화면에서는 위에서 아래로 자연스럽게 쌓고, 지도는 원래 비율로 둔다 */
@media (max-width:1000px){
  .modal{padding:8px!important}
  .mbody{flex-direction:column!important;overflow-y:auto!important;
    -webkit-overflow-scrolling:touch;gap:10px!important;padding:8px!important}
  .mleft{flex:0 0 auto!important;width:100%!important}
  .mright{flex:0 0 auto!important;width:100%!important;overflow:visible!important}
  .mleft>.panel{min-height:0!important;height:auto!important;overflow:visible!important;
    display:block!important;padding:12px 12px 14px!important;position:static!important}
  /* 조작 단추를 지도 위에서 내려 제자리로 */
  .mleft>.panel>.bars.mrow,.mleft>.panel>.monwrap{position:static!important;
    background:none!important;box-shadow:none!important;padding:0!important;
    margin:0 0 8px!important;max-width:none!important;grid-column:auto!important}
  .mleft>.panel>.bars.mrow .spacer{display:block!important}
  .mleft>.panel>.monwrap .seg.mon{flex-wrap:wrap!important}
  .mleft>.panel>.monwrap .seg.mon button{font-size:12.5px!important;padding:6px 9px!important}
  /* 지도는 원래 비율 그대로 (잘림 없음) */
  .mleft #map{height:auto!important;width:100%!important;display:block!important;padding:0!important}
  .mleft svg.kmap{width:100%!important;height:auto!important;
    max-height:none!important;max-width:100%!important}
  .mleft .ylegend{position:static!important;background:none!important;box-shadow:none!important;
    padding:0!important;margin:8px 0 0!important;max-width:none!important}
  .mleft>.panel>.bars:not(.mrow){display:flex!important}
}

/* ══ 시세 카드 : 당월평균·전월평균을 왼쪽에 붙인다 ══════════════
   가운데(당월평균) 와 오른쪽(전월대비) 이 섞여 어색했다 */
.mcard .mg .ml,.mcard .ml{justify-content:flex-start!important;text-align:left!important}
.mcard .mg .mr,.mcard .mr{justify-content:flex-end!important;text-align:right!important}

/* ══ 모바일 : 지도 배율 · 전달 기록 이동 (2026-09-08) ══════════
   폰에서는 지도의 가로폭이 화면폭에 묶여 '크게'를 눌러도 커지지 않는다.
   (390px 화면 : 일반 350px vs 크게 334px — 오히려 작아진다)
   → 화면폭을 넘겨 그리고 손가락으로 끌어 보게 한다 */
.mzoom{display:none}
.jumprec{display:none}

@media (max-width:1000px){
  /* 배율 단추 — 창 머리 오른쪽, 닫기 앞 */
  .mzoom{display:inline-flex;gap:0;border:1px solid rgba(255,255,255,.35);
    border-radius:999px;overflow:hidden;margin-right:8px}
  .mzoom button{background:transparent;border:0;color:#fff;font:inherit;font-size:13px;
    font-weight:700;padding:7px 11px;cursor:pointer;
    border-left:1px solid rgba(255,255,255,.22)}
  .mzoom button:first-child{border-left:0}
  .mzoom button[aria-pressed="true"]{background:#fff;color:var(--acc)}

  /* 지도 칸을 스크롤 상자로 — 배율이 1배면 스크롤이 생기지 않는다 */
  .mleft #map{overflow:auto!important;-webkit-overflow-scrolling:touch;
    max-height:66vh!important;overscroll-behavior:contain;
    border-radius:12px;background:var(--card2)}
  .mleft svg.kmap{width:calc(100% * var(--mz,1))!important;height:auto!important;
    max-width:none!important;max-height:none!important}
  /* 2배 이상에서는 요약 카드가 화면 밖으로 나가므로 창 머리 문구로 갈음된다 */

  /* [전달 기록으로] — 일반 화면의 지도 밑 */
  .jumprec{display:block;width:100%;margin-top:12px;border:1px dashed var(--line);
    background:transparent;color:var(--acc);border-radius:11px;padding:13px;
    font:inherit;font-size:15px;font-weight:700;cursor:pointer}
  .jumprec b{font-weight:800}
  .jumprec:active{background:var(--acc-w)}
  .mright .jumprec,.mleft .jumprec{display:none}   /* 크게 보기 창 안에서는 숨긴다 */
}

/* 좁은 폰에서 창 머리가 과밀해 제목·닫기가 두 줄로 꺾였다 */
@media (max-width:1000px){
  .mhead{gap:7px!important;flex-wrap:nowrap!important;align-items:center}
  .mhead b{font-size:14.5px;white-space:nowrap}
  .mclose{white-space:nowrap;padding:7px 11px!important;font-size:13px!important}
  .mzoom button{white-space:nowrap;padding:7px 9px!important;font-size:12.5px!important}
  .mzoom{margin-right:6px!important}
}
@media (max-width:520px){ .mhead .mnote{display:none} }

/* ══════════════════════════════════════════════════════════════
   지도 전체화면 머리줄 : 다른 겹침창(원자재 · 환율 변동, #tmodal)과
   같은 수준으로 — 지금까지는 진한 덮개 위에 흰 글씨만 놓인 맨 얼굴이라
   휑해 보였다. #tmodal 처럼 판을 깔고 왼쪽에 색 띠를 세우고, 제목을
   굵고 크게, 부제(mnote)도 늘 보이게 한다. 폭이 좁으면 제목을 한 줄
   통째로 쓰고 그 아래 부제 · 배율 · 닫기를 두 번째 줄로 내린다.
   (넓은 화면(≥1001px)은 "머리줄을 걷어 지도에 높이를 준다" 는 별도
   의도된 디자인이 있어 그대로 두고, 이 판은 ≤1000px 에서만 켠다)
   — 요청 2026-09-16, 9차 */
@media (max-width:1000px){
  #modal .mhead{flex-wrap:wrap!important;row-gap:6px!important;
    padding:12px 14px 12px 18px!important;margin-bottom:10px!important;
    background:linear-gradient(90deg,rgba(3,20,38,.94) 0%,rgba(3,20,38,.90) 62%,
      rgba(3,20,38,.88) 100%)!important;
    border:1px solid rgba(255,255,255,.16)!important;border-radius:14px!important;
    box-shadow:0 6px 22px rgba(0,0,0,.34)!important;
    position:relative!important;overflow:hidden!important}
  #modal .mhead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
    background:linear-gradient(180deg,#54AAEA 0%,#0F6FBE 100%)}
  #modal .mhead b{flex:1 1 100%!important;font-size:19px!important;font-weight:800!important;
    letter-spacing:-.01em!important;text-shadow:0 1px 10px rgba(0,0,0,.45)}
  #modal .mhead .mnote{display:block!important;flex:1 1 auto!important;
    font-size:12.5px!important;opacity:.85!important;white-space:normal!important}
  #modal .mhead .spacer{display:none!important}
  #modal .mzoom{margin-left:auto!important}
}

/* ══ 시세 카드 : 밑줄 문구를 걷어낸 자리를 글씨로 (2026-09-08) ══
   '09.07 종가 · 당월 5영업일 · 전일 09.04' 는 앞부분이 큰 숫자 옆과 중복이고
   나머지는 카드 툴팁·아래 안내 문구가 맡는다.
   좌우 두 칸(당월평균|전월대비)은 폭이 266px 이라 15.5px 가 한계 — 그대로 두고
   품목명과 당일값만 키운다 */
.mcard{padding:15px 11px 14px!important}
.mcard .n{font-size:22px!important;letter-spacing:-.01em}
.mcard .u{font-size:15.5px!important}
.mcard .t{gap:8px!important;margin-bottom:2px}
.mcard .v{font-size:35px!important;margin-top:5px!important}
.mcard .v .vl{font-size:14px!important;font-weight:700}
.mcard .mg{margin-top:12px!important;padding-top:11px!important;
  border-top:1px solid var(--line2)}
@media (max-width:520px){ .mcard .v{font-size:30px!important} .mcard .n{font-size:20px!important} }

/* ══ 탭 이름이 낱말 중간에서 꺾이던 것 (2026-09-08) ══════════
   '나눔의 발 / 자취' → '나눔의 / 발자취'.
   한글은 word-break 기본값이 낱말을 쪼개므로 keep-all 로 띄어쓰기에서만 꺾는다 */
.tabs button{word-break:keep-all;overflow-wrap:normal;text-wrap:balance}
.tabs .cnt{word-break:keep-all}
@media (max-width:700px){
  .tabs button{padding:10px 13px!important;line-height:1.3}
}

/* 아주 좁은 폰(360px)에서 탭이 세 줄로 늘어지던 것 */
@media (max-width:390px){
  .tabs button{padding:9px 11px!important;font-size:16px!important}
  .tabs .cnt{font-size:12px!important;margin-left:4px!important}
}

/* ══ 소제목 : 위계 정리 (C안 + 색은 막대에만) 2026-09-08 ══════
   문제는 절대 크기가 아니라 위계가 뒤집혀 있던 것.
     소제목 19px < 품목명 22px < 지표 숫자 44px  → 라벨로 읽히지 않았다
   → 제목은 화면에서 가장 진한 잉크로 27px, 계열색은 왼쪽 막대와 아래 선이 맡는다
     (시세 = 인디고 --mkt · 나눔 = 남색 --acc)
   오른쪽 부연 문구(월평균 기준 · 확인분 39곳)는 세 곳에 중복이라 감춘다.
   단 #sheadn 은 크게 보기 창 머리 문구로 쓰이므로 지우지 않고 감추기만 한다 */
.shead{align-items:center!important;gap:12px!important;
  margin:28px 0 15px!important;padding-bottom:11px!important;
  border-bottom:1px solid var(--line)}
.trhead{margin-top:22px!important;border-bottom-color:var(--mkt-ln)!important}
.sect{font-size:27px!important;font-weight:800!important;letter-spacing:-.03em!important;
  color:var(--ink)!important;padding-left:16px;position:relative;line-height:1.2}
.trhead .sect{color:var(--ink)!important}
.sect::before{position:absolute!important;left:0;top:50%;
  transform:translateY(-50%)!important;margin:0!important;
  width:5px!important;height:1.02em!important;border-radius:3px!important;
  background:var(--acc)}
.trhead .sect::before{background:var(--mkt)}
.shead .ttog{font-size:13.5px!important}
/* 부연 문구 감추기 */
.shead .sub2,.shead #sheadn{display:none!important}
@media (max-width:560px){
  .sect{font-size:23px!important;padding-left:13px}
  .sect::before{width:4px!important}
  .shead{margin:22px 0 13px!important;gap:9px!important}
}

/* ══ 탭 : 누를 수 있는 것으로 보이게 (2026-09-08) ══════════════
   지금은 고른 탭만 채워져 있고 나머지는 맨 글씨라 '글자'로 읽힌다.
   → 미선택 탭에도 흰 배경 + 테두리 + 옅은 그림자를 줘 단추로 보이게 한다
   (세그먼트 트랙 방식은 390px 에서 '원자재 · 환율 시세' 가 세 줄로 무너져 접었다) */
.tabs{gap:9px!important;flex-wrap:wrap}
.tabs button{background:var(--card)!important;border:1px solid var(--line)!important;
  border-radius:999px!important;color:var(--body)!important;
  box-shadow:0 1px 2px rgba(18,60,122,.06)!important;
  transition:border-color .15s,color .15s,background .15s,box-shadow .15s}
.tabs button::before{display:none!important}
.tabs button:hover{border-color:var(--acc)!important;color:var(--acc)!important;
  box-shadow:0 2px 8px rgba(18,60,122,.12)!important}
.tabs button:active{transform:translateY(1px)}
.tabs button[aria-selected="true"]{background:var(--acc)!important;color:#fff!important;
  border-color:var(--acc)!important;
  box-shadow:0 2px 10px rgba(18,60,122,.26)!important}
.tabs button[aria-selected="true"] .cnt{color:rgba(255,255,255,.82)!important}
.tabs button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
:root[data-theme="dark"] .tabs button{box-shadow:0 1px 2px rgba(0,0,0,.5)!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button{
  box-shadow:0 1px 2px rgba(0,0,0,.5)!important}}

/* ══ 시세 탭 제목·묶음 이름 : 소제목과 같은 위계로 (2026-09-08) ══
   '원자재 · 환율 시세' 와 '원자재 / 유가 · 나프타 / 환율' 이 본문보다 작아
   머리로 읽히지 않았다. 소제목과 같은 규칙(잉크 글자 + 계열색 막대)을 쓴다 */
.mkt .ptitle{font-size:25px!important;font-weight:800!important;
  letter-spacing:-.03em!important;color:var(--ink)!important;
  padding-left:16px;position:relative;margin-bottom:6px!important;gap:14px!important}
.mkt .ptitle::before{content:"";position:absolute;left:0;top:50%;
  transform:translateY(-50%);width:5px;height:1.02em;border-radius:3px;
  background:var(--mkt)}
.mkt .ptitle::after{background:var(--mkt-ln)!important}

/* 묶음 이름 (원자재 / 유가 · 나프타 / 환율) */
.mkt .mgroup{font-size:24px!important;font-weight:800!important;
  font-family:"Gothic A1",sans-serif;color:var(--ink)!important;
  letter-spacing:-.02em!important;margin:26px 0 11px!important;
  padding-left:13px;position:relative;display:flex;align-items:center;gap:12px}
.mkt .mgroup::before{content:"";position:absolute;left:0;top:50%;
  transform:translateY(-50%);width:4px;height:.95em;border-radius:2px;
  background:var(--mkt);opacity:.55}
.mkt .mgroup::after{content:"";flex:1;height:1px;background:var(--mkt-ln)}
.mkt .mgroup:first-of-type{margin-top:18px!important}
@media (max-width:560px){
  .mkt .ptitle{font-size:21px!important;padding-left:13px}
  .mkt .mgroup{font-size:17px!important;margin:22px 0 10px!important}
}

/* ══ 시세 기준일 알약 (2026-09-08 신설 · 2026-09-16 위치 수정) ══
   처음엔 .ptitle 혼자 행 전체를 썼던 때라 제목 뒤로 늘어나는 선의
   끝에 알약을 붙이는 order 트릭으로 '제목 줄 오른쪽 끝'을 흉내냈다.
   그 뒤 같은 행에 12개월/5개년/전체이력 토글이 들어오면서 .ptitle 상자
   자체가 좁아져, 그 안에서 늘어나던 선+알약이 못 들어가고 아래 줄
   왼쪽으로 떨어졌다. → .ptitle 안에 두지 않고 .bars 행에서 스페이서와
   토글 사이의 제 자리로 옮긴다(마크업 참고) — 이제 제목 폭과 무관하게
   토글 바로 왼쪽에 늘 붙는다 */
.mkt .asof{font-family:"Gothic A1",sans-serif;
  font-size:14px;font-weight:700;letter-spacing:0;color:var(--mkt);
  background:var(--mkt-bg);border:1px solid var(--mkt-ln);
  border-radius:999px;padding:5px 13px;white-space:nowrap;
  font-variant-numeric:tabular-nums}
@media (max-width:560px){
  .mkt .asof{font-size:13px;padding:4px 11px}
}

/* 로마자 이름 보정 (Dubai · Brent · WTI · Naphtha) — 눈에 보이는 크기를 맞춘다 */
.mcard .n.en{font-size:25px!important;letter-spacing:-.02em}
@media (max-width:520px){ .mcard .n.en{font-size:22.5px!important} }

/* 시세 제목 줄 : 모바일에서 기준일 알약이 아래로 내려가며 막대가 어긋난 것 */
.mkt .ptitle::before{top:.1em!important;transform:none!important}
/* 알약이 .ptitle 밖으로 나갔으므로(위 참고) 이 안에서 선을 숨기고
   margin-left:auto 로 밀어내던 옛 규칙은 더 필요 없다 — 2026-09-16 */
@media (max-width:700px){
  /* 폭이 좁으면 제목이 한 줄을 통째로 쓰고, 기준일·토글은 다음 줄에서
     함께 오른쪽으로 몰린다(스페이서가 앞에서 밀어준다) */
  .mkt .bars{row-gap:8px}
  .mkt .ptitle{flex:1 1 100%}
}

/* ══ 주간 동행 / 주간 성장 : 글씨 확대 (2026-09-08) ══════════
   보는 사람의 나이대를 생각하면 이 칸은 무조건 커야 읽힌다.
   제목은 소제목과 같은 규칙(잉크 글자 + 계열색 막대)으로 맞춘다
   나눔 = 남색 --acc · 소식 = 청록 --news */
.hpanel .ptitle,.hpanel2 .ptitle{font-size:24px!important;font-weight:800!important;
  letter-spacing:-.03em!important;color:var(--ink)!important;
  padding-left:15px;position:relative;margin-bottom:12px!important;gap:12px!important}
.hpanel .ptitle::before,.hpanel2 .ptitle::before{content:"";position:absolute;left:0;
  top:.1em;width:5px;height:1.02em;border-radius:3px;background:var(--acc)}
.hpanel2 .ptitle::before{background:var(--news)}
.hpanel .ptitle::after{background:var(--line)}
.hwin{font-size:15px!important;font-weight:700!important}

/* 숫자 타일 4개 */
/* 값이 길어지면(797명 · 110건 · 8.5억 원) 1fr 칸이 내용 폭 아래로 못 줄어
   패널 밖으로 밀려 잘렸다. 칸을 줄일 수 있게 하고(minmax) 여백·글씨를
   내용에 맞춘다 — 실측 기준 최악값 '8.5억 원' (요청 2026-09-21) */
.hsum.big{gap:10px!important;margin-top:6px!important;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important}
.hsum.big b{padding:14px 10px 12px!important;min-width:0!important}
.hsum.big b i{font-size:26px!important}
/* 좌우 3단이 유지되는 중간 폭에서는 칸이 더 좁아진다(실측 75px) */
@media (max-width:1279px){
  .hsum.big b{padding:13px 6px 11px!important}
  .hsum.big b i{font-size:21px!important}
  .hsum.big b span{font-size:13px!important}
}
.hsum.big b span{font-size:15px!important;margin-top:4px!important}

/* 기사 미리보기 */
.hrel{margin-top:15px!important;padding-top:12px!important}
.hrel .hrt{margin-bottom:8px!important}
.hrel .hrt b{font-size:16px!important}
.hrl{padding:10px 0!important;gap:11px!important}
.hrl .d{font-size:15px!important}
.hrl .t{font-size:17.5px!important}

/* 전체 보기 · 각주 */
.hmore{font-size:16.5px!important;padding:13px!important;margin-top:11px!important}
.hnote{font-size:14.5px!important;line-height:1.6!important;margin-top:14px!important}
@media (max-width:560px){
  .hpanel .ptitle,.hpanel2 .ptitle{font-size:21px!important;padding-left:13px}
  .hsum.big b i{font-size:26px!important}
  .hrl .t{font-size:16.5px!important}
}

/* 글씨를 키우자 제목이 8~9자에서 잘렸다(목포지역 중·고·...).
   한 줄을 지키면 읽히는 글자가 너무 줄어드니 두 줄까지 허용하고
   넘칠 때만 … 로 자른다 (칸 높이는 두 줄에서 고정) */
.hrl{align-items:start!important}
.hrl .d{padding-top:2px}
.hrl .t{white-space:normal!important;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  line-height:1.4}

/* ══ 남은 칸 제목들도 같은 규칙으로 (2026-09-08) ══════════════
   '기사 75건' · '전달 기록 39곳' 처럼 상자 안 소제목이 본문보다 작았다.
   잉크 글자 + 계열색 막대 (나눔 = 남색 / 소식 = 청록) 로 통일한다.
   .mkt · .hpanel 쪽은 앞서 각각 지정했고 선택자가 더 좁아 그대로 유지된다 */
.ptitle{font-size:22px!important;font-weight:800!important;letter-spacing:-.03em!important;
  color:var(--ink)!important;padding-left:15px;position:relative;
  margin-bottom:13px!important;gap:12px!important}
.ptitle::before{content:"";position:absolute;left:0;top:.1em;
  width:5px;height:1.02em;border-radius:3px;background:var(--acc)}
.ptitle .pn{font-size:15px!important;font-weight:700!important;margin-left:0!important}
/* 기사 칸은 '소식' 계열(청록) */
.nbar .ptitle::before,.ptitle.nt::before{background:var(--news)}
.ptitle.nt{font-size:23px!important}
.ptitle.nt .pn{font-size:15.5px!important}
/* 분류 칩 */
.seg.cat button{font-size:15px!important;padding:8px 14px!important}
.seg.cat button em{font-size:13px!important;margin-left:6px!important}
/* 전달 기록 칸 */
#elistn{font-size:15px!important}
@media (max-width:560px){
  .ptitle{font-size:19.5px!important;padding-left:13px}
  .ptitle.nt{font-size:20.5px!important}
  .seg.cat button{font-size:14px!important;padding:7px 12px!important}
}

/* 더 보기 단추 */
.moreb{font-size:16.5px!important;padding:13px!important;margin-top:13px!important;
  border-radius:11px!important}

/* 미리보기 기사 제목은 크게 키우면 잘려서 오히려 안 읽힌다 → 살짝만.
   두 줄까지 허용해 내용이 최대한 남게 한다 */
.hrl .t{font-size:15.5px!important;line-height:1.42!important}
@media (max-width:560px){ .hrl .t{font-size:15.5px!important} }

/* '기사 75건' 의 막대가 글자를 덮고 있었다 — 좁은 화면 규칙이 padding 을 되돌려서 */
.ptitle{padding-left:15px!important}
@media (max-width:560px){ .ptitle{padding-left:13px!important} }

/* ══ 머리 제목 : 화면에서 가장 큰 것이어야 한다 (2026-09-08) ══
   29px 은 소제목 27px 과 거의 같아 '가장 큰 제목' 으로 읽히지 않았다.
   명조 그대로 두고 크기·자간·막대를 키워 격을 올린다 */
header{align-items:center!important;padding-bottom:20px!important;
  border-bottom:2.5px solid var(--ink)!important;gap:20px!important}
.brand{gap:16px!important;align-items:center!important}
.brand .bar{width:7px!important;height:62px!important;border-radius:4px!important;
  background:linear-gradient(180deg,var(--acc),var(--mkt))!important}
h1{font-size:42px!important;letter-spacing:-.035em!important;line-height:1.12!important;
  font-weight:700!important}
.sub{font-size:15px!important;margin-top:7px!important;color:var(--body)!important;
  letter-spacing:-.01em}
.logo{height:40px!important}
@media (max-width:900px){
  h1{font-size:34px!important}
  .brand .bar{height:52px!important;width:6px!important}
  .sub{font-size:14px!important}
  .logo{height:34px!important}
}
@media (max-width:520px){
  h1{font-size:29px!important}
  .brand .bar{height:44px!important;width:5px!important}
  .sub{font-size:13.5px!important}
}

/* 막대가 제목·부제 블록 전체를 감싸게 (모바일에서 부제가 두 줄이 되면 어긋났다) */
.brand{align-items:stretch!important}
.brand .bar{height:auto!important;align-self:stretch!important;min-height:56px}
@media (max-width:520px){ .brand .bar{min-height:46px} }

/* ══ 분류 칩을 한 줄로 (2026-09-08) ══════════════════════════
   글씨를 키우자 '기타 2' 가 둘째 줄로 떨어졌다.
   줄바꿈을 막고 칩이 줄어들지 않게 고정한 뒤, 좁은 화면에서는 옆으로 밀어 본다 */
.seg.cat{flex-wrap:nowrap!important;overflow-x:auto!important;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;max-width:100%}
.seg.cat::-webkit-scrollbar{height:0}
.seg.cat button{flex:0 0 auto!important;white-space:nowrap!important}

/* 칩 줄이 오른쪽 끝에 붙어 있어(스페이서 뒤) 폭이 부족하면 첫 칩('전체')이
   왼쪽으로 밀려 잘렸다 → 칩 줄을 제 줄 전체로 내려 왼쪽부터 채운다 */
.bars.nbar{flex-wrap:wrap!important;row-gap:12px!important}
.bars.nbar .spacer{display:none!important}
.bars.nbar .ptitle{flex:1 1 100%!important}
.seg.cat{flex:1 1 100%!important;justify-content:flex-start!important;
  display:flex!important;width:100%!important;max-width:100%!important}

/* 한 줄에 맞춘 최종 치수 — 1440px 에서 딱 맞고(544), 더 좁으면 옆으로 밀어 본다.
   밀리는 상황이 보이게 오른쪽 끝을 흐리게 처리한다 */
.seg.cat{gap:5px!important;padding:5px!important;
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),transparent 100%);
  mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),transparent 100%)}
.seg.cat button{font-size:13.5px!important;padding:5px 9px!important}
.seg.cat button em{font-size:12px!important;margin-left:5px!important}
@media (max-width:560px){ .seg.cat button{font-size:13px!important;padding:5px 8px!important} }

/* ══════════════════════════════════════════════════════════════
   ① 배경을 더 또렷하게 + 첫 화면에도 배경
   ② 모바일 그래프 터치 조회
   ③ 로고·계열색을 CI 원본 값으로 (파랑 #1478C7 · 주황 #F46F1B)
   ④ 크게 보기 좌상단 연도·월별 글씨 확대
                                              2026-09-08
   ══════════════════════════════════════════════════════════════ */

/* ── ① 배경 : 너무 연해 식별이 안 됐다 → 44% → 78% ─────────── */
.bgart{opacity:.78!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bgart{opacity:.60!important}}
:root[data-theme="dark"] .bgart{opacity:.60!important}
/* 바탕 물색도 한 단 진하게 */
body{background-image:radial-gradient(125% 95% at 6% 0%,
  #E4EEFB 0%, #FBFDFF 40%, #EFF5FE 74%, #FFF0DE 100%)!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{
  background-image:radial-gradient(125% 95% at 6% 0%,
    #0D1626 0%, #080C15 46%, #1A1310 100%)!important}}
:root[data-theme="dark"] body{background-image:radial-gradient(125% 95% at 6% 0%,
  #0D1626 0%, #080C15 46%, #1A1310 100%)!important}
/* 첫 화면(인트로) 배경 */
.intro{background:var(--bg)!important;overflow:hidden}
.bgart.in{position:absolute!important;inset:0;z-index:0;opacity:.9!important}
.intro .ib{position:relative;z-index:1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bgart.in{opacity:.7!important}}
:root[data-theme="dark"] .bgart.in{opacity:.7!important}

/* ── ② 터치로 잡은 점 · 값 말풍선 ─────────────────────────── */
.hp.on .ch,.hp.on .hd{opacity:1}
.hp.on .hd{r:7}
.tpick{pointer-events:none}
.tpick .tpb{fill:var(--ink);opacity:.94}
/* 말풍선 글씨 : 13 → 15.5px. 소수점(₩1,556.98)까지 들어가므로 조금 키웠다 (2026-09-10) */
.tpick .tpt{fill:var(--card);font-family:"Gothic A1",sans-serif;font-size:15.5px;
  font-weight:800;text-anchor:middle;font-variant-numeric:tabular-nums}
.tpick .tpb{stroke:rgba(255,255,255,.30);stroke-width:1}

/* ── ③ 주간 동행 = 주황 · 주간 성장 = 파랑 (CI 원본색) ────── */
:root{ --ci-or:#F46F1B; --ci-bl:#1478C7; }
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ci-or:#FF8F49; --ci-bl:#54AAEA; }}
:root[data-theme="dark"]{ --ci-or:#FF8F49; --ci-bl:#54AAEA; }

.hpanel .ptitle{color:var(--ci-or)!important}
.hpanel .ptitle::before{background:var(--ci-or)!important}
.hpanel .hsum.big b.k{border-color:var(--ci-or)!important;
  background:color-mix(in srgb, var(--ci-or) 12%, var(--card))!important}
.hpanel .hsum.big b.k i{color:var(--ci-or)!important}
.hpanel .hrl .d,.hpanel .hmore{color:var(--ci-or)!important}
.hpanel .hmore:hover{border-color:var(--ci-or)!important;
  background:color-mix(in srgb, var(--ci-or) 8%, transparent)!important}
.hpanel .hrl:hover .t{color:var(--ci-or)!important}

.hpanel2 .ptitle{color:var(--ci-bl)!important}
.hpanel2 .ptitle::before{background:var(--ci-bl)!important}
.hpanel2 .hsum.big b.k{border-color:var(--ci-bl)!important;
  background:color-mix(in srgb, var(--ci-bl) 12%, var(--card))!important}
.hpanel2 .hsum.big b.k i{color:var(--ci-bl)!important}
.hpanel2 .hrl .d,.hpanel2 .hmore{color:var(--ci-bl)!important}
.hpanel2 .hmore:hover{border-color:var(--ci-bl)!important;
  background:color-mix(in srgb, var(--ci-bl) 8%, transparent)!important}
.hpanel2 .hrl:hover .t{color:var(--ci-bl)!important}
/* 로고는 벡터라 어두운 배경에서도 색이 살아 있다 — 흰 판을 얇게만 */
.logo{height:42px!important}
:root[data-theme="dark"] .logo{padding:4px 8px!important}

/* ── ④ 크게 보기 : 연도·월별 단추 글씨 확대 ───────────────── */
@media (min-width:1001px){
  .mleft>.panel>.bars.mrow .seg.mon button{font-size:16.5px!important;
    padding:9px 13px!important}
  .mleft>.panel>.bars.mrow .seg.mon button em{font-size:13px!important;
    margin-left:5px!important}
  .mleft>.panel>.bars.mrow .mtog{font-size:15.5px!important;padding:9px 14px!important}
  .mleft>.panel>.monwrap .seg.mon button{font-size:15px!important;padding:8px 11px!important}
}
@media (min-width:1001px) and (max-width:1399px){
  .mleft>.panel>.monwrap .seg.mon button{font-size:13px!important;padding:6px 9px!important}
  .mleft>.panel>.monwrap{max-width:calc(100% - 200px)!important}
}

/* 기사 카드 바닥 : 매체명 · [지도에서 보기 →] 도 키운다 */
.ifoot .pr{font-size:14.5px!important;font-weight:600!important}
.mlink{font-size:14.5px!important;font-weight:700!important}
.alist .ai .m{font-size:14px!important}
.alist .ai .m .pr{font-size:14px!important;font-weight:600!important}
.card p{font-size:13.5px!important}
@media (max-width:560px){
  .ifoot .pr,.mlink{font-size:14px!important}
}

/* 연도 단추는 '.mapbox #yr button' (ID 포함) 이 더 좁아 앞 규칙이 밀렸다 → ID 로 지정 */
@media (min-width:1001px){
  .mleft #yr button{font-size:16.5px!important;padding:9px 13px!important}
  .mleft #yr button em{font-size:13px!important;margin-left:5px!important}
  .mleft #mon button{font-size:15px!important;padding:8px 11px!important}
}
@media (min-width:1001px) and (max-width:1399px){
  .mleft #mon button{font-size:13px!important;padding:6px 9px!important}
}

/* ══ 기사 카드 : 매체명·[지도에서 보기] 줄을 카드 맨 아래로 (2026-09-09) ══
   제목 길이가 달라 이 줄의 높이가 카드마다 달랐다. 상자 높이는 격자가 이미
   같게 맞춰 주므로, 이 줄만 아래로 밀면 한 줄에 나란히 정렬된다 */
.cards{align-items:stretch!important}
.cards>.card{display:flex!important;flex-direction:column!important;height:100%}
.cards>.card .ifoot{margin-top:auto!important;padding-top:11px!important}
/* 요약이 없는 카드도 아래로 밀리게 — 제목 아래 여백이 늘어난다 */
.cards>.card h3{margin-bottom:0!important}
.cards>.card p{flex:0 0 auto!important;margin-top:7px!important}
/* 대문 기사(큰 카드)는 격자 밖이라 그대로 둔다 */
.bigart .ifoot{margin-top:12px!important}

/* [지도에서 보기] 단추의 위아래 여백(2px+2px) 때문에 그 줄만 4px 높아
   같은 행에서 글자 높이가 어긋났다 → 여백을 없애고 줄 높이를 고정한다 */
.ifoot{min-height:22px}
.ifoot .mlink{padding:0!important;line-height:1.4!important}
.ifoot .pr{line-height:1.4!important}

/* ══ 크게 보기 좌측 조작 칸을 제대로 짜기 (2026-09-09) ══════════
   238px 칸에 알약 단추가 2개씩 접히며 흩어져 성의 없이 보였다.
   → 세로 목록으로 바꾼다. 한 줄에 하나, 연도는 왼쪽 · 건수는 오른쪽 끝.
     머리에 '기간' 라벨을 달고, 월별은 칸 폭 전체를 쓰는 단추로 만든다 */
/* 1400px 미만에서는 조작 칸이 지도 위에 얹히므로 세로 목록이 지도를 가린다
   (1180px 실측 : 김포·금천·평택·공주·군산이 목록 밑으로 들어갔다)
   → 세로 목록은 왼쪽 칸이 따로 있는 1400px 이상에서만 쓴다 */
@media (min-width:1400px){
  .mleft>.panel>.bars.mrow{display:block!important}
  .mleft>.panel>.bars.mrow::before{content:"기간";display:block;
    font-family:"Gothic A1",sans-serif;font-size:12.5px;font-weight:800;
    letter-spacing:.14em;color:var(--mute);margin:2px 0 8px 4px}

  /* 연도 목록 */
  .mleft #yr{display:grid!important;grid-template-columns:1fr!important;
    gap:3px!important;background:var(--card)!important;border:1px solid var(--line)!important;
    border-radius:14px!important;padding:7px!important;width:100%!important;
    box-shadow:0 1px 2px rgba(18,60,122,.07),0 8px 20px rgba(18,60,122,.09)!important}
  .mleft #yr button{display:flex!important;align-items:center!important;
    justify-content:space-between!important;width:100%!important;
    border-radius:9px!important;padding:11px 13px!important;
    font-size:16.5px!important;font-weight:700!important;text-align:left!important;
    border:0!important;background:transparent!important;color:var(--body)!important}
  .mleft #yr button::before{display:none!important}
  .mleft #yr button em{font-style:normal;font-size:13.5px!important;font-weight:700!important;
    opacity:1!important;margin:0!important;color:var(--mute)!important;
    font-variant-numeric:tabular-nums}
  .mleft #yr button:hover{background:var(--acc-w)!important;color:var(--acc)!important}
  .mleft #yr button[aria-pressed="true"]{background:var(--acc)!important;color:#fff!important}
  .mleft #yr button[aria-pressed="true"] em{color:rgba(255,255,255,.8)!important}

  /* 월별 여닫이 — 칸 폭 전체 */
  .mleft #mtog{display:flex!important;width:100%!important;justify-content:center!important;
    margin-top:8px!important;border-radius:11px!important;padding:11px!important;
    font-size:15.5px!important;font-weight:700!important;background:var(--card)!important;
    border:1px solid var(--line)!important;
    box-shadow:0 1px 2px rgba(18,60,122,.07),0 8px 20px rgba(18,60,122,.09)!important}
  .mleft #mtog:hover{border-color:var(--acc)!important;color:var(--acc)!important}

  /* 월 선택 — 4칸 격자 */
  .mleft #mon{display:grid!important;grid-template-columns:repeat(4,1fr)!important;
    gap:4px!important;background:var(--card)!important;border:1px solid var(--line)!important;
    border-radius:14px!important;padding:7px!important;width:100%!important;
    box-shadow:0 1px 2px rgba(18,60,122,.07),0 8px 20px rgba(18,60,122,.09)!important}
  .mleft #mon button{border:0!important;background:transparent!important;
    border-radius:8px!important;padding:9px 4px!important;font-size:14px!important;
    font-weight:700!important;color:var(--body)!important;text-align:center!important}
  .mleft #mon button::before{display:none!important}
  .mleft #mon button:hover:not(:disabled){background:var(--acc-w)!important;color:var(--acc)!important}
  .mleft #mon button[aria-pressed="true"]{background:var(--acc)!important;color:#fff!important}
  .mleft>.panel>.monwrap{margin-top:8px!important;max-width:none!important}
}

/* 1400px 미만 : 월 단추가 '1 / 월' 로 꺾였다 → 한 줄로 고정 */
@media (min-width:1001px) and (max-width:1399px){
  .mleft #mon button{white-space:nowrap!important;font-size:12.5px!important;
    padding:6px 8px!important}
}

/* ══ CI 정식 색으로 교정 (2026-09-09) ══════════════════════════
   .ai 렌더에서 뽑은 값(#1478C7 / #F46F1B)은 근사치였다.
   CI 규격 :
     Boiler Blue    Pantone 300 C · C100 M45 · R0 G113 B190  → #0071BE
     Boiler Orange  Pantone 158 C                            → #E87722
   (주황은 CI 문서에 RGB 표기가 없어 Pantone 158 C 의 sRGB 환산값을 썼다)
   어두운 화면에서는 명암비 때문에 같은 색조를 밝게 올린 값을 쓴다 */
:root{ --ci-bl:#0071BE; --ci-or:#E87722; }
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ci-bl:#4FA6E8; --ci-or:#FF9247; }}
:root[data-theme="dark"]{ --ci-bl:#4FA6E8; --ci-or:#FF9247; }

/* ══════════════════════════════════════════════════════════════
   ② 모바일 로고를 우측 최상단으로
   ③ 배경 10% 더 또렷하게 (산 능선이 산으로 읽히게)
   ④ 12개월 추이 카드를 밝은 브랜드 색으로
                                              2026-09-09
   ══════════════════════════════════════════════════════════════ */

/* ── ② 모바일 : 로고를 머리 오른쪽 끝 위로 ─────────────────── */
@media (max-width:700px){
  header{flex-wrap:nowrap!important;align-items:flex-start!important;gap:12px!important}
  .brand{flex:1 1 auto;min-width:0}
  header .spacer{display:none!important}
  .logo{flex:0 0 auto!important;height:26px!important;align-self:flex-start!important;
    margin-top:2px}
}
@media (max-width:430px){
  .logo{height:23px!important}
  h1{font-size:27px!important}
  .sub{font-size:13px!important}
}

/* ── ③ 배경 : 78% → 86% (요청 10%) ─────────────────────────── */
.bgart{opacity:.86!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bgart{opacity:.66!important}}
:root[data-theme="dark"] .bgart{opacity:.66!important}

/* ── ④ 12개월 추이 카드 : 회색기를 걷고 브랜드 파랑으로 ─────
   기존 --mkt-bg(#F3F5FE) 는 남보라 기운이 돌아 회색으로 읽혔고,
   페이지 바탕(찬 물색 + 오른쪽 아래 주황)과 계열이 어긋났다.
   → 카드는 흰 종이 + 옅은 하늘빛, 선과 면은 CI 파랑(#0071BE)으로 통일한다 */
.tf{background:linear-gradient(180deg,#FFFFFF 0%,#F1F8FE 100%)!important;
  box-shadow:0 1px 2px rgba(0,113,190,.06),0 6px 18px rgba(0,113,190,.09)!important}
.tln{stroke:var(--ci-bl)!important}
.te{fill:var(--ci-bl)!important;stroke:#fff!important}
.tar{fill:var(--ci-bl)!important;opacity:.13!important}
.tb{stroke:#CFE4F5!important}
.tf figcaption{color:var(--ink)!important}
.tf figcaption span{color:var(--mute)!important}
.tnow b{color:var(--ink)!important}
.tpk.up{fill:var(--ink)!important} .tpk.dn{fill:#5A7391!important}
.hp .ch{stroke:var(--ci-bl)!important}
.hp .hd{fill:var(--ci-bl)!important;stroke:#fff!important}
/* 시세 카드도 같은 계열로 맞춘다 (추이와 나란히 놓이는 카드다) */
.mcard{background:linear-gradient(180deg,#FFFFFF 0%,#F1F8FE 100%)!important;
  box-shadow:0 1px 2px rgba(0,113,190,.06),0 6px 18px rgba(0,113,190,.09)!important}
.mcard .mg{border-top-color:#DDEBF8!important}
/* 소제목 막대·구분선도 CI 파랑으로 (시세 계열) */
.trhead{border-bottom-color:#CFE4F5!important}
.trhead .sect::before{background:var(--ci-bl)!important}
.mkt .ptitle::before{background:var(--ci-bl)!important}
.mkt .ptitle::after{background:#CFE4F5!important}
.mkt .mgroup::before{background:var(--ci-bl)!important}
.mkt .mgroup::after{background:#DDEBF8!important}
.mkt .asof{color:var(--ci-bl)!important;background:#F1F8FE!important;
  border-color:#CFE4F5!important}

/* 어두운 화면 : 흰 종이 대신 짙은 남색 카드 + 밝은 파랑 선 */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --mkt-bg:#101B2A; }
 :root:not([data-theme="light"]) .tf,:root:not([data-theme="light"]) .mcard{
  background:linear-gradient(180deg,#141F30 0%,#0E1826 100%)!important;
  box-shadow:0 1px 2px rgba(0,0,0,.5),0 8px 22px rgba(0,0,0,.4)!important}
 :root:not([data-theme="light"]) .tb{stroke:#2A3B4F!important}
 :root:not([data-theme="light"]) .tar{opacity:.20!important}
 :root:not([data-theme="light"]) .te,:root:not([data-theme="light"]) .hp .hd{stroke:#0E1826!important}
 :root:not([data-theme="light"]) .trhead{border-bottom-color:#24384F!important}
 :root:not([data-theme="light"]) .mkt .ptitle::after{background:#24384F!important}
 :root:not([data-theme="light"]) .mkt .mgroup::after{background:#1E2E42!important}
 :root:not([data-theme="light"]) .mkt .asof{background:#12222F!important;border-color:#24384F!important}
 :root:not([data-theme="light"]) .mcard .mg{border-top-color:#1E2E42!important}
}
:root[data-theme="dark"]{ --mkt-bg:#101B2A; }
:root[data-theme="dark"] .tf,:root[data-theme="dark"] .mcard{
  background:linear-gradient(180deg,#141F30 0%,#0E1826 100%)!important;
  box-shadow:0 1px 2px rgba(0,0,0,.5),0 8px 22px rgba(0,0,0,.4)!important}
:root[data-theme="dark"] .tb{stroke:#2A3B4F!important}
:root[data-theme="dark"] .tar{opacity:.20!important}
:root[data-theme="dark"] .te,:root[data-theme="dark"] .hp .hd{stroke:#0E1826!important}
:root[data-theme="dark"] .trhead{border-bottom-color:#24384F!important}
:root[data-theme="dark"] .mkt .ptitle::after{background:#24384F!important}
:root[data-theme="dark"] .mkt .mgroup::after{background:#1E2E42!important}
:root[data-theme="dark"] .mkt .asof{background:#12222F!important;border-color:#24384F!important}
:root[data-theme="dark"] .mcard .mg{border-top-color:#1E2E42!important}

/* ⑤ .mcard 테두리 재도입 — 위 "계열색 ①"에서 .tf,.mcard 를 border:0!important 로
   통일했는데, .tf(상단 상시 그래프 1장)는 그림자만으로 충분해도 .mcard(12장이
   촘촘한 격자)는 카드 사이 경계가 뚜렷해야 나이 있는 사용자도 한눈에 구분된다.
   그림자만 짙게 하는 것보다 확실한 색 테두리 + 더 짙은 2단 그림자를 함께 쓴다
   — 요청 2026-09-16, 8차 */
.mcard{border:1.5px solid #A6C1E4!important;
  box-shadow:0 2px 6px rgba(18,60,122,.18),0 14px 32px rgba(18,60,122,.20)!important}
:root[data-theme="dark"] .mcard{border-color:#3E5878!important;
  box-shadow:0 2px 7px rgba(0,0,0,.58),0 14px 34px rgba(0,0,0,.5)!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mcard{
  border-color:#3E5878!important;
  box-shadow:0 2px 7px rgba(0,0,0,.58),0 14px 34px rgba(0,0,0,.5)!important}}

/* ══ 주간 동행 / 주간 성장 : 그라데이션을 양쪽 다 (2026-09-09) ══
   원인은 의도가 아니라 덮임이었다.
     383행 .hpanel  그라데이션  →  1161행 .panel,.hpanel,.hpanel2{background:var(--card)} 가 덮음
     946행 .hpanel2 그라데이션 !important  →  살아남음
   → CI 색의 아주 옅은 값으로 양쪽에 같은 세기로 넣는다
     동행 = Boiler Orange 계열 · 성장 = Boiler Blue 계열 */
.hpanel{background:linear-gradient(158deg,#FDF1E7 0%,var(--card) 58%)!important}
.hpanel2{background:linear-gradient(158deg,#EAF4FC 0%,var(--card) 58%)!important}
/* 안쪽 강조 타일도 같은 계열로 (지금은 주황 타일만 CI 색이었다) */
.hpanel .hsum.big b.k{background:#FDF1E7!important;border-color:var(--ci-or)!important}
.hpanel2 .hsum.big b.k{background:#EAF4FC!important;border-color:var(--ci-bl)!important}
/* 뉴스레터 탭 섹션 제목 = 대문 두 칸과 같은 색 (2026-09-09) */
.isect.so{color:var(--ci-or)!important}
.isect.so::after{background:color-mix(in srgb, var(--ci-or) 32%, var(--line))!important}
.isect.gr{color:var(--ci-bl)!important}
.isect.gr::after{background:color-mix(in srgb, var(--ci-bl) 32%, var(--line))!important}
.hpanel .ptitle::after{background:#F5DFCB!important}
.hpanel2 .ptitle::after{background:#CFE4F5!important}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 }
 :root:not([data-theme="light"]) .hpanel{
  background:linear-gradient(158deg,#241A12 0%,var(--card) 58%)!important}
 :root:not([data-theme="light"]) .hpanel2{
  background:linear-gradient(158deg,#122232 0%,var(--card) 58%)!important}
 :root:not([data-theme="light"]) .hpanel .hsum.big b.k{background:#241A12!important}
 :root:not([data-theme="light"]) .hpanel2 .hsum.big b.k{background:#122232!important}
 :root:not([data-theme="light"]) .hpanel .ptitle::after{background:#3A2A1C!important}
 :root:not([data-theme="light"]) .hpanel2 .ptitle::after{background:#24384F!important}
}
:root[data-theme="dark"] .hpanel{
  background:linear-gradient(158deg,#241A12 0%,var(--card) 58%)!important}
:root[data-theme="dark"] .hpanel2{
  background:linear-gradient(158deg,#122232 0%,var(--card) 58%)!important}
:root[data-theme="dark"] .hpanel .hsum.big b.k{background:#241A12!important}
:root[data-theme="dark"] .hpanel2 .hsum.big b.k{background:#122232!important}
:root[data-theme="dark"] .hpanel .ptitle::after{background:#3A2A1C!important}
:root[data-theme="dark"] .hpanel2 .ptitle::after{background:#24384F!important}

/* ══════════════════════════════════════════════════════════════
   2026년 사회공헌 지표 5칸 — 계열색 통일                2026-09-09
   앞 3칸만 .hl (남색 바탕 + 남색 숫자) 이고 뒤 2칸은 흰 바탕 +
   검정 숫자여서 한 줄이 두 벌로 읽혔다. 사회공헌·나눔 계열은
   이미 CI 주황(주간 동행)으로 정해져 있으므로 다섯 칸을 주황
   계열로 통일한다 — 숫자는 잉크로 두어 읽는 힘을 지키고,
   라벨·단위·바탕만 주황으로 계열을 표시한다.
   ══════════════════════════════════════════════════════════════ */
.stat, .stat.hl, .stat.tl{
  background:linear-gradient(158deg,#FDF1E7 0%,#FFFFFF 62%)!important;
  border:1px solid #F0DECC!important}
.stat .sl, .stat.hl .sl, .stat.tl .sl{color:#C25F14!important;opacity:1!important;
  font-weight:700!important}
.stat b.num, .stat.hl b.num, .stat.tl b.num, .stat.hl b, .stat.tl b{
  color:var(--ink)!important}
.stat b.num em, .stat.hl b.num em, .stat.tl b.num em{color:#C25F14!important;
  opacity:1!important}
.stat .sn, .stat.hl .sn{color:#A8702F!important}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 }
 :root:not([data-theme="light"]) .stat,
 :root:not([data-theme="light"]) .stat.hl,
 :root:not([data-theme="light"]) .stat.tl{
  background:linear-gradient(158deg,#241A12 0%,#131A26 62%)!important;
  border-color:#3A2A1C!important}
 :root:not([data-theme="light"]) .stat .sl,
 :root:not([data-theme="light"]) .stat.hl .sl{color:#FF9247!important}
 :root:not([data-theme="light"]) .stat b.num em,
 :root:not([data-theme="light"]) .stat.hl b.num em{color:#FF9247!important}
 :root:not([data-theme="light"]) .stat .sn,
 :root:not([data-theme="light"]) .stat.hl .sn{color:#C8935E!important}
}
:root[data-theme="dark"] .stat,
:root[data-theme="dark"] .stat.hl,
:root[data-theme="dark"] .stat.tl{
  background:linear-gradient(158deg,#241A12 0%,#131A26 62%)!important;
  border-color:#3A2A1C!important}
:root[data-theme="dark"] .stat .sl,
:root[data-theme="dark"] .stat.hl .sl{color:#FF9247!important}
:root[data-theme="dark"] .stat b.num em,
:root[data-theme="dark"] .stat.hl b.num em{color:#FF9247!important}
:root[data-theme="dark"] .stat .sn,
:root[data-theme="dark"] .stat.hl .sn{color:#C8935E!important}

/* ══════════════════════════════════════════════════════════════
   온기의 자리를 옮긴다                                2026-09-09
   문제 : 주황이 숫자를 읽는 판(지표 5칸)에 35.3% 로 몰려 있고,
          정작 따뜻해야 할 나눔 지도에는 0.1% 였다.
   손질 : ① 지표 = 흰 종이 + 라벨·단위 글자만 주황 (35.3% → 5.0%)
          ② 지도 = 바탕에 은은한 온기 광채 (0.1% → 37.9%)
                   땅빛은 지금의 파랑을 그대로 둔다
   ══════════════════════════════════════════════════════════════ */

/* ── ① 지표 5칸 : 바탕의 주황을 걷고 글자에만 남긴다 ────────── */
.stat, .stat.hl, .stat.tl{
  background:var(--card)!important;
  border:1px solid #EFE4D8!important}
.stat .sl, .stat.hl .sl, .stat.tl .sl{color:#B85E1B!important;opacity:1!important;
  font-weight:700!important}
.stat b.num, .stat.hl b.num, .stat.tl b.num, .stat.hl b, .stat.tl b{
  color:var(--ink)!important}
.stat b.num em, .stat.hl b.num em, .stat.tl b.num em{color:#B85E1B!important;
  opacity:1!important}
.stat .sn, .stat.hl .sn{color:#A8702F!important}

/* ── ② 나눔 지도 : 차가운 흰 바탕에 온기 광채를 깐다 ────────
   땅빛(--map)은 건드리지 않는다 — 파랑 표식의 읽힘을 지킨다 */
.panel.mapbox{position:relative;
  background:radial-gradient(120% 90% at 50% 42%,
    #FFF4E7 0%, #FFFBF6 45%, #FFFFFF 78%)!important}

/* ── 어두운 화면 ─────────────────────────────────────────── */
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"]) .stat,
 :root:not([data-theme="light"]) .stat.hl,
 :root:not([data-theme="light"]) .stat.tl{
  background:var(--card)!important;border-color:#33291F!important}
 :root:not([data-theme="light"]) .stat .sl,
 :root:not([data-theme="light"]) .stat.hl .sl{color:#FF9247!important}
 :root:not([data-theme="light"]) .stat b.num em,
 :root:not([data-theme="light"]) .stat.hl b.num em{color:#FF9247!important}
 :root:not([data-theme="light"]) .stat .sn,
 :root:not([data-theme="light"]) .stat.hl .sn{color:#C8935E!important}
 :root:not([data-theme="light"]) .panel.mapbox{
  background:radial-gradient(120% 90% at 50% 42%,
    #23180F 0%, #1A1622 45%, var(--card) 80%)!important}
}
:root[data-theme="dark"] .stat,
:root[data-theme="dark"] .stat.hl,
:root[data-theme="dark"] .stat.tl{
  background:var(--card)!important;border-color:#33291F!important}
:root[data-theme="dark"] .stat .sl,
:root[data-theme="dark"] .stat.hl .sl{color:#FF9247!important}
:root[data-theme="dark"] .stat b.num em,
:root[data-theme="dark"] .stat.hl b.num em{color:#FF9247!important}
:root[data-theme="dark"] .stat .sn,
:root[data-theme="dark"] .stat.hl .sn{color:#C8935E!important}
:root[data-theme="dark"] .panel.mapbox{
  background:radial-gradient(120% 90% at 50% 42%,
    #23180F 0%, #1A1622 45%, var(--card) 80%)!important}

/* ── 부제를 뺀 뒤 머리 균형 잡기 ────────────  2026-09-09
   부제가 사라져 제목 한 줄만 남았다. 세로 막대와 로고를
   제목 높이에 맞춰 가운데로 정렬한다 */
header{align-items:center!important}
.brand{align-items:center!important}
.brand .bar{align-self:stretch!important;min-height:1.05em}

/* ── 부제 삭제 뒤 보정 ──────────────────────  2026-09-09
   ① header{align-items:center} 를 넓은 화면에만 준다.
      좁은 화면에서는 로고가 '우측 최상단' 에 있어야 하는데
      가운데 정렬이 이를 12~17px 끌어내렸다.
   ② 360px 에서 '귀뚜라미 동반성장' 이 두 줄로 꺾였다.
      낱말 사이에서만 꺾이게 하고, 글씨를 한 단 줄여 한 줄에 담는다 */
@media (max-width:700px){
  header{align-items:flex-start!important}
  .brand{align-items:flex-start!important}
  h1{word-break:keep-all!important;white-space:nowrap!important}
}
@media (max-width:430px){ h1{font-size:25px!important} }
@media (max-width:390px){ h1{font-size:23px!important} }
@media (max-width:365px){ h1{font-size:21px!important} }

/* ── 지도 땅빛을 CI 파랑 계열로 ──────────────  2026-09-09
   현행 #CBD8EC 는 강조 남색(#123C7A)에서 파생된 임시 색으로
   색상각이 216°(남보라 기운) 였다. 이 12° 가 '차갑다' 는
   느낌의 실제 원인이었고, 바탕에 깐 온기 광채(주황)와도
   서로 어긋났다.
   → 색상만 CI 파랑의 204° 로 옮기고 밝기(86%)는 그대로 둔다.
      밝기를 지키니 흰 경계선 대비(1.44:1)와 시·도 경계의
      또렷함이 지금과 같고, 남색 표식 대비는 7.46 → 7.86:1 로
      오히려 나아진다.
   CI 파랑 22% 농도 · #C7E0F1 (204° / S60% / L86%)          */
:root{ --map:#C7E0F1!important; --map-on:#ADD2EA!important;
       --map-line:#FFFFFF!important; }
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --map:#21313B!important; --map-on:#2F4351!important;
  --map-line:#080C15!important; }}
:root[data-theme="dark"]{ --map:#21313B!important; --map-on:#2F4351!important;
  --map-line:#080C15!important; }

/* ── 연도·월별 단추 글씨 키우기 (웹만) ──────  2026-09-09
   실측 : 연도 13.5px · 옆 숫자(em) 10px · 월별 13px · '월별' 단추 12px.
   1440px 에서 연도줄이 408px 인데 칸은 566px — 여백 90px 이 남아 있었다.
   '크게 보기' 쪽만 16.5px 로 키우고 일반 화면을 그대로 둔 탓이다.
   → 연도 16px · 숫자 12.5px · 월별 14.5px · 토글 13.5px.
   모바일(≤700px)은 손대지 않는다 — 여백이 0 이어서 키우면 줄이 접힌다.
   선택자 주의 : '.mapbox #yr button' (ID 포함) 이 더 세므로 같은 꼴로 쓴다 */
@media (min-width:701px){
  .mapbox #yr button{font-size:16px!important;padding:7px 11px!important}
  .mapbox #yr button em{font-size:12.5px!important;margin-left:5px!important;
    opacity:.72!important}
  .mapbox #mon button{font-size:14.5px!important;padding:6px 10px!important}
  .mapbox .mtog{font-size:13.5px!important;padding:7px 12px!important}
  .mapbox .mtog .cv{font-size:15px!important}
}

/* ══════════════════════════════════════════════════════════════
   크게 보기 손질                                       2026-09-09
   ① 연도 요약을 칸의 오른쪽 끝으로 (울릉도를 덮지 않게)
   ② 머리줄('나눔의 발자취 / ✕ 닫기')을 걷어 지도에 높이를 준다
   ③ 닫기 단추는 오른쪽 상세 칸의 우측 상단으로
   ══════════════════════════════════════════════════════════════ */

/* 기본값 — 일반 화면에서는 HTML 카드를 쓰지 않는다 (SVG 카드가 있다) */
.msumh{display:none}

@media (min-width:1001px){
 /* ── ② 머리줄을 흐름에서 빼낸다 → .mbody 가 그만큼 커진다 ── */
 body.mopen #modal .mhead{position:absolute!important;top:16px;right:18px;
   z-index:8;padding:0!important;gap:0!important;width:auto}
 body.mopen #modal .mhead b,
 body.mopen #modal .mhead .mnote,
 body.mopen #modal .mhead .spacer{display:none!important}

 /* ── ③ 닫기 : 어두운 덮개 위 흰 글씨 → 밝은 카드 위 단추 ── */
 body.mopen #modal .mclose{background:var(--card2)!important;color:var(--ink)!important;
   border:1px solid var(--line)!important;border-radius:9px!important;
   padding:7px 12px!important;font-size:13.5px!important;font-weight:700!important;
   box-shadow:0 1px 3px rgba(18,60,122,.10)!important}
 body.mopen #modal .mclose:hover{background:var(--acc-w)!important;
   border-color:var(--acc-2)!important;color:var(--acc)!important}

 /* ── ① 칸의 오른쪽 끝에 붙는 연도 요약 ───────────────── */
 body.mopen #mleft>.panel{position:relative}
 body.mopen .msumh{display:block;position:absolute;top:10px;right:10px;z-index:6;
   width:186px;background:var(--card);border:1px solid var(--tile-ln);
   border-radius:11px;overflow:hidden;
   box-shadow:0 1px 2px rgba(18,60,122,.06),0 8px 22px rgba(18,60,122,.10)}
 body.mopen .msumh .mshd{background:var(--hl);color:var(--acc);font-weight:800;
   font-size:15px;padding:8px 12px 8px 15px;position:relative;
   border-bottom:1px solid var(--hl-ln)}
 body.mopen .msumh .mshd::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;
   width:3px;border-radius:2px;background:var(--acc)}
 body.mopen .msumh .msrw{display:flex;align-items:baseline;justify-content:space-between;
   gap:10px;padding:7px 12px;border-top:1px solid var(--line2)}
 body.mopen .msumh .msrw:first-of-type{border-top:0}
 body.mopen .msumh .msrw span{font-size:13px;color:var(--mute);font-weight:600}
 body.mopen .msumh .msrw b{font-size:17px;color:var(--ink);font-weight:800;
   font-variant-numeric:tabular-nums;white-space:nowrap}
 body.mopen .msumh .msrf{padding:6px 12px;font-size:12.5px;color:var(--mute);
   border-top:1px solid var(--line2);font-weight:600}
 /* SVG 안 카드는 감춘다 (같은 내용이 두 번 나오지 않게) */
 body.mopen #mleft svg.kmap .msum{display:none!important}

 /* 머리줄이 빠진 만큼 지도를 넓게 쓴다.
    (여백을 키우면 되레 지도가 줄어든다 — 실측 후 6/5px 로 낮췄다) */
 body.mopen #modal{padding:6px!important}
 body.mopen #modal .mbody{padding:5px!important;gap:7px!important}
}

/* 어두운 화면 : 단추와 카드 그림자를 낮춘다 */
@media (min-width:1001px){
 :root[data-theme="dark"] body.mopen #modal .mclose,
 :root[data-theme="dark"] body.mopen .msumh{box-shadow:0 2px 10px rgba(0,0,0,.5)!important}
}

/* ══════════════════════════════════════════════════════════════
   지도 틀 · 독도                                       2026-09-09
   ══════════════════════════════════════════════════════════════ */

/* 제목 '나눔의 발자취' 가 왼쪽 벽에 붙어 답답했다 (여백 3px).
   → 칸 여백은 다른 칸과 같은 20px 로 되돌리고, 지도 그림만
     음수 여백으로 밖으로 빼내 폭을 그대로 쓴다 */
.panel.mapbox{padding-left:20px!important;padding-right:20px!important}
.mapbox #map{margin-left:-17px!important;margin-right:-17px!important}
/* 크게 보기 안에서는 원래 여백(10px)을 지킨다 */
body.mopen #mleft>.panel{padding-left:10px!important;padding-right:10px!important}
body.mopen .mleft #map{margin-left:-7px!important;margin-right:-7px!important}

/* 틀 높이가 553 → 579 (+4.7%) 로 늘었으므로 높이 상한도 같이 올린다.
   그대로 두면 상한이 걸리는 폭(≤1100px 등)에서 지도가 되레 작아진다
   — 실측 : 1024px 에서 그림 644 → 600px 로 줄었다 */
/* 원래 규칙은 폭에 상관없이 660px 단일값이었다(뒤에 온 무조건 규칙이 이김).
   같은 방식으로 660 × 579/553 = 692px 하나만 둔다 */
.mapbox svg.kmap{max-height:692px!important}
/* 크게 보기 안에서는 상한을 두지 않는다 */
body.mopen #mleft svg.kmap{max-height:none!important}

/* 독도 인셋 — 제주 인셋과 같은 문법(점선 상자 + 이름) */
.dset .dbox{fill:none;stroke:var(--line);stroke-width:1.4;stroke-dasharray:4 3}
.dset .dlink{stroke:var(--line);stroke-width:1.1;stroke-dasharray:2 2.5}
.dset .drock{stroke:var(--map-line);stroke-width:.9}
.dset .dlab{fill:var(--mute);font-size:13px;font-weight:700;text-anchor:middle}
@media (min-width:1400px){ .dset .dlab{font-size:15px} }

/* ── 울릉도 · 독도 이름표 (인셋 상자 폐기) ────  2026-09-09 */
.iset .ilab{fill:var(--mute);font-size:12.5px;font-weight:800;
  paint-order:stroke;stroke:var(--card);stroke-width:3;stroke-linejoin:round}

/* ── 위쪽 여백 조이기 · 월별 단추 한 줄 ──────  2026-09-09
   ① 지도를 26 → 10 단위만 내리고 요약 카드를 납작하게 해
      위쪽에 뜨던 빈 바다를 걷어냈다.
   ② 틀 높이 553+10=563 → 상한 660×563/553 = 672px
   ③ 월별 단추가 '연/간', '1/월' 처럼 두 줄로 꺾였다
      → 꺾임 금지 + 글씨·여백을 줄여 13칸을 한 줄에 담는다 */
.mapbox svg.kmap{max-height:672px!important}
.mapbox #map{margin-top:4px!important}

@media (min-width:1220px){
  .mapbox #mon{flex-wrap:nowrap!important;gap:2px!important;overflow:visible!important}
  .mapbox #mon button{white-space:nowrap!important;font-size:12.5px!important;
    padding:6px 7px!important;flex:0 0 auto!important}
}
/* 701~1219px : 칸이 463~512px 뿐이다. 13칸(연간+12달)을 담으려면
   칸당 33.7px 이하여야 해서 글씨·여백을 한 단 더 조인다.
   그래도 모자라면 줄을 접게 두어(wrap) 페이지가 가로로 밀리지 않게 한다 */
@media (min-width:701px) and (max-width:1219px){
  .mapbox #mon{flex-wrap:wrap!important;gap:2px!important;overflow:visible!important}
  .mapbox #mon button{white-space:nowrap!important;font-size:11.5px!important;
    padding:5px 5px!important;flex:0 0 auto!important}
}
@media (min-width:701px){ .mapbox #monwrap{margin-top:6px!important} }

/* ── 월별 토글을 제목줄 오른쪽으로 ──────────  2026-09-09
   토글이 제 줄을 하나 다 잡아먹고 있었다. 원인은 폭이다 —
   연도줄 509px + 토글 72px + 사이 8px = 589px 인데 칸은 542px.
   연도 글씨를 줄이면(16 → 14.5px) 들어가지만 그건 지난번에
   키워 달라고 한 것을 되돌리는 셈이다.
   → 토글을 제목줄 오른쪽(⤢ 크게 왼쪽)으로 띄워 붙인다.
     세로 한 줄(38px + 사이 10px = 48px)이 그대로 지도로 간다.
   크게 보기(body.mopen)와 모바일(≤700px)은 지금 그대로 둔다 */
/* ── 월별 토글 자리 : 폭에 따라 둘로 나눈다 ──  2026-09-09
   실측한 '칸이 주는 폭' 과 '연도줄 + 사이 10 + 토글 52' :
     1280px 이상 → 쓸 폭 542px
     1220px      → 532px
     1180px      → 512px
     1081px      → 463px   ← 가장 좁다
   연도 15px/여백 7px 이면 연도줄 자연폭이 440px → 필요 502px.
     ≥1220px : 들어간다        → 연도줄 오른쪽 끝에 붙인다 (요청안)
     ≤1219px : 39~63px 부족    → 제목줄 오른쪽으로 올린다
   어느 쪽이든 세로 한 줄(48px)은 지도가 가져간다.
   글씨는 16 → 15px (−6%) 만 줄였다 (13px 로 내리면 다 들어가지만
   '글씨가 작다' 던 지적을 되돌리는 셈이라 택하지 않았다) */
@media (min-width:701px){
  body:not(.mopen) .mapbox #yr button{font-size:15px!important;padding:7px 7px!important;
    flex:0 0 auto!important}
  body:not(.mopen) .mapbox #yr button em{font-size:11.5px!important;margin-left:4px!important}
  body:not(.mopen) .mapbox>.bars.mrow{margin-bottom:0!important}
}
/* 넓은 화면 : 연도줄 오른쪽 끝 */
@media (min-width:1220px){
  body:not(.mopen) .mapbox>.bars.mrow{flex-wrap:nowrap!important;align-items:center!important}
  body:not(.mopen) .mapbox>.bars.mrow .spacer{display:inline-block!important;flex:1 1 auto}
  body:not(.mopen) .mapbox #yr{flex:0 0 auto!important}
  body:not(.mopen) .mapbox>.bars.mrow .mtog{position:static!important;margin:0!important;
    flex:0 0 auto!important;white-space:nowrap!important}
}
/* 좁은 화면 : 자리가 없어 제목줄 오른쪽('⤢ 크게' 왼쪽)으로 */
@media (min-width:701px) and (max-width:1219px){
  body:not(.mopen) .panel.mapbox{position:relative}
  body:not(.mopen) .mapbox>.bars.mrow .spacer{display:none!important}
  body:not(.mopen) .mapbox>.bars.mrow .mtog{position:absolute!important;
    top:21px;right:104px;z-index:3;margin:0!important;white-space:nowrap!important}
}

/* ══════════════════════════════════════════════════════════════
   모바일 지도 머리를 웹과 같은 규격으로            2026-09-09
   재어 보니 이랬다 (칸 여백 20px 기준) :
     연도 칸이 display:block 이어서 옆 숫자(15, 27 …)가 아랫줄로
     떨어져 칸 높이가 48px(360px 화면은 70px) 이 됐다.
     여기에 '월별' 이 제 줄을 하나 더 쓰니 지도가 y 176px(360px 화면
     198px) 에서야 시작했다. 웹은 y 119px 이다.
   한 줄 알약으로 바꿀 때 폭 계산 (360px 화면 · 쓸 폭 292px) :
     13px/여백7px → 380px · 12px/5px → 333px · 11px/4px → 303px
     → 어떤 크기로도 6칸이 한 줄에 안 들어간다.
   그래서 글씨를 줄이는 대신 웹과 같은 크기의 한 줄 알약을 두고,
   줄 자체를 좌우로 미는 띠로 만든다. 고른 칸은 자동으로 가운데로
   굴러 오고, 넘침은 띠 안에서 끝나 페이지는 밀리지 않는다.
   ══════════════════════════════════════════════════════════════ */
@media (max-width:700px){
  /* 칸 여백 20 → 12px : 쓸 폭이 16px 늘어난다 */
  .panel.mapbox{padding-left:12px!important;padding-right:12px!important}
  .mapbox #map{margin-left:-9px!important;margin-right:-9px!important}

  /* ① 연도 · 월 : 웹과 같은 한 줄 알약 + 좌우로 미는 띠 */
  .mapbox #yr, .mapbox #mon{flex-wrap:nowrap!important;gap:2px!important;
    overflow-x:auto!important;overflow-y:hidden!important;
    -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
    scrollbar-width:none;-ms-overflow-style:none;
    }
  /* 흐림은 그쪽에 더 남았을 때만 (JS 가 .sl/.sr 을 붙인다) */
  .mapbox #yr.sl:not(.sr), .mapbox #mon.sl:not(.sr){
    mask-image:linear-gradient(90deg,transparent 0,#000 20px,#000 100%);
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 20px,#000 100%)}
  .mapbox #yr.sr:not(.sl), .mapbox #mon.sr:not(.sl){
    mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 20px),transparent 100%);
    -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 20px),transparent 100%)}
  .mapbox #yr.sl.sr, .mapbox #mon.sl.sr{
    mask-image:linear-gradient(90deg,transparent 0,#000 20px,#000 calc(100% - 20px),transparent 100%);
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 20px,#000 calc(100% - 20px),transparent 100%)}
  .mapbox #yr::-webkit-scrollbar, .mapbox #mon::-webkit-scrollbar{display:none}
  /* 띠 자체가 칸 폭을 넘어 늘어나면 감싼 칸에 잘려 뒤쪽 달(10~12월)에
     손이 닿지 않는다 (실측 : #mon 643px 가 #monwrap 322px 에 잘림).
     → 띠를 칸 폭에 묶고 넘침은 띠 안에서 굴리게 한다 */
  .mapbox #yr, .mapbox #mon{max-width:100%!important;width:100%!important}
  .mapbox #monwrap{max-width:100%!important;overflow:visible!important}
  .mapbox #yr button, .mapbox #mon button{
    display:inline-flex!important;align-items:baseline!important;gap:4px!important;
    white-space:nowrap!important;flex:0 0 auto!important;
    font-size:14px!important;padding:8px 10px!important}
  .mapbox #yr button em{font-size:11px!important;margin-left:0!important;opacity:.72}
  .mapbox #mon button{font-size:13.5px!important;padding:8px 11px!important}

  /* ② '월별' 토글을 제목줄 오른쪽('⤢ 크게' 왼쪽)으로 → 한 줄 회수 */
  .panel.mapbox{position:relative}
  .mapbox>.bars.mrow{margin-bottom:0!important}
  .mapbox>.bars.mrow .spacer{display:none!important}
  /* 전체화면(모달)에서는 이 절대배치가 적용되면 안 된다 — 모달 안에서는
     같은 .mapbox 트리를 그대로 옮겨와 재사용하는데, 거기선 이 위치가 곧
     창 머리(1배/2배/3배)라 서로 겹친다. 같은 종류의 다른 폭(1220px↑,
     701~1219px) 규칙은 이미 body:not(.mopen) 로 걸러져 있었는데 이 700px
     규칙만 빠져 있었다 — 요청 2026-09-16, 9차 */
  body:not(.mopen) .mapbox>.bars.mrow .mtog{position:absolute!important;top:16px;z-index:3;
    margin:0!important;white-space:nowrap!important;
    font-size:12.5px!important;padding:6px 10px!important}
  .mapbox>.bars:not(.mrow){align-items:center!important}
  .mapbox #monwrap{margin-top:6px!important}
}
/* '⤢ 크게' 단추 폭이 화면에 따라 달라 토글 위치를 두 단으로 잡는다 */
@media (max-width:700px){ body:not(.mopen) .mapbox>.bars.mrow .mtog{right:84px} }
@media (max-width:400px){ body:not(.mopen) .mapbox>.bars.mrow .mtog{right:78px} }

/* ══════════════════════════════════════════════════════════════
   지도 조작 칸 손질                                    2026-09-10
   ① '⤢ 크게' → '⤢ 전체화면' (글씨는 '월별' 단추와 같은 13.5px)
   ② 전체화면 닫기 : 칸 안쪽으로 넣고 채운 파랑으로 또렷하게
   ③ 기간 · 월별 글씨 확대 (일반 화면 · 전체화면 모두)
   ④ 전체화면 연도 요약 카드 확대
   ══════════════════════════════════════════════════════════════ */

/* ── ① 전체화면 단추 : '월별' 과 같은 13.5px ───────────────── */
@media (min-width:701px){
  .mapbox .zoomb{font-size:13.5px!important;padding:7px 12px!important;
    font-weight:700!important}
}

/* ── ② 닫기 : 안쪽으로 + 채운 파랑 ─────────────────────────
   전에는 어두운 덮개용 '투명 + 흰 테두리' 를 밝은 카드 위에 얹어
   테두리만 겨우 보였고, 카드 모서리에 붙어 밖으로 밀린 듯 보였다.
   → 여백을 26/28px 로 넣어 카드 안쪽에 앉히고,
     채운 파랑 + 흰 테 3px 로 어느 배경에서도 먼저 눈에 들어오게 한다. */
@media (min-width:1001px){
  body.mopen #modal .mhead{top:26px!important;right:28px!important}
  body.mopen #modal .mclose{background:var(--acc)!important;color:#fff!important;
    border:0!important;border-radius:11px!important;
    padding:10px 17px!important;font-size:15px!important;font-weight:800!important;
    box-shadow:0 0 0 3px rgba(255,255,255,.92),
               0 3px 12px rgba(18,60,122,.30)!important}
  body.mopen #modal .mclose:hover{background:var(--acc-2)!important;color:#fff!important;
    box-shadow:0 0 0 3px rgba(255,255,255,.92),
               0 4px 16px rgba(18,60,122,.38)!important}
  body.mopen #modal .mclose:focus-visible{outline:3px solid var(--ci-or)!important;
    outline-offset:3px!important}
}
/* 어두운 화면 : --acc 가 밝은 파랑(#77ACEE)이라 흰 글씨는 대비가 모자란다
   (실측 2.0:1) → 글씨를 짙게 바꾼다 (대비 9.5:1)
   ※ 이 짙은 글씨는 위 블록의 '채운 파랑 단추'(데스크톱, ≥1001px) 전용이다.
   가드 없이 걸려 있어 모바일(≤1000px, 배경 투명 + 기본 흰 글씨)에서도
   적용되는 바람에 짙은 남색 글씨가 짙은 창 배경 위에서 안 보였다
   — 요청 2026-09-16, 9차(진행 중 발견) */
@media (min-width:1001px){
  :root[data-theme="dark"] body.mopen #modal .mclose,
  :root[data-theme="dark"] body.mopen #modal .mclose:hover{
    color:#0A1422!important;
    box-shadow:0 0 0 3px rgba(23,31,45,.92), 0 3px 12px rgba(0,0,0,.55)!important}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) body.mopen #modal .mclose,
    :root:not([data-theme="light"]) body.mopen #modal .mclose:hover{
      color:#0A1422!important;
      box-shadow:0 0 0 3px rgba(23,31,45,.92), 0 3px 12px rgba(0,0,0,.55)!important}
  }
}




/* 전체화면 : 세로 목록(1400px 이상)
   선택자 주의 — '.mapbox #mon button' (ID 포함) 이 더 세서

   글씨를 올리는 대신 줄을 접게 둔다 (세로로 길어지는 것은 허용) */

/* ── ④ 전체화면 연도 요약 카드 확대 ───────────────────────── */

@media (min-width:1001px){

/* ══════════════════════════════════════════════════════════════
   전체화면 1001~1399px : 조작 칸을 지도 위에서 걷어낸다  2026-09-10
   그동안 이 폭에서는 '기간 · 월별' 을 지도 위(왼쪽 바다)에 카드로
   얹어 두었는데, 김포시 · 서울 금천구 표식을 덮었다.
   → 1400px 이상과 같은 두 칸 구조로 바꿔 겹침을 없앤다.
     칸 폭은 238 → 206px 로 좁혀 지도가 잃는 폭을 줄인다.
   (지도는 그만큼 좁아진다 — 덮는 것보다 좁아지는 편을 택했다) */
@media (min-width:1001px) and (max-width:1399px){
  .mleft>.panel{grid-template-columns:206px minmax(0,1fr)!important}
  .mleft>.panel>#map{grid-column:2!important}
  .mleft>.panel>.bars.mrow{grid-column:1!important;grid-row:1!important;
    background:none!important;box-shadow:none!important;padding:0!important;

  .mleft>.panel>.monwrap{grid-column:1!important;grid-row:2!important;
    justify-self:stretch!important;max-width:none!important;
    background:none!important;box-shadow:none!important;padding:0!important;
    z-index:auto!important}
  .mleft .ylegend{grid-column:1!important;grid-row:3!important;
    background:none!important;box-shadow:none!important;padding:0!important;
    z-index:auto!important}

  /* 1400px 이상과 같은 세로 목록 꼴 */
  .mleft>.panel>.bars.mrow::before{content:"기간";display:block;
    font-family:"Gothic A1",sans-serif;font-size:13px;font-weight:800;
    letter-spacing:.14em;color:var(--mute);margin:2px 0 8px 4px}
  .mleft #yr{display:grid!important;grid-template-columns:1fr!important;
    gap:3px!important;background:var(--card)!important;
    border:1px solid var(--line)!important;border-radius:14px!important;
    padding:6px!important;width:100%!important;
    box-shadow:0 1px 2px rgba(18,60,122,.07),0 8px 20px rgba(18,60,122,.09)!important}
  .mleft #yr button{display:flex!important;align-items:center!important;
    justify-content:space-between!important;width:100%!important;
    border-radius:9px!important;padding:10px 12px!important;
    font-size:17px!important;font-weight:700!important;text-align:left!important;
    border:0!important;background:transparent!important;color:var(--body)!important}
  .mleft #yr button::before{display:none!important}
  .mleft #yr button em{font-style:normal;font-size:14px!important;font-weight:700!important;

/* ══════════════════════════════════════════════════════════════
   전체화면 조작 칸 : 남는 여백만큼만 키운다            2026-09-10
   실측한 여백 (지도 칸 폭 − 실제 그림 폭) :
     1024 2px · 1100 2px · 1280 3px · 1366 52px
     1400 3px · 1440 4px · 1600 125px · 1920 270px · 2560 560px
   → 1440px 이하는 가로 여백이 없다 (칸을 넓히면 지도가 줄어든다).
     대신 조작 칸 아래로 세로 여백이 450px 가량 남으니
     '높이' 를 써서 글씨와 단추를 키운다 — 지도 폭은 건드리지 않는다.
   → 1600px 이상은 가로 여백이 실제로 남으므로 칸도 넓힌다.
   창 높이가 낮으면 목록이 넘치므로 min-height 로 나눈다. */

  body.mopen #mtog{padding:15px!important;font-size:18px!important;margin-top:10px!important}
  body.mopen #monwrap{margin-top:10px!important}
  body.mopen #mon{padding:9px!important;gap:5px!important}

/* ② 1400px 이상 · 높이 760~859px : 한 단만 키운다 */

/* ══════════════════════════════════════════════════════════════
   요청 3건                                              2026-09-10
   ② 1440~1599px 전체화면 : 지도를 왼쪽으로 조금 밀고

   ══════════════════════════════════════════════════════════════ */

/* ② 지도를 왼쪽으로 — 지도 칸 오른쪽에 여백을 준다 */

}

/* ══════════════════════════════════════════════════════════════
   전체화면 : 요약 카드를 항상 우측 상단에                2026-09-10
   카드를 키우니 울릉도와 부딪혀 카드가 아래로 내려갔다.
   지도를 왼쪽으로 밀면 지도가 작아지므로, 대신 울릉도·독도를
   필요한 만큼만 아래로 내린다 (사용자 승인 · "살짝 낮추더라도").

   창 높이에 따라 필요한 양이 다르다 (실측, SVG 유저단위) :
     1440x760  42   ·  1440x800  33  ·  1600/1920x900  14
     1440x900   7   ·  1080 이상   0
   → 높이 구간별로 최소량만 내린다. 높은 화면에서는 제자리.
   SVG 요소의 CSS transform 은 유저단위로 동작한다. */
@media (min-width:1001px) and (max-height:1009px){
  body.mopen #mleft svg.kmap .iset{transform:translateY(16px)}
}
@media (min-width:1001px) and (max-height:879px){

}
@media (min-width:1001px) and (max-height:799px){

}

   인라인 칸은 대표 4종 그대로. [전체보기] 를 누르면 12개 지표를
   같은 양식(trendInto)으로 겹침창에 격자로 펼친다. */
/* 자리 맞바꿈 : [전체보기] 를 먼저, [접기] 를 뒤에 둔다 (2026-09-10) */

/* 두 단추의 크기를 같게 : 글자수(4자 vs 2·3자)가 달라도 폭·높이가 같아 보이게 한다 */
.shead .ttog{min-width:104px!important;justify-content:center!important;
  padding:5px 12px!important;font-weight:700!important}
.ttog.tall .cv{font-size:12.5px}
.shead .ttog.tall{font-size:13.5px!important}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .ttog.tall:hover{background:#12222F}
}

/* 창 제목 (2026-09-10 개선)
   겹침창 바탕은 rgba(10,14,20,.62)+blur 라서 뒤 페이지가 38% 비쳐 보인다.
   글씨만 키워도 뒤 글자·로고와 겹쳐 안 읽히므로 '제목 전용 바탕'을 깔아
   글자가 자기 판 위에 놓이게 한다. + CI 주황 세로 막대(홈페이지 .ptitle 어법) */
#tmodal .mhead.thead{padding:0!important;gap:0;margin-bottom:12px;
  background:linear-gradient(90deg,rgba(3,20,38,.94) 0%,rgba(3,20,38,.90) 62%,rgba(3,20,38,.88) 100%);
  border:1px solid rgba(255,255,255,.16);border-radius:14px;
  box-shadow:0 6px 22px rgba(0,0,0,.34);
  /* 세로 가운데 정렬 + 줄바꿈 금지 : stretch 로 두면 좁은 폭에서 단추가 늘어나고
     부제가 두 줄로 접혀 띠가 96px 까지 커졌다 (측정 후 교정) */
  align-items:center!important;flex-wrap:nowrap!important;position:relative;overflow:hidden}
#tmodal .mhead.thead .tbar{position:absolute;left:0;top:0;bottom:0;width:6px;
  background:linear-gradient(180deg,#F5931F 0%,#E87722 100%)}
#tmodal .mhead.thead b{font-size:30px;font-weight:800;letter-spacing:-.015em;line-height:1.1;
  padding:14px 0 14px 22px;white-space:nowrap;text-shadow:0 1px 10px rgba(0,0,0,.45);
  min-width:0;overflow:hidden;text-overflow:ellipsis}
#tmodal .mhead.thead b i{font-style:normal;font-weight:700;color:#FFC77D}
#tmodal .mhead.thead .mnote{font-size:14px;opacity:.88;align-self:center;white-space:nowrap;
  padding:0 0 0 12px;border-left:1px solid rgba(255,255,255,.22);margin-left:12px}
/* 부제는 자리가 넉넉할 때만. 1200px 아래에서는 띠가 두 줄로 접혀 커졌다 */
@media (max-width:1199px){ #tmodal .mhead.thead .mnote{display:none} }
#tmodal .mhead.thead .spacer{flex:1}
#tmodal .mhead.thead .seg.tseg{align-self:center}
#tmodal .mhead.thead .mclose{align-self:center;margin-right:12px}
/* 기간 선택 (최근 12개월 / 최근 5개년)  2026-09-10
   '기간' 이라는 라벨을 따로 붙였더니 단어 하나가 붕 떠 보였다 →
   라벨을 없애고 단추에 '최근' 을 넣어 단추 자체가 문장이 되게 했다.
   고른 쪽은 흰 알약 + CI 주황 밑줄, 안 고른 쪽은 테두리만 → 선택 상태가 한눈에 */
#tmodal .tsegw{display:inline-flex;align-items:center;align-self:center;margin-right:12px}
#tmodal .sgl{font-weight:600;opacity:.62;font-size:.82em;margin-right:1px}
#tmodal .seg.tseg button[aria-pressed="true"] .sgl{opacity:.72}
#tmodal .seg.tseg{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.38);
  padding:5px;border-radius:13px;gap:4px}
#tmodal .seg.tseg button{color:#DCE9F5;font-size:18.5px;font-weight:700;padding:8px 20px;
  border-radius:9px;line-height:1.2;border:1px solid transparent;transition:none;
  white-space:nowrap;flex:0 0 auto}
#tmodal .seg.tseg button[aria-pressed="false"]{border-color:rgba(255,255,255,.20)}
#tmodal .seg.tseg button[aria-pressed="true"]{background:#fff;color:#0B2A47;font-weight:800;
  box-shadow:inset 0 -4px 0 #E87722,0 2px 10px rgba(0,0,0,.30)}
#tmodal .seg.tseg button:hover{background:rgba(255,255,255,.22);color:#fff}
#tmodal .seg.tseg button[aria-pressed="true"]:hover{background:#fff;color:#0B2A47}
#tmodal .seg.tseg button:focus-visible{outline:3px solid var(--ci-or);outline-offset:2px}
/* 좁은 화면 : 한 줄에 제목+기간+닫기가 다 못 들어간다(390 기준 제목 자리 120px).
   제목을 윗줄로 올려 두 줄로 쓴다 — 제목이 "원자재 · …" 로 잘리는 것보다 낫다 */
@media (max-width:760px){
  #tmodal .mhead.thead{flex-wrap:wrap!important;padding-bottom:9px!important;row-gap:0}
  #tmodal .mhead.thead b{flex:1 1 100%;font-size:20px;padding:10px 12px 6px 16px;
    overflow:visible;text-overflow:clip}
  #tmodal .mhead.thead .spacer{flex:1 1 auto}
  #tmodal .mhead.thead .mnote{display:none}
  #tmodal .mhead.thead .tbar{flex:0 0 5px}
  #tmodal .seg.tseg button{font-size:14px;padding:6px 11px}
  #tmodal .seg.tseg button[aria-pressed="true"]{box-shadow:inset 0 -3px 0 #E87722}
  #tmodal .sgl{display:none}
  #tmodal .tsegw{margin-right:7px}
  #tmodal .mhead.thead .mclose{margin-right:8px}
}

/* 겹침창 본문 : 그래프 격자가 넉넉히 흐르도록 세로 스크롤 */
#tmodal .mbody.tbody{display:block!important;background:var(--card)!important;
  border-radius:12px;overflow-y:auto;padding:14px 18px 20px!important}
/* 그래프 안 글씨(최고·최저)는 SVG 유저단위라 칸이 넓어지면 같이 커진다.
   인라인 칸(258~330px)과 같은 크기로 보이게 칸 폭에 상한을 둔다. */
/* 한 줄 4칸 고정(4×4×4). 칸 폭 상한 330px × 4 + 여백 20px × 3 = 1380px 를
   격자 폭 상한으로 두면 넓은 화면에서 5칸으로 늘어나지 않고, 좁아지면 3→2→1 로 자동 접힌다. */
#tmodal .trend{grid-template-columns:repeat(auto-fit,minmax(288px,330px))!important;
  justify-content:center!important;gap:20px!important;
  max-width:1380px!important;margin:0 auto!important}
#tmodal .tf{background:var(--card2)!important;
  border:2px solid #9FBBDA!important;
  box-shadow:0 1px 3px rgba(0,113,190,.10),0 8px 22px rgba(0,113,190,.13)!important}
:root[data-theme="dark"] #tmodal .tf{border-color:#42536B!important;
  box-shadow:0 1px 3px rgba(0,0,0,.45),0 8px 22px rgba(0,0,0,.40)!important}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) #tmodal .tf{border-color:#42536B!important;
    box-shadow:0 1px 3px rgba(0,0,0,.45),0 8px 22px rgba(0,0,0,.40)!important}
}

#tmodal .mclose{background:var(--acc)!important;color:#fff!important;border:0!important;
  border-radius:11px!important;font-weight:800!important;
  box-shadow:0 0 0 3px rgba(255,255,255,.92),0 3px 12px rgba(18,60,122,.30)!important}
#tmodal .mclose:hover{background:var(--acc-2)!important;color:#fff!important}
#tmodal .mclose:focus-visible{outline:3px solid var(--ci-or)!important;outline-offset:3px!important}
:root[data-theme="dark"] #tmodal .mclose,
:root[data-theme="dark"] #tmodal .mclose:hover{color:#0A1422!important;
  box-shadow:0 0 0 3px rgba(23,31,45,.92),0 3px 12px rgba(0,0,0,.55)!important}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) #tmodal .mclose,
  :root:not([data-theme="light"]) #tmodal .mclose:hover{color:#0A1422!important;
    box-shadow:0 0 0 3px rgba(23,31,45,.92),0 3px 12px rgba(0,0,0,.55)!important}

  #tmodal .mbody.tbody{padding:10px 12px 16px!important}
  /* 좁은 화면에서도 칸 폭에 상한을 둔다 (글씨가 칸 폭에 비례해 커지므로) */
  #tmodal .trend{grid-template-columns:repeat(auto-fit,minmax(0,336px))!important;

/* ══ 슬로건 · 41년 한 줄 (요청 2026-09-10) ═══════════════════
   TRUST 1960 에서 채택한 문구를 홈페이지에도 세운다.
   ① 로고 밑(상시) ② 인트로 3단째(첫인상) 두 곳, 크기를 갈라
      "서명"과 "선언"으로 역할을 나눈다 */
/* 로고와 슬로건 사이 여백 (2026-09-10 실측 교정)
   6px 이었는데 슬로건 아래(헤더 경계선까지)는 22px 이라 위쪽만 답답했다.
   위 14 / 아래 14 로 맞춘다. 헤더 아래 여백을 16 → 12 로 줄여 상쇄했으므로
   헤더 높이 85px · 추이 제목 y=137px 은 그대로다 (밀림 0px). */
.lgw{display:flex;flex-direction:column;align-items:flex-end;gap:14px;flex:0 0 auto}
/* 위 규칙(1508행 header{padding-bottom:20px!important})보다 뒤에 두고 같은 무게로 이긴다 */
header{padding-bottom:12px!important}
.lgslg{font-family:"Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo",serif;
  font-weight:700;font-style:italic;font-size:16px;color:#C2560E;
  letter-spacing:-.01em;white-space:nowrap;line-height:1}
.lgslg b{font-style:normal;font-weight:800}
:root[data-theme="dark"] .lgslg{color:#F5A85A}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .lgslg{color:#F5A85A} }
/* 좁은 화면 : 로고 옆에 남는 틈이 390px 에서 36px 뿐이라 로고 칸에 두면
   제목과 겹친다 → 감싼 틀을 풀어(display:contents) 로고는 제 자리로,
   슬로건만 헤더 아래쪽 왼쪽에 한 줄로 앉힌다. DOM 을 복제하지 않는다 */
@media (max-width:700px){
  header{position:relative;padding-bottom:38px!important}
  .lgw{display:contents}
  .lgslg{position:absolute;left:0;bottom:10px;font-size:14px}
}
@media (max-width:400px){ .lgslg{font-size:12.5px} }

/* 인트로 슬로건은 사용자 요청으로 뺐다 (2026-09-10).
   되살릴 때는 .ie 다음에 <span class="islg"> 한 줄을 넣고 아래 규칙을 되살린다.
.intro .islg{display:block;margin-top:18px;
  font-family:"Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo",serif;
  font-weight:700;font-style:italic;font-size:clamp(17px,2.5vw,27px);
  color:#F5A85A;letter-spacing:-.01em}
.intro .islg b{font-style:normal;font-weight:800;color:#FFD9A8} */

/* 41년 한 줄 : 숫자 세 개만 굵게 + 옅은 온기 바탕.
   줄 전체를 굵게 하면 바로 위 통계 카드(22px 800)와 위계가 부딪친다 */
.legacy{font-size:14px!important;padding:9px 14px 9px 13px!important;

:root[data-theme="dark"] .legacy{background:#1C1610;border-color:#3A2E22;border-left-color:#8A5A2B}
:root[data-theme="dark"] .legacy b{color:#E8A76B}
@media (prefers-color-scheme:dark){

/* ══ 뉴스레터 : 발송본 면 · PDF 단추 (요청 2026-09-10) ═══════════
   발송본(PDF 1장)과 그 주 기록(확인된 기사 전체)은 범위가 다르다.
   PDF 는 성장 소식이 없는 주에 8→12주로 창을 넓혀 채우므로 이전 주 기사가
   섞인다. 그래서 두 면을 나누고, 발송본 면만 PDF 와 같은 구성으로 세운다. */
.sbh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 11px}

   ① 왼쪽 호 목록이 오른쪽 본문보다 한참 아래까지 흘러내려 바닥이 어긋나
