var ISSUES = [{"vol":"2026-38","start":"2026-09-14","end":"2026-09-20","pdf":"pdf/Kiturami_Newsletter_2026-38.pdf","items":[{"date":"2026-09-14","cat":"기술·신제품","title":"귀뚜라미, '2027년형 3세대 카본매트 AI 온돌' 출시","summary":"귀뚜라미가 'AI 수면 제어 시스템'과 'AI 척척 온도 시스템'을 탑재해 개인별 수면온도와 습관에 맞춰 난방을 자동 조절하는 '2027년형 귀뚜라미 3세대 카본매트 AI 온돌'을 출시했다. 리모컨 AI 버튼을 3초간 누르면 선호 수면온도와 사용시간을 학습하고, 자리를 비우면 절전 운전으로 자동 전환한다. 최대 5회 세탁 가능.","press":"연합뉴스","link":"https://www.yna.co.kr/view/AKR20260914101400030?input=1195m","cov":28,"official":true,"outlets":"연합뉴스 · 한국경제 · 문화일보 · 서울경제 · 전자신문 · 뉴시스 · 헤럴드경제 등 28개","id":"E202609-028"},{"date":"2026-09-14","cat":"산업·업계","title":"'원전 에어컨' 맞붙었던 LG전자·센추리, 체코 수주전도 달군다","summary":"체코 두코바니 원전 공조설비 수주전에 나설 가능성이 있는 업체로 귀뚜라미그룹 계열 센추리가 거론된다. 칠러는 발전소 내부 설비와 공간을 냉각하는 냉난방공조 핵심 설비로, 원전에는 안전등급과 비안전등급 칠러가 각각 쓰인다.","press":"아시아투데이","link":"https://www.asiatoday.co.kr/kn/view.php?key=20260914010005236","cov":1,"official":false,"outlets":"아시아투데이","id":"E202609-029"},{"date":"2026-09-15","cat":"기술·신제품","title":"귀뚜라미, A/S 30%는 카카오톡으로… 디지털 고객서비스 가입자 79만명 돌파","summary":"귀뚜라미보일러의 카카오톡 기반 디지털 고객서비스 가입자가 79만명을 넘어섰다. 연간 콜센터 A/S 접수량의 약 30%가 카카오톡 채널로 처리되고 있다.","press":"더퍼스트미디어","link":"http://www.thefirstmedia.net/news/articleView.html?idxno=208667","cov":1,"official":true,"outlets":"더퍼스트미디어","id":"E202609-030"},{"date":"2026-09-15","cat":"사회공헌","title":"귀뚜라미문화재단, 영월군 학생 50명에 장학금 5천만원 전달","summary":"귀뚜라미문화재단이 16일 강원 영월군청 대회의실에서 장학금 수여식을 열고 상동고 야구부·주천고 축구부 학생 50명에게 1인당 100만원씩 총 5천만원을 전달했다.","press":"국제뉴스","link":"https://www.gukjenews.com/news/articleView.html?idxno=3696691","cov":2,"official":false,"outlets":"국제뉴스 · 이뉴스투데이","id":"E202609-031"},{"date":"2026-09-15","cat":"사회공헌","title":"귀뚜라미문화재단, 제천 학생 59명에 장학금 5천만원 전달(제천 첫 지원)","summary":"귀뚜라미문화재단이 15일 제천시청 청풍호실에서 장학증서 수여식을 열고 중학생 33명·고교생 14명·대학생 12명 등 59명에게 총 5천만원을 지원했다. 재단이 제천지역 학생을 대상으로 장학사업을 진행한 것은 이번이 처음이다.","press":"뉴시스","link":"https://n.news.naver.com/mnews/article/003/0014191464?sid=102","cov":10,"official":false,"outlets":"뉴스1 · 뉴시스 스 · KBC","id":"E202609-010"},{"date":"2026-09-09","cat":"사회공헌","title":"귀뚜라미문화재단, GIST 학부생 20명에게 장학금 전달","summary":"귀뚜라미문화재단이 광주과학기술원(GIST) 학부생 20명에게 총 5,000만 원의 장학금을 전달했다. 9월 4일 GIST 행정동에서 전달식이 열렸고, 학과 추천과 재단 심의를 거쳐 장학생을 선발했다.","press":"전자신문","link":"https://www.etnews.com/20260909000021","cov":11,"official":false,"outlets":"전자신문 · 뉴시스 · 아시아경제 · 뉴스1 · 디지털타임스 등","id":"E202609-011"},{"date":"2026-09-10","cat":"사회공헌","title":"귀뚜라미그룹, 의정부 학생 80명에 장학금 1억원 지원","summary":"귀뚜라미그룹이 경기 의정부시 관내 고등학생과 대학생 80명에게 총 1억원의 '귀뚜라미 장학금'을 지원했다. 9월 9일 의정부시청 태조홀에서 열린 수여식에는 김원기 의정부시장과 최진민 귀뚜라미그룹 회장을 비롯해 장학생과 학부모 등 80여 명이 참석했다.","press":"에너지신문","link":"https://www.energy-news.co.kr/news/articleView.html?idxno=228078","cov":20,"official":false,"outlets":"경기매일 · 신아일보 · 에너지신문 · 위키트리 · 국제뉴스 · 이뉴스투데이 등 20개","id":"E202609-012"},{"date":"2026-09-10","cat":"산업·업계","title":"'비수기' 사라진 보일러업계…양강, 냉난방공조로 영토 확장","summary":"신규 설치 수요 확대에 한계가 있는 만큼 귀뚜라미와 경동나비엔이 냉난방공조(HVAC)를 새 성장축으로 키우고 있다. 귀뚜라미 그룹의 냉방 부문 매출은 2017년 4,940억원에서 꾸준히 늘어왔다.","press":"글로벌이코노믹","link":"https://www.g-enews.com/view.php?ud=2026091010453025891d2373fc0f_1","cov":1,"official":false,"outlets":"글로벌이코노믹","id":"E202609-013"},{"date":"2026-09-11","cat":"사회공헌","title":"귀뚜라미그룹, DGIST·GIST·UNIST 재학생 120명에 장학금 2억원 후원","summary":"귀뚜라미그룹이 대구경북과학기술원(DGIST)·광주과학기술원(GIST)·울산과학기술원(UNIST) 재학생 120명에게 총 2억원의 '귀뚜라미 장학금'을 후원했다. 7월 24일 DGIST 50명에 5,000만원, 9월 4일 GIST 20명에 5,000만원, 9월 11일 UNIST 50명에 1억원을 전달했다. AI·반도체·로봇·모빌리티 등 미래 산업 핵심 분야 인재를 지원한다.","press":"뉴시스","link":"https://www.newsis.com/view/NISX20260911_0003785623","cov":18,"official":true,"outlets":"뉴시스 · 헤럴드경제 · 아시아경제 · 한국경제 · 뉴스1 · 파이낸셜뉴스 · inews24 등 18개","id":"E202609-024"},{"date":"2026-09-11","cat":"사회공헌","title":"귀뚜라미그룹, UNIST 학생 50명에게 장학금 총 1억원 전달","summary":"울산과학기술원(UNIST)은 11일 산학협력관에서 '2026 귀뚜라미 장학금 수여식'을 열고 학생 50명에게 1인당 200만원씩 총 1억원을 전달했다. 귀뚜라미그룹의 UNIST 첫 장학 지원으로, 당초 25명 5,000만원 계획에서 학생들의 잠재력을 높이 평가해 인원과 금액을 두 배로 늘렸다.","press":"연합뉴스","link":"https://www.yna.co.kr/view/AKR20260913045800057?input=1195m","cov":12,"official":false,"outlets":"연합뉴스 · 문화일보 · 아시아경제 · 동아사이언스 · 경상일보 · UBC 등","id":"E202609-026"},{"date":"2026-09-11","cat":"산업·업계","title":"가스안전공사·도시가스사·보일러 제조사, 중대형 가스보일러 안전관리 협업체계 구축","summary":"한국가스안전공사가 도시가스 3사와 보일러 제조 4사(경동나비엔·귀뚜라미·대성쎌틱에너시스·린나이코리아)를 포함한 7개사와 '중대형 가스보일러 안전관리 강화 업무협약'을 체결했다. 가스소비량 시간당 6만~20만kcal 중형 보일러를 대상으로 합동점검을 시행한다.","press":"에너지신문","link":"https://www.energy-news.co.kr/news/articleView.html?idxno=228082","cov":7,"official":false,"outlets":"에너지신문 · 에너지데일리 · 이투뉴스 · 첨단뉴스 등","id":"E202609-025"},{"date":"2026-09-11","cat":"사회공헌","title":"귀뚜라미문화재단, 양산 인재 육성 장학금 5,000만원 전달","summary":"경남 양산시는 11일 귀뚜라미문화재단이 지역 인재 육성을 위해 장학금 5,000만원을 전달했다고 밝혔다. 중학생 27명과 고등학생 23명 등 50명에게 1인당 100만원씩 지급한다. '누구에게나 교육의 기회는 평등해야 한다'는 재단 설립 취지에 따라 마련됐으며, 학교 추천을 거쳐 장학생을 선발했다.","press":"뉴시스","link":"https://www.newsis.com/view/NISX20260911_0003786011","cov":3,"official":false,"outlets":"뉴시스 · 울산프레스 · 뉴스경남","id":"E202609-027"}]},{"vol":"2026-36","start":"2026-08-31","end":"2026-09-06","items":[{"id":"E202609-001","date":"2026-09-01","cat":"사회공헌","title":"귀뚜라미그룹, 서울 금천구 학생 75명에 장학금 1억원 전달","summary":"귀뚜라미그룹이 서울 금천구 중·고등학생과 대학생 75명에게 장학금 1억원을 후원했다. 1985년 시작된 장학사업은 41년째 이어져 누적 지원 학생이 약 7만명, 사회환원 금액은 약 650억원에 달한다.","press":"이투뉴스","link":"http://www.e2news.com/news/articleView.html?idxno=333806","cov":9,"outlets":"이투뉴스","official":true},{"id":"E202609-002","date":"2026-09-02","cat":"산업·업계","title":"\"한 달 일찍 보일러 점검하세요\"…보일러업계, 서비스 대응체제 돌입","summary":"보일러업계가 난방철을 앞두고 서비스 체제를 정비했다. 귀뚜라미는 연통 파손과 부식 여부를 미리 점검하라고 안내하며, 기온이 내려가면 서비스 접수가 단기간에 몰릴 수 있다고 당부했다.","press":"뉴스1","link":"https://n.news.naver.com/mnews/article/421/0009145238?sid=101","cov":1,"outlets":"뉴스1","official":false},{"id":"E202609-003","date":"2026-09-04","cat":"산업·업계","title":"노후 보일러 사고 막는다···취약계층 연통 교체·CO 경보기 지원","summary":"한국에너지공단과 한국열관리시공협회, 에너지사랑이 취약계층 가정용 보일러 안전관리 사업을 진행한다. 일산화탄소 경보기는 귀뚜라미와 경동나비엔이 지원한다.","press":"에너지신문","link":"https://www.energy-news.co.kr/news/articleView.html?idxno=227938","cov": var FIXY = 2026;
/* 협약(MOU)은 기금 약정이지 전달이 아니다. 지도에는 남기되 금액 합계에서는 뺀다.
   (2026-09-03 · 협약 12곳 6.9억 원이 전달 총액에 섞여 있던 것을 바로잡음) */
function isAgr(s){ return s.mode === "협약"; }
function isDon(s){ return s.mode === "기부"; }
function sumAmt(arr){
  return arr.reduce(function(a,s){ return a + ((isAgr(s)||isDon(s)) ? 0 : (s.amt || 0)); }, 0);
}
function sumCnt(arr){
  return arr.reduce(function(a,s){ return a + ((isAgr(s)||isDon(s)) ? 0 : (s.cnt || 0)); }, 0);
}

  /* 1인 평균은 인원·금액이 모두 확인된 건만으로 계산한다.
     전체 합계로 나누면 인원 미확인 39곳의 금액이 분자에만 들어가 평균이 부풀려진다 */
  var both = v.filter(function(s){ return s.cnt && s.amt && !isAgr(s); });
  var bc = both.reduce(function(a,s){ return a+s.cnt; }, 0);
  var ba = both.reduce(function(a,s){ return a+s.amt; }, 0);
  var prov = {}; v.forEach(function(s){ prov[s.prov] = 1; });
  /* [라벨, 숫자, 단위, 덧말, 등급]
     숫자와 단위를 나눠 둔다. '38곳' 처럼 붙여 쓰면 자릿수가 안 맞아 눈이 걸린다 */
  var wonSplit = function(x){
    var t = won(x);                                     /* 예 "23.5억 원" */
    var m = t.match(/^([\d.,]+)(.*)$/);
    return m ? [m[1], m[2].replace(/^\s+/, "")] : [t, ""];
  };
  var aw = wonSplit(amt), pw = (bc && ba) ? [Math.round(ba/bc/10000).toLocaleString(), "만 원"] : ["—", ""];
  var cells = [
    ["전달 지역", v.length, "곳", "", "hl"],
    /* '00곳 미확인' 덧말은 공개 페이지에 적어두기엔 부적절하다는 지적으로
       삭제한다 — 요청 2026-09-17 */
    ["장학생", (cnt ? cnt.toLocaleString() : "—"), "명", "", "hl"],
    ["장학금", aw[0], aw[1], "", "hl"],
    ["광역시·도", Object.keys(prov).length, "개", "", ""],
    /* 지표는 FIXY(2026) 고정이고 2026년 39곳은 인원·금액이 전부 확인돼 있다.
       "39곳 기준" 은 첫 칸의 "39곳" 과 같은 숫자여서 정보를 더하지 않는다 → 뺀다 */
    ["1인 평균", pw[0], pw[1], "", ""]];
  if(hasP){
    var tot = 0; for(var k in PARTNERS) tot += PARTNERS[k];
    cells.push(["협력사", tot.toLocaleString(), "개사", "", "tl"]);
  }
  $("#stats").innerHTML = cells.map(function(r){
    return '<div class="stat '+r[4]+'">'
      + '<span class="sl">'+r[0]+'</span>'
      + '<b class="num">'+r[1]+(r[2] ? '<em>'+r[2]+'</em>' : '')+'</b>'
      + (r[3] ? '<span class="sn">'+r[3]+'</span>' : '')
      + '</div>';
  }).join("");
  if($("#sheadn")){
    var unk2 = v.filter(function(s){ return s.cnt == null; }).length;
    $("#sheadn").textContent = FIXY + "년 확인분 · " + v.length + "곳"
      ;                                     /* '인원 미확인 N곳' 문구 삭제 — 요청 2026-09-17 */
  }
  /* 숫자 세 개만 굵게 : 줄 전체를 굵게 하면 위 통계 카드와 위계가 겹친다 */
  $("#legacy").innerHTML =
    '1985년 시작한 장학사업 <b>41년</b> · 누적 장학생 <b>약 7만 명</b>'
    + ' · 사회환원 <b>약 650억 원</b>';
}

/* ── 지도 ────────────────────────────────────── */
var MSUMD = null;                              /* 연도 요약 내용 (제목 · 행) */

/* 크게 보기 : 칸의 오른쪽 끝에 붙는 HTML 연도 요약.
   SVG 안에 그리면 그림 끝(=울릉도 위)에 걸린다 */
/* 좁은 화면에서 연도·월 줄은 좌우로 미는 띠가 된다.
   고른 칸이 띠 밖에 있으면 보이지 않으므로 가운데로 굴려 준다 */
function segScroll(){
  ["#yr", "#mon"].forEach(function(sel){
    var seg = document.querySelector(".mapbox " + sel);
    if(!seg) return;
    /* 흐림은 '그쪽에 더 있을 때' 만 준다. 늘 주면 끝에 닿았는데도
       고른 칸이 흐려져 고장처럼 보인다 */
    var edge = function(){
      var l = seg.scrollLeft > 2;
      var r = seg.scrollLeft + seg.clientWidth < seg.scrollWidth - 2;
      seg.classList.toggle("sl", l);
      seg.classList.toggle("sr", r);
    };
    if(seg.scrollWidth > seg.clientWidth + 1){
      var on = seg.querySelector('button[aria-pressed="true"]');
      if(on){
        var r0 = on.getBoundingClientRect(), s0 = seg.getBoundingClientRect();
        seg.scrollLeft += (r0.left + r0.width / 2) - (s0.left + s0.width / 2);
      }
    }
    edge();
    if(!seg.dataset.edge){ seg.dataset.edge = "1"; seg.addEventListener("scroll", edge); }
  });
}

function msumHtml(){
  var host = $("#map") && $("#map").closest(".panel");
  if(!host) return;
  var old = host.querySelector(".msumh");
  if(old) old.parentNode.removeChild(old);
  if(!MSUMD) return;
  var d = document.createElement("div");
  d.className = "msumh";
  d.innerHTML = '<div class="mshd">' + esc(MSUMD.ttl) + '</div>'
    + MSUMD.rows.map(function(r){
        if(r[1] == null) return '<div class="msrf">' + esc(r[0]) + '</div>';
        return '<div class="msrw"><span>' + esc(r[0]) + '</span><b>' + esc(r[1]) + '</b></div>';
      }).join("");
  host.appendChild(d);
  placeSum();
}

/* 연도 요약 카드는 지도 위에 얹혀 있어, 화면 폭에 따라 울릉도·독도나
   표식을 덮는 일이 있었다 (1100 · 1280 · 1366px 실측 — 2026-09-10).
   네 귀퉁이를 차례로 시험해 아무것도 덮지 않는 첫 자리를 쓴다.
   덮는 것으로 보는 것 : 울릉도·독도(.iset) · 표식(.mk) · 지명(.mlab)
                        · 왼쪽 조작 칸(기간 · 월별) */
function placeSum(){
  var card = document.querySelector(".msumh");
  if(!card) return;
  card.style.top = card.style.bottom = card.style.left = card.style.right = "";
  if(!document.body.classList.contains("mopen")){ card.removeAttribute("data-at"); return; }
  var panel = card.parentNode, pr = panel.getBoundingClientRect();
  var isl = [].slice.call(panel.querySelectorAll("svg.kmap .iset"));
  var ink = [].slice.call(panel.querySelectorAll(
    "svg.kmap .iset, svg.kmap .jset, svg.kmap .mk, svg.kmap .mlab, svg.kmap .ilab,"
    + " .bars.mrow, .monwrap:not([hidden])"));

  /* 울릉도·독도 밑으로 내려 앉는 자리를 후보에 더한다 */
  var islB = 0;
  isl.forEach(function(g){ var r = g.getBoundingClientRect(); if(r.bottom > islB) islB = r.bottom; });
  var under = islB ? Math.round(islB - pr.top + 10) : null;

  function cost(){
    var c = card.getBoundingClientRect(), n = 0, k, r;
    for(k = 0; k < ink.length; k++){
      r = ink[k].getBoundingClientRect();
      if(!r.width && !r.height) continue;
      if(r.left < c.right && r.right > c.left && r.top < c.bottom && r.bottom > c.top){
        /* 울릉도·독도를 덮는 것이 가장 큰 흠 · 제주가 그다음 (사용자 요청) */
        var cl = ink[k].getAttribute("class") || "";
        n += cl.indexOf("bars") >= 0 || cl.indexOf("monwrap") >= 0 ? 300
           : cl.indexOf("iset") >= 0 || cl.indexOf("ilab") >= 0 ? 100
           : cl.indexOf("jset") >= 0 ? 40 : 12;
      }
    }
    return n;
  }
  function tryAt(at, topPx){
    card.setAttribute("data-at", at);
    card.style.top = topPx == null ? "" : topPx + "px";
    if(topPx != null){ card.style.bottom = "auto"; }
    return cost();
  }

  var plans = [["tr", null]];
  if(under != null) plans.push(["ur", under]);
  plans.push(["br", null], ["tl", null], ["bl", null]);

  var best = null, bestC = 1e9, i, c;
  for(i = 0; i < plans.length; i++){
    c = tryAt(plans[i][0], plans[i][1]);
    if(c === 0) return;                       /* 아무것도 덮지 않는다 */
    if(c < bestC){ bestC = c; best = plans[i]; }
  }
  tryAt(best[0], best[1]);                    /* 가장 덜 덮는 자리 */
}

function map(){
  var v = shown();
  var on = {};
  if(mode !== "p") v.forEach(function(s){ on[s.prov] = 1; });
  var pmax = 0; for(var k in PARTNERS) if(PARTNERS[k] > pmax) pmax = PARTNERS[k];
  /* 제주를 본토와 같이 그리면 남쪽 여백 때문에 지도가 작아진다.
     본토만 -8~532 / -8~535 로 크롭해 크게 그리고, 제주는 우측 하단 인셋으로 옮긴다.
     (울릉도·독도는 원본 데이터에서 경북 path 안에 이미 들어 있다) */
  /* 틀 : 왼쪽 빈 여백을 걷고(x 0 부터), 오른쪽은 땅 끝(524) 까지만 */
  var VX = 0, VW = 541;   /* 울릉도(~524) 오른쪽에 독도 자리만 둔다 (이름표 없음) */
  /* 일반 화면에서는 땅을 26 단위 내려 요약 카드가 울릉도를 덮지 않게 한다.
     크게 보기는 카드를 바깥 HTML 로 쓰므로 내릴 이유가 없다 */
  var VSH = document.body.classList.contains("mopen") ? 0 : 10;
  var svg = ['<svg class="kmap' + (year === 0 ? ' dense' : '') + '" viewBox="'
    + VX + ' -10 ' + VW + ' ' + (553 + VSH) + '" role="img"'
    + ' aria-label="장학금 전달 지역 지도. 제주와 독도는 따로 표기">'];
  svg.push('<g class="mshift" transform="translate(0,' + VSH + ')">');
  var sumArr = [];                     /* 연도 요약은 내리지 않는다 → 따로 담는다 */
  var prov = function(id, style){
    var kr = MAPD.name[id] || id;
    return '<path class="prov'+(on[kr]?' on':'')+'" d="'+MAPD.paths[id]+'"'+(style||'')+'>'
      + '<title>'+kr+(PARTNERS[kr] ? " · 협력사 "+PARTNERS[kr]+"개사" : "")+'</title></path>';
  };
  Object.keys(MAPD.paths).forEach(function(id){
    if(id === "jeju") return;                       /* 제주는 아래 인셋에서 그린다 */
    var kr = MAPD.name[id] || id, style = "";
    if(mode !== "s" && hasP && PARTNERS[kr]){
      var t = 0.14 + 0.62 * (PARTNERS[kr] / pmax);
      style = ' style="fill:color-mix(in srgb, var(--teal) '+Math.round(t*100)+'%, var(--map))"';
    }
    svg.push(prov(id, style));
  });
  /* 제주 인셋 : 원본(x 74~151, y 589~630)을 우측 하단 빈 자리로 옮긴다 */
  var JX = 432, JY = 452, JD = { x: 74, y: 589 };
  var jdx = JX - JD.x, jdy = JY - JD.y;
  svg.push('<g class="jset" transform="translate('+jdx+','+jdy+')">' + prov("jeju") + '</g>');
  svg.push('<rect class="jbox" x="'+(JX-12)+'" y="'+(JY-12)+'" width="100" height="66" rx="6"></rect>');
  svg.push('<text class="jlab" x="'+(JX-12)+'" y="'+(JY+68)+'">제주</text>');
  /* 독도 인셋 — 울릉도(x 512~522, y 128~136) 남동쪽 빈 바다에 놓는다.
     실제 좌표는 x 608 · y 167 로 틀(526) 밖 82 단위 지점이다.
     점선 상자와 이음선으로 '따로 표기' 임을 밝힌다. 서도(큰 섬)·동도 두 개 */
  /* 울릉도 : 경상북도 path 안에 있어 이름·툴팁이 없었다.
     투명한 원을 얹어 제 이름을 갖게 하고, 왼쪽에 이름표를 단다 */
  svg.push('<g class="iset">'
    + '<circle class="ihit" cx="518" cy="132" r="10">'
    +   '<title>울릉도 · 경상북도 울릉군</title></circle>'
    + '<text class="ilab" x="506" y="136" text-anchor="end">울릉도</text>'
    + '</g>');
  /* 독도 : 울릉도 동남동. 서도(큰 섬) · 동도 · 부속 암초.
     이름표는 붙이지 않고(지도가 좁아진다) 마우스를 올리면 이름이 나온다 */
  svg.push('<g class="iset dset">'
    + '<path class="prov drock" d="M528 147'
      + 'c1.7-1.8 4.2-1.6 5.3.3 1.1 1.8.2 4.1-1.7 4.8-2.1.8-4.3-.5-4.7-2.2'
      + '-.3-1.1 0-2.1 1.1-2.9Z"></path>'
    + '<path class="prov drock" d="M534 151'
      + 'c1.2-1.3 3.1-1.1 3.9.3.8 1.3.1 3-1.4 3.4-1.5.5-3.2-.4-3.4-1.7'
      + '-.1-.8.1-1.4.9-2Z"></path>'
    + '<circle class="prov drock" cx="538" cy="145.6" r=".9"></circle>'
    + '<circle class="ihit" cx="533" cy="150" r="8.5">'
    +   '<title>독도 · 경상북도 울릉군 · 실제로는 울릉도 동남동 87.4km</title></circle>'
    + '</g>');
  if(mode !== "s" && hasP){
    Object.keys(MAPD.paths).forEach(function(id){
      var kr = MAPD.name[id] || id;
      if(!PARTNERS[kr]) return;
      var c = MAPD.center[id];
      // 표식과 겹치면 숫자를 생략한다 (겹쳐 보기에서 글자가 뭉치는 것 방지)
      var clash = (mode === "b") && v.some(function(s){
        return Math.abs(s.x - c[0]) < 26 && Math.abs(s.y - c[1]) < 22; });
      if(clash) return;
      svg.push('<text class="pcount" x="'+c[0]+'" y="'+(c[1]+4)+'">'+PARTNERS[kr]+'</text>');
    });
  }
  /* 연도 요약 — 우측 상단 구석.
     확인분과 공식 발표를 나란히 적는다. 확인분만 적으면 회사 실적을 스스로 축소해
     보여주게 되고(2022·2024는 실제의 1/3), 공식만 적으면 지도와 숫자가 어긋난다.
     자리는 x 382~532 · y -6~136 — 경북 path 가 y 127 부터라 4행까지만 넣는다 */
  if(mode !== "p"){
    var mo = META[String(year)] || {};
    var sc2 = sumCnt(v), sa2 = sumAmt(v);
    var ttl = (year === 0) ? "2022 ~ 2026" : (year + "년" + (month ? " " + (+month) + "월" : ""));
    var rows = [["확인 기록", v.length + "곳"]];
    if(year !== 0 && !month){
      var of = mo.official ? mo : (mo.h1 || null);           /* 2026 은 상반기 공식만 있다 */
      if(of && of.official)
        /* 공식 수치는 라벨+값이 한 줄에 안 들어가므로 한 줄 전체를 쓴다 */
        rows.push([(mo.official ? "공식" : "상반기") + " "
          + of.official + "곳" + (of.students ? " · " + of.students.toLocaleString() + "명" : ""),
          null]);
    }
    if(sc2) rows.push(["장학생", sc2.toLocaleString() + "명"]);
    if(sa2) rows.push(["장학금", won(sa2)]);
    rows = rows.slice(0, 4);
    MSUMD = { ttl: ttl, rows: rows };            /* 크게 보기 HTML 카드가 쓴다 */
    /* 4행이면 카드 바닥이 y 120 — 경북 path 가 y 127 부터라 딱 비켜 간다 */
    var SW = 158, SX = VX + VW - SW, HD = 27, RH = 22, PAD = 7;
    var SH = HD + rows.length * RH + PAD, SY = -8, R = 9;
    /* 머리띠는 위 두 귀퉁이만 둥근 path 로 그린다 (rect 로는 아래도 같이 둥글어진다) */
    var head = "M" + SX + " " + (SY + HD)
      + "V" + (SY + R) + "a" + R + " " + R + " 0 0 1 " + R + " " + (-R)
      + "h" + (SW - 2 * R) + "a" + R + " " + R + " 0 0 1 " + R + " " + R
      + "V" + (SY + HD) + "Z";
    sumArr.push('<g class="msum">'
      + '<rect class="mscard" x="'+SX+'" y="'+SY+'" width="'+SW+'" height="'+SH+'" rx="'+R+'"></rect>'
      + '<path class="mshead" d="'+head+'"></path>'
      + '<rect class="msrail" x="'+SX+'" y="'+(SY+6)+'" width="3" height="'+(HD-12)+'" rx="1.5"></rect>'
      + '<text class="mst" x="'+(SX+12)+'" y="'+(SY+17)+'">' + esc(ttl) + '</text>'
      + '<line class="msl" x1="'+SX+'" y1="'+(SY+HD)+'" x2="'+(SX+SW)+'" y2="'+(SY+HD)+'"></line>'
      + rows.map(function(r, i){
          var yy = SY + HD + RH * i + 17;
          var sep = i ? '<line class="msl" x1="'+(SX+11)+'" y1="'+(yy-16)+'" x2="'+(SX+SW-11)+'" y2="'+(yy-16)+'"></line>' : "";
          if(r[1] == null)                                   /* 한 줄 전체를 쓰는 행 */
            return sep + '<text class="msf" x="'+(SX+12)+'" y="'+yy+'">'+esc(r[0])+'</text>';
          return sep
               + '<text class="msk" x="'+(SX+12)+'" y="'+yy+'">'+r[0]+'</text>'
               + '<text class="msv" x="'+(SX+SW-12)+'" y="'+(yy+1)+'" text-anchor="end">'+esc(r[1])+'</text>';
        }).join("")
      + '</g>');
  }
  if(mode !== "p"){
    var order = v.map(function(s){ return SPOTS.indexOf(s); })
                 .sort(function(a,b){ return SPOTS[b].cnt - SPOTS[a].cnt; });
    /* 같은 지역(같은 좌표)에 여러 번 전달됐어도 지도에는 가장 최근 1건만 표기한다.
       (연도 필터가 걸려 있어도, 전체보기여도 동일하게 적용) 목록에서 과거 기록을
       직접 선택했을 때(cur)는 예외로 그 기록을 그대로 보여준다 — 요청 2026-09-17 */
    (function(){
      var latest = {};
      order.forEach(function(i){
        var s = SPOTS[i], k = Math.round(s.x)+","+Math.round(s.y);
        if(!(k in latest)){ latest[k] = i; return; }
        if(latest[k] === cur) return;
        if(i === cur || SPOTS[i].date > SPOTS[latest[k]].date) latest[k] = i;
      });
      var keep = {};
      for(var k in latest) keep[latest[k]] = 1;
      order = order.filter(function(i){ return keep[i]; });
    })();
    /* 38곳이 한 화면에 들어가면 라벨이 뭉친다.
       마커를 먼저 다 깔고, 라벨은 빈 자리를 찾은 것만 그린다.
       자리를 못 찾은 곳은 오른쪽 [전달 기록] 목록에서 전부 볼 수 있다. */
    var all = (year === 0);
    var rad = {}, boxes = [], px = {}, py = {};
    /* 같은 시·군이 여러 해에 걸쳐 나오면 좌표가 완전히 겹친다.
       전체 보기에서는 같은 자리에 모인 표식을 작은 원으로 흩뿌려 전부 보이게 한다. */
    var grp = {};
    order.forEach(function(i){
      var s = SPOTS[i], k = Math.round(s.x)+","+Math.round(s.y);
      (grp[k] = grp[k] || []).push(i);
    });
    /* 고른 곳이 속한 무리 — 이 무리는 더 넓게 벌리고, 형제 표식을 위에 얹는다 */
    var curGrp = {}, curN = 1;
    if(SPOTS[cur]){
      var ck = Math.round(SPOTS[cur].x)+","+Math.round(SPOTS[cur].y);
      (grp[ck] || []).forEach(function(i){ curGrp[i] = 1; });
      curN = (grp[ck] || [cur]).length;
    }
    /* 표식 크기는 울진군(장학생 50명) 기준으로 전부 통일한다.
       원 크기로 인원을 나타내면 촘촘한 곳이 뭉개져 읽히지 않는다. 인원은 목록·상세에 있다. */
    var RU = 3.4 + Math.sqrt(50) * 0.62;             /* = 7.8 */
    order.forEach(function(i){
      var s = SPOTS[i];
      /* 고른 곳은 원과 이름을 함께 키운다 (깜빡임 효과는 그대로 유지된다) */
      /* 무리 안에서 크게 키우면 옆 표식을 덮어 누를 수 없게 된다 → 1.5 로 줄인다 */
      rad[i] = (all ? RU * 0.72 : RU) * (i === cur ? (curN > 1 ? 1.5 : 1.75) : 1);
      /* 제주 표식은 인셋으로 평행이동 */
      var jj = (s.prov === "제주");
      px[i] = s.x + (jj ? jdx : 0);
      py[i] = s.y + (jj ? jdy : 0);
    });
    {
      Object.keys(grp).forEach(function(k){
        var g = grp[k]; if(g.length < 2) return;
        var R = all ? (3.4 + g.length * 0.9) : (5.5 + g.length * 1.4);
        if(g.indexOf(cur) >= 0) R *= 2.1;      /* 고른 무리는 넉넉히 벌린다 */
        g.sort(function(a,b){ return SPOTS[a].date < SPOTS[b].date ? -1 : 1; });
        g.forEach(function(i, n){
          var t = -Math.PI/2 + n * 2*Math.PI/g.length;
          /* 제주 표식이 겹쳐 흩어질 때도 인셋 이동을 적용한다 — 안 하면 본토 밖
             원래 제주 좌표(좌측 하단)에 그대로 남아 떨어져 보인다 (요청 2026-09-17) */
          var jj2 = (SPOTS[i].prov === "제주");
          px[i] = SPOTS[i].x + (jj2 ? jdx : 0) + Math.cos(t)*R;
          py[i] = SPOTS[i].y + (jj2 ? jdy : 0) + Math.sin(t)*R;
        });
      });
    }
    order.forEach(function(i){
      boxes.push({x1:px[i]-rad[i]-2, y1:py[i]-rad[i]-2, x2:px[i]+rad[i]+2, y2:py[i]+rad[i]+2});
    });
    var hit = function(b){
      for(var k=0;k<boxes.length;k++){ var o=boxes[k];
        if(b.x1<o.x2 && b.x2>o.x1 && b.y1<o.y2 && b.y2>o.y1) return true; }
      return false;
    };
    /* 선택한 곳의 라벨을 먼저 배치해 자리를 확보한다 */
    var top = [], sib = [];
    var lorder = order.slice().sort(function(a,b){
      return (b === cur ? 1 : 0) - (a === cur ? 1 : 0); });
    lorder.forEach(function(i){
      var s = SPOTS[i], r = rad[i], sx = px[i], sy = py[i];
      /* 광역시의 '구'는 이름만으론 구분이 안 된다 (대구 중구 / 대전 중구). 시·도를 붙인다. */
      var lab = s.nm.replace(" (DGIST)","");
      if(/구$/.test(lab) && lab.indexOf("시") < 0) lab = s.prov + " " + lab;
      var w = lab.length * (i === cur ? 22.5 : 15.4) + 4, h = (i === cur ? 26 : 18);
      var cand = [
        {x:sx,          y:sy-r-8,  a:"middle", x1:sx-w/2,   y1:sy-r-8-h},
        {x:sx,          y:sy+r+17, a:"middle", x1:sx-w/2,   y1:sy+r+3},
        {x:sx+r+6,      y:sy+6,    a:"start",  x1:sx+r+6,   y1:sy-h/2+2},
        {x:sx-r-6,      y:sy+6,    a:"end",    x1:sx-r-6-w, y1:sy-h/2+2},
        /* 촘촘한 곳에서는 조금 더 멀리 밀어 본다 */
        {x:sx,          y:sy-r-26, a:"middle", x1:sx-w/2,   y1:sy-r-26-h},
        {x:sx,          y:sy+r+34, a:"middle", x1:sx-w/2,   y1:sy+r+20},
        {x:sx+r+26,     y:sy+6,    a:"start",  x1:sx+r+26,  y1:sy-h/2+2},
        {x:sx-r-26,     y:sy+6,    a:"end",    x1:sx-r-26-w,y1:sy-h/2+2}
      ];
      var lp = null;
      /* 전체 보기는 표식이 122개라 라벨을 달지 않는다. 선택한 곳만 표기 */
      if(!all || i === cur) for(var c=0;c<cand.length;c++){
        var b = {x1:cand[c].x1-1, y1:cand[c].y1, x2:cand[c].x1+w+1, y2:cand[c].y1+h};
        if(b.x1 < -6 || b.x2 > 530 || b.y1 < -8 || b.y2 > 540) continue;
        if(!hit(b)){ lp = cand[c]; boxes.push(b); break; }
      }
      var lead = "";
      if(i === cur && !lp){                          /* 선택한 곳은 반드시 보인다 */
        lp = cand[4];
        boxes.push({x1:lp.x1-1, y1:lp.y1, x2:lp.x1+w+1, y2:lp.y1+h});
        lead = '<line class="llead" x1="'+sx+'" y1="'+(sy-r-1)+'" x2="'+sx+'" y2="'+(lp.y+4)+'"></line>';
      }
      var g = ('<g class="mk'+(i===cur?' sel':'')+'" data-i="'+i+'" role="button" tabindex="0"'
        + ' aria-pressed="'+(i===cur)+'" aria-label="'+esc(s.nm)+' '+s.date+' 장학생 '+s.cnt+'명">'
        /* 고른 곳 하나만 계속 깜빡인다. 다른 곳을 누르면 그 곳으로 옮겨 간다 */
        + (i === cur ? '<circle class="pulse" cx="'+sx+'" cy="'+sy+'" r="'+(r+5)+'"></circle>' : '')
        + '<circle class="halo" cx="'+sx+'" cy="'+sy+'" r="'+(r+4)+'"></circle>'
        /* 기관·지자체 모양 구분은 없앴다 (122곳 중 4곳 · 읽는 사람이 쓸 수 없는 정보) */
        /* 성격(전달·협약·미확인)에 따른 속 빈 흰 원도 폐지했다.
           흰 원이 지도에 구멍처럼 보이고, 인원 미확인은 클릭 상세에서 이미 밝힌다 */
        + '<circle class="dot'
          + (all?' y'+(s.yr-2021):'') + (s.mode==="기부"?' don':'') + '" cx="'+sx+'" cy="'+sy+'" r="'+r+'"></circle>'
        + '<title>'+esc(s.nm)+' · '+s.date+' · 장학생 '+s.cnt+'명 · '+won(s.amt)+'</title>'
        + lead
        + (lp ? '<text class="mlab" x="'+lp.x+'" y="'+lp.y+'" text-anchor="'+lp.a+'">'+esc(lab)+'</text>' : '')
        + '</g>');
      /* 고른 곳 → 그 다음 같은 무리의 형제 → 나머지 순으로 위에 얹는다.
         형제를 고른 표식 위에 두면 큰 원에 덮이지 않아 바로 누를 수 있다 */
      if(i === cur) top.push(g);
      else if(curGrp[i]) sib.push(g);
      else svg.push(g);
    });
    top.forEach(function(g){ svg.push(g); });
    sib.forEach(function(g){ svg.push(g); });
  }
  svg.push('</g>');                    /* 내려간 땅 묶음 닫기 */
  sumArr.forEach(function(s){ svg.push(s); });   /* 요약 카드는 제자리(맨 위) */
  svg.push('</svg>');
  $("#map").innerHTML = svg.join("");
  msumHtml();                                   /* 크게 보기용 바깥 카드 갱신 */
  segScroll();                                  /* 좁은 화면 : 고른 칸을 띠 안으로 */
  Array.prototype.forEach.call(document.querySelectorAll(".mk"), function(g){
    var pick = function(){ cur = +g.dataset.i; render(); };
    g.onclick = pick;
    g.onkeydown = function(e){
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); pick(); } };
  });
  var L = [], v0 = shown();
  if(mode !== "p"){
    if(year === 0){
      YEARS.forEach(function(y){
        L.push('<span><i class="y'+(y-2021)+'"></i>'+String(y).slice(2)+'년</span>'); });
      L.push('<span class="lnote">같은 시·군이 여러 해 겹치면 작은 원으로 흩어 표기합니다. 이름은 연도를 고르면 나옵니다.</span>');
    } else {
      L.push('<span><i></i>전달 확인 · 원 크기 = 장학생 수</span>');
      L.push('<span><i class="g"></i>대학 · 고교 · 교육청 등 기관</span>');
      if(v0.some(function(s){ return s.mode === "협약"; }))
        L.push('<span><i class="a"></i>협약만 확인 (수여식은 별건)</span>');
      /* '내용 미확인' 범례 문구도 공개 페이지에는 적지 않는다 — 요청 2026-09-17 */
      if(v0.some(function(s){ return s.mode === "기부"; }))
        L.push('<span><i class="don"></i>장학금 외 기부(대학·병원 등) · 합계에서 제외</span>');
    }
  }
  if(mode !== "s") L.push('<span><i class="t"></i>협력사 수 · 색이 진할수록 많음</span>');
  if($("#legend")) $("#legend").innerHTML = L.join("");
  /* 전체 보기에서만 연도별 색 범례를 보여준다 (요청 4) */
  if($("#ylegend")){
    $("#ylegend").innerHTML = (year === 0)
      ? YEARS.map(function(y){
          return '<span><i class="y'+(y-2021)+'"></i>'+String(y).slice(2)+'년</span>'; }).join("")
        + '<span class="ynote2">같은 시·군이 여러 해 겹치면 작은 원으로 흩어 표기</span>'
      : "";
  }
}

/* ── 기사 ─────────────────────────────────────
   기사는 지도의 연도·월 선택과 무관하게 항상 최신순으로 보여준다.
   지도는 5개년을 오가지만 기사는 "지금 무슨 일이 있었나"를 보는 자리다. */
var cat = "", shownN = 12;   /* 처음 12건만 · [더 보기]로 늘린다 */
var SORTED = ARTS.slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; });
var REST = SORTED.slice(1);          /* 대표 기사를 뺀 목록 */


/* 기사 제목·요약에서 지역을 찾아 지도 표식과 연결한다 */
/* 기사 ↔ 전달 기록 짝짓기.
   [지도에서 보기] 와 인원·금액 배지가 여기에 달리므로 세 겹으로 좁혀 둔다.
   ① 사회공헌 기사만 — '소방안전교육' 같은 기사에 지도 링크가 붙어
      나눔을 한 것처럼 읽히던 문제가 있었다 (2026-09-03 지적)
   ② 지역명이 기관명 안에 우연히 들어간 경우를 걷어낸다
      예) "서울강서소방서" 의 '강서' → 강서구로 잡히던 것
      규칙 : 지역명 바로 앞 글자가 한글이면 더 긴 낱말의 일부로 보고 버린다
   ③ 기사 날짜와 전달 날짜가 120일 넘게 떨어지면 다른 건으로 본다 */
var HAN = /[가-힣]/;
/* ④ 기관 이름 안의 지역명을 걷어낸다 (2026-09-15 사용자 지적)
      "대구경북과학기술원(DGIST)·광주과학기술원(GIST)·울산과학기술원(UNIST)" 의
      '광주' 가 경기 광주시로 잡혀, 전라도 기사가 경기도 표식으로 연결됐다.
      같은 원인으로 GIST 단독 기사도 경기 광주시로 가고 있었다. */
var INST = /[가-힣]{2,6}과학기술원/g;
/* ⑤ 광역시와 이름이 겹치는 시·군 — 시·도가 본문에 나와야 인정한다.
      경기 광주시 / 광주광역시 를 '광주' 두 글자로는 가를 수 없다.
      (letter1p.py badge_of 가 배지에 쓰던 규칙을 지도 링크에도 옮겨 온 것) */
var METRO = {"서울":1,"부산":1,"대구":1,"인천":1,"광주":1,"대전":1,"울산":1,"세종":1};
function spotOf(a){
  if(a.cat !== "사회공헌") return -1;                         /* ① */
  var i;
  /* ⓪ 링크가 같은 기록이 있으면 같은 사건이다 — 이름 짐작보다 확실하다.
        이 한 줄로 '광주시 동구' 기사가 경기 광주시로 가던 것도 함께 풀린다
        (동구·북구는 '구' 를 떼면 한 글자가 되어 이름으로는 못 찾는다) */
  if(a.link) for(i = 0; i < SPOTS.length; i++){
    if(SPOTS[i].link && SPOTS[i].link === a.link) return i;
  }
  var raw = (a.title || "") + " " + (a.summary || "");
  /* 과기원이 둘 이상 나오면 여러 곳을 한 번에 다룬 합산 기사다.
     한 곳만 골라 보내면 '왜 여기로 가지' 가 된다 — 링크를 걸지 않는다 */
  var insts = raw.match(INST);
  if(insts && insts.length >= 2) return -1;
  var t = raw.replace(INST, " ");
  var ad = new Date(a.date + "T12:00:00Z");
  var best = -1;
  for(i = 0; i < SPOTS.length; i++){
    var nm = SPOTS[i].nm.replace(/ \(.*\)$/, "");
    var key = nm.replace(/(시|군|구)$/, "");
    var prov = SPOTS[i].prov || "";
    var ok = false;
    if(key.length < 2){
      /* '북구·동구' 처럼 한 글자로 줄어드는 이름은 시·도를 붙여 찾는다 */
      if(!prov) continue;
      if(!(new RegExp(prov + "(광역)?시?\\s*" + nm)).test(t)) continue;
      ok = true;
    }else{
      var at = -1;
      while((at = t.indexOf(key, at + 1)) >= 0){              /* ② */
        if(at === 0 || !HAN.test(t.charAt(at - 1))){ ok = true; break; }
      }
      if(!ok) continue;
      if(METRO[key] && prov !== key && t.indexOf(prov) < 0) continue;   /* ⑤ */
    }
    var gap = Math.abs(ad - new Date(SPOTS[i].date + "T12:00:00Z")) / 864e5;
    if(gap > 120) continue;                                   /* ③ */
    if(best < 0 || SPOTS[i].date > SPOTS[best].date) best = i;
  }
  return best;
}

function goSpot(i){
  if(i < 0) return;
  year = SPOTS[i].yr; month = ""; cur = i;
  render();
  var g = document.querySelector('.mk[data-i="'+i+'"]');
  if(g){ g.classList.add("pulse"); setTimeout(function(){ g.classList.remove("pulse"); }, 1600); }
  var mp = $("#map"); if(mp) mp.scrollIntoView({behavior:"smooth", block:"nearest"});

/* ── 대문 선정 ─────────────────────────────────
   "가장 최신"이 아니라 "귀뚜라미가 주인공인 긍정 뉴스"가 대문에 와야 한다.
   업계 동향에 한 줄 언급된 기사가 대문에 걸리는 것을 막는 점수식. */
/* 뉴스레터 PDF(letter1p.py) 와 같은 표를 쓴다 — 한쪽만 고치면 갈라진다 */
var CATW = {"사회공헌":3, "수상·인증":3, "실적·경영":2, "수출·해외":2,
            "기술·신제품":2, "기타":1, "산업·업계":0};
var KRB = /귀뚜라미|최진민|센추리|범양냉방|신성엔지니어링/;
var ASOF = (MARKET && MARKET.asof) || "2026-09-02";
var NOW = new Date(ASOF + "T12:00:00Z");

function subjScore(t){
  if(/^(귀뚜라미|최진민)/.test(t)) return 3;      /* 제목이 귀뚜라미로 시작 = 주체 */
  if(KRB.test(t.split("…")[0].slice(0,20))) return 2;
  if(KRB.test(t)) return 1;
  return 0;                                        /* 언급조차 없으면 대문 자격 없음 */
}
function weeksAgo(d){
  return (NOW - new Date(d + "T12:00:00Z")) / 6048e5;
}
function score(a){
  return subjScore(a.title) + (CATW[a.cat] || 0)
       + Math.min(a.cov, 10) * 0.25
       + (a.official ? 1.5 : 0)
       - weeksAgo(a.date) * 0.55;
}
/* 대문 자격 : 귀뚜라미가 주체이고(2점 이상), 성격이 나눔·수상·실적·수출인 기사만.
   업계 동향(0점)과 기타(1점)는 대문에 올리지 않는다. */
function eligible(a){ return subjScore(a.title) >= 2 && (CATW[a.cat] || 0) >= 2; }
var isSoc = function(x){ return x.cat === "사회공헌"; };
var byScore = function(a,b){ return score(b) - score(a); };

/* ── 대문 두 칸 ──────────────────────────────────────────────
   왼쪽 [주간 동행] : 사회공헌 여러 건 + 요약(건수·보도·금액)
   오른쪽 [주간 성장] : 귀뚜라미가 주인공인 수상·실적·수출 기사
   창(窓)은 4주부터 시작해 3건이 모일 때까지 넓힌다. 실제 창은 화면에 적는다. */
/* 주간 동행 : 이번 주 사회공헌을 숫자로만 요약한다 (제목은 넣지 않는다 · 요청)
   주간 성장 : 이번 주 기사 1건. 이번 주에 없으면 가장 최신 1건만 */
var MON0 = (function(){                        /* 이번 주 월요일 00:00 (UTC 기준) */
  var d = new Date(NOW.getTime());
  var w = (d.getUTCDay() + 6) % 7;             /* 월=0 */
  d.setUTCDate(d.getUTCDate() - w);
  d.setUTCHours(0, 0, 0, 0);
  return d;
})();
function thisWeek(a){ return new Date(a.date + "T12:00:00Z") >= MON0; }

var SOCW = ARTS.filter(function(a){ return eligible(a) && isSoc(a); });
var SOC_W = SOCW.filter(thisWeek);             /* 이번 주 */
var SOCA = { wk: SOC_W.length > 0,
             list: (SOC_W.length ? SOC_W : SOCW.filter(function(a){ return weeksAgo(a.date) <= 4; })) };

var GRWL = ARTS.filter(function(a){ return eligible(a) && !isSoc(a); });
var byNew = function(a, b){ return a.date < b.date ? 1 : -1; };
/* 보여 주는 건 1건이지만, 요약 숫자는 그 창(窓) 안의 전부를 센다.
   이번 주 → 4주 → 8주 → 12주 순으로 넓히고, 실제 창을 화면에 적는다 */
var GRWA = (function(){
  /* 창을 넓혀 가던 사다리(이번주→4→8→12)를 없애고 최근 4주로 고정한다.
     4주에 아무것도 없으면 8주까지만 되돌아보고, 그래도 없으면 가장 최신 1건.
     표기는 언제나 '최근 4주' 로 둔다 (사용자 확정) */
  var use = GRWL.filter(function(a){ return weeksAgo(a.date) <= 4; });
  if(!use.length) use = GRWL.filter(function(a){ return weeksAgo(a.date) <= 8; });
  if(!use.length) use = GRWL.slice().sort(byNew).slice(0, 1);
  return { lbl: "최근 4주", all: use, list: use.slice().sort(byNew).slice(0, 1) };
})();

/* 기준일이 오늘보다 몇 영업일 뒤인가 (주말 제외 · 공휴일은 알 수 없어 세지 않는다).
   서울 기준 날짜로 비교한다. 스냅샷이 늦게 반영되면 눈에 보이게 하려는 것이다. */
function bizLag(ymd){
  if(!ymd) return 0;
  var now = new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Seoul"}));
  var t = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var p = ymd.split("-");
  var d = new Date(+p[0], +p[1] - 1, +p[2]);
  var n = 0, cur = new Date(d.getTime());
  while(cur < t && n < 60){
    cur.setDate(cur.getDate() + 1);
    var w = cur.getDay();
    if(w !== 0 && w !== 6) n++;
  }
  return n;
}

/* 사회공헌 기사 전체 보기 팝업 */
var amd = $("#amodal");
/* 분류 칩 색 — 대문·뉴스레터 탭과 같은 기준으로 나눈다
     사회공헌 = CI 주황 · 주간 성장(수상·실적·수출·기술) = CI 파랑 · 그 외 = 회색 */
function catCls(a){ return isSoc(a) ? "so" : (eligible(a) ? "gr" : "nt"); }

amd.onclick = function(e){ if(e.target === amd) closeArts(); };

/* 주간 동행 아래 미리보기·전체 보기에 쓰는 사회공헌 기사 목록 (최신순) */
var SOCLIST = ARTS.filter(isSoc).slice().sort(byNew);
/* 주간 성장도 같은 구조로 — 비(非)사회공헌 기사 최신순 */
var GRWLIST = ARTS.filter(function(a){ return !isSoc(a); }).slice().sort(byNew);
var HERO = GRWA.list.slice();                  /* 아래 기사 목록에서 뺄 것은 성장 1건뿐 */

/* 대문에 올린 기사도 목록에 그대로 둔다 — 39+36=75 와 아래 목록 수가 어긋나
   하나가 사라진 것처럼 읽혔다 (사용자 결정) */
REST = SORTED.slice();
/* 분류 칩 순서는 건수가 아니라 이 순서로 고정한다 (요청).
   건수 순으로 두면 주마다 칩 자리가 바뀌어 눈이 매번 다시 찾아야 한다 */
var CATORD = ["사회공헌", "수상·인증", "산업·업계", "실적·경영", "기타"];
var CATS = (function(){
  var m = {};
  REST.forEach(function(a){ m[a.cat] = (m[a.cat] || 0) + 1; });
  var out = [];
  CATORD.forEach(function(k){ if(m[k]) out.push([k, m[k]]); });
  Object.keys(m).forEach(function(k){          /* 목록에 없는 분류가 생기면 뒤에 붙인다 */
    if(CATORD.indexOf(k) < 0) out.push([k, m[k]]);
  });
  return out;
})();

/* 핵심 숫자 배지 — 지도 데이터에서 가져오고, 없으면 제목에 적힌 숫자만 인용한다.
   없는 숫자를 만들어내지 않는다. */
function badges(a){
  var b = [], si = spotOf(a);
  if(si >= 0 && a.cat === "사회공헌"){
    var s = SPOTS[si];
    if(s.cnt != null) b.push([s.cnt.toLocaleString(), "명"]);
    if(s.amt != null) b.push([won(s.amt).replace(/ ?원$/, ""), "원"]);
  }
  if(!b.length){
    var t = a.title;
    var m;
    if((m = t.match(/(\d+)년\s*연속/))) b.push([m[1] + "년", "연속"]);
    if(b.length < 2 && (m = t.match(/(\d+)\s*위/)))  b.push([m[1] + "위", ""]);
    if(b.length < 2 && (m = t.match(/([\d,]+)\s*명/))) b.push([m[1], "명"]);
    if(b.length < 2 && (m = t.match(/([\d.]+)\s*억\s*원?/))) b.push([m[1] + "억", "원"]);
  }
  if(!b.length) return "";
  return '<div class="nbadge">' + b.slice(0,2).map(function(x){
    return '<span><b>' + esc(x[0]) + '</b>' + (x[1] ? '<i>' + esc(x[1]) + '</i>' : '') + '</span>';
  }).join("") + '</div>';
}

function hero(){
  var f = function(v){ return v.toLocaleString("ko-KR"); };
  /* 요약 숫자는 전부 실제 데이터에서 센다. 금액·인원은 지도 기록과 짝지어진 건만 더하고,
     같은 전달을 여러 매체가 쓴 경우가 있어 전달 건 단위로 중복을 걷어낸다 */
  var tally = function(list){
    var ev = {}, cov = 0;
    list.forEach(function(a){
      cov += (a.cov || 1);
      var i = spotOf(a);
      if(i >= 0) ev[i] = 1;
    });
    var amt = 0, cnt = 0, k = Object.keys(ev);
    k.forEach(function(i){ amt += (SPOTS[i].amt || 0); cnt += (SPOTS[i].cnt || 0); });
    return { cov: cov, amt: amt, cnt: cnt, n: list.length, ev: k.length };
  };
  var t = tally(SOCA.list), g2 = tally(GRWA.all);

  /* 숫자를 먼저, 이름을 아래에 — 상단 지표 카드와 같은 모양으로 읽히게 한다 */
  var chip = function(lbl, val, key){
    return '<b'+(key ? ' class="k"' : '')+'><i>'+val+'</i><span>'+lbl+'</span></b>';
  };
  var h = "";
  if(SOCA.list.length){
    h += '<div class="panel hpanel"><div class="ptitle">주간 동행'
      + ' <span class="hwin">'+(SOCA.wk ? "이번 주" : "최근 4주")+'</span></div>'
      + '<div class="hsum big">'
      +   chip("사회공헌", t.n+"건", true)
      +   (t.cnt ? chip("장학생", f(t.cnt)+"명", false) : "")
      +   (t.amt ? chip("전달 금액", won(t.amt), false) : "")
      +   chip("관련 기사", f(t.cov)+"건", false)
      + '</div>'
      /* 기사 미리보기 2건 — 제목은 한 줄만, 넘치면 … 으로 자른다.
         안내 문구(각주)는 전체 보기 버튼 아래로 내렸다 */
      + (function(){
          var pv = SOCLIST.slice(0, 2);
          if(!pv.length) return '';
          return '<div class="hrel"><div class="hrt"><b>사회공헌 기사</b>'
            + '<span class="hwin">'+SOCLIST.length+'건</span></div>'
            + pv.map(function(a, i){
                return '<button class="hrl" data-a="'+SOCLIST.indexOf(a)+'">'
                  + '<span class="d">'+fd(a.date)+'</span>'
                  + '<span class="t">'+esc(a.title)+'</span></button>';
              }).join("")
            + '<button class="hmore" id="hmore">전체 보기 '+SOCLIST.length+'건 →</button>'
            + '</div>';
        })()
      + '<p class="hnote">'+(SOCA.wk ? "이번 주" : "최근 4주")+' 확인된 사회공헌 소식입니다.'
      + ' 관련 기사는 같은 소식을 다룬 언론 보도 수입니다.</p>'
      + '</div>';
  }
  var g = GRWA.list[0];
  if(g){
    /* 왼쪽 [주간 동행] 과 같은 구조로 맞춘다 :
       요약 타일 4개 → 안내 문구 → 기사 2건 미리보기 → 전체 보기 */
    var byCat = {};
    GRWA.all.forEach(function(a){ byCat[a.cat] = (byCat[a.cat] || 0) + 1; });
    var top2 = Object.keys(byCat).sort(function(x, y){ return byCat[y] - byCat[x]; }).slice(0, 2);
    h += '<div class="panel hpanel2"><div class="ptitle">주간 성장'
      + ' <span class="hwin">'+GRWA.lbl+'</span></div>'
      + '<div class="hsum big">'
      +   chip("좋은 소식", g2.n+"건", true)
      +   chip("관련 기사", f(g2.cov)+"건", false)
      +   top2.map(function(c){ return chip(c, byCat[c]+"건", false); }).join("")
      + '</div>'
      + (function(){
          var pv = GRWLIST.slice(0, 2);
          if(!pv.length) return '';
          return '<div class="hrel"><div class="hrt"><b>성장 소식 기사</b>'
            + '<span class="hwin">'+GRWLIST.length+'건</span></div>'
            + pv.map(function(a){
                return '<button class="hrl hrg" data-a="'+GRWLIST.indexOf(a)+'">'
                  + '<span class="d">'+fd(a.date)+'</span>'
                  + '<span class="t">'+esc(a.title)+'</span></button>';
              }).join("")
            + '<button class="hmore" id="gmore">전체 보기 '+GRWLIST.length+'건 →</button>'
            + '</div>';
        })()
      + '<p class="hnote">'+GRWA.lbl+' 확인된 수상·실적·수출 소식입니다.'
      + ' 관련 기사는 같은 소식을 다룬 언론 보도 수입니다.</p>'
      + '</div>';
  }
  $("#hero").innerHTML = h;
  bindMlink($("#hero"));
  Array.prototype.forEach.call($("#hero").querySelectorAll(".hrl"), function(b){
    b.onclick = function(){
      var a = SOCLIST[+b.dataset.a];
      if(a && a.link) window.open(a.link, "_blank", "noopener");
    };
  });
  Array.prototype.forEach.call($("#hero").querySelectorAll(".hrg"), function(b){
    b.onclick = function(){
      var a = GRWLIST[+b.dataset.a];
      if(a && a.link) window.open(a.link, "_blank", "noopener");
    };
  });
  if($("#hmore")) $("#hmore").onclick = function(){ openArts(SOCLIST, "사회공헌 기사"); };
  if($("#gmore")) $("#gmore").onclick = function(){ openArts(GRWLIST, "성장 소식 기사"); };
}

function feed(){
  var html = '<button data-c="" aria-pressed="'+(cat==="")+'">전체<em>'+REST.length+'</em></button>';
  CATS.forEach(function(c){
    html += '<button data-c="'+esc(c[0])+'" aria-pressed="'+(cat===c[0])+'">'
      + esc(c[0])+'<em>'+c[1]+'</em></button>';
  });
  $("#catbar").innerHTML = html;
  Array.prototype.forEach.call($("#catbar").querySelectorAll("button"), function(b){
    b.onclick = function(){ cat = b.dataset.c; shownN = 12; feed(); };
  });

  var v = REST.filter(function(a){ return !cat || a.cat === cat; });
  $("#newsn").textContent = v.length + "건";
  var cut = v.slice(0, shownN);
  $("#feed").innerHTML = v.length
    ? cut.map(function(a){ return artCard(a, false); }).join("")
    : '<div class="empty">이 분류에는 기사가 없습니다.</div>';
  bindMlink($("#feed"));
  var rest = v.length - cut.length;
  $("#more").hidden = rest <= 0;
  if(rest > 0) $("#more").textContent = "기사 " + rest + "건 더 보기";
  $("#more").onclick = function(){ shownN += 18; feed(); };
}

/* 상단 시세 띠 : 협력사 실무와 직접 닿는 6종 */
/* ── 소수점 자리수 : 값이 실제로 가진 자리수를 그대로 쓴다 ──────────
   하나은행 고시는 달러가 1,337.90(=1자리 급), 유로가 1,556.98(=2자리) 로
   지표마다 자리수가 다르다. dec 를 하나로 못박으면 달러는 0을 덧붙이거나
   유로는 소수점을 잃는다. 그래서 값 자체의 자리수를 읽어 쓰고,
   최소 1자리(소수점이 있는 지표) · 최대 dec 로만 가둔다. (2026-09-10) */
function NDEC(v, cap, unit){
  if(v == null) return 0;
  if(!cap) return 0;                                  /* dec=0 : 구리 14,672 */
  /* 환율만 값의 자리수를 따른다. 유가·LME 는 원자료가 96.20 처럼 늘 2자리인데
     JSON 이 96.2 로 저장하므로 자리수를 읽으면 Dubai 122.01 / Naphtha 96.2 로
     같은 묶음 안에서 자리수가 어긋난다 → 이 둘은 dec 를 그대로 쓴다 */
  if(unit !== "KRW") return cap;
  var t = String(v), i = t.indexOf(".");
  var d = i < 0 ? 0 : t.length - i - 1;
  return Math.max(1, Math.min(d, cap));
}
var TICK = ["구리 (LME)", "알루미늄 (LME)", "아연 (LME)", "나프타", "미국 달러", "중국 위안"];
function tick(){
  if(!$("#tick")) return;                 /* 띠를 걷어낸 상태 — 마크업이 있으면 다시 동작한다 */
  var all = MARKET.mat.concat(MARKET.oil, MARKET.fx);
  var pick = TICK.map(function(nm){
    for(var i = 0; i < all.length; i++) if(all[i].nm === nm) return all[i];
    return null;
  }).filter(Boolean);
  var f = function(v, dec, unit){
    if(v == null) return "—";
    var d = NDEC(v, dec, unit);
    return v.toLocaleString("ko-KR", {minimumFractionDigits: d, maximumFractionDigits: d}); };
  var chip = function(lbl, v){
    if(v == null) return '';
    var up = v >= 0;
    return '<span class="c '+(up?'up':'dn')+'"><i>'+lbl+'</i>'+(up?"▲":"▼")
      + Math.abs(v).toFixed(2)+'%</span>';
  };
  $("#tick").innerHTML = pick.map(function(r){
    return '<div class="ti"><div class="n">'+esc(r.nm.replace(" (LME)",""))+'</div>'
      + '<div class="v">'+f(r.daily, r.dec, r.unit)+'</div>'
      + '<div class="r">'+chip("월", r.vsPrev)+chip("일", r.vsDay)+'</div></div>';
  }).join("");
  $("#tickfoot").textContent =
    "당일값 기준 · 월 = 전월대비(당월평균 vs 전월평균) · 일 = 전일대비. 전체 "
    + (MARKET.nItems || "") + "종과 12개월 추이는 [원자재 · 환율 시세] 탭에 있습니다.";
}

/* 12개월 추이 — 한 칸에 한 계열이라 범례가 필요 없다(제목이 계열명).
   숫자는 처음·끝·최고·최저만 직접 라벨한다. 점마다 숫자를 붙이면 읽을 수 없다. */
var CURSYM = function(unit){
  if(/^USD/.test(unit)) return "$";
  if(/^KRW/.test(unit)) return "\u20A9";
  if(/^CNY/.test(unit)) return "\u00A5";
  return "";
};
function trend(){
  /* 갱신 주기 안내 (요청 2026-09-11)
     읽는 사람이 "이 숫자가 언제 것인가" 를 묻기 전에 먼저 답해 둔다.
     기준일은 카드마다 이미 적혀 있으므로 여기서는 '주기' 만 말한다. */
  if($("#trfoot")) $("#trfoot").innerHTML =
    /* 모바일(346px)에서 '않습니다' 가 두 줄로 꺾였다 → 문구를 짧게 (실측) */
    '<b>업데이트</b> 평일 오전 10시 · 주말·공휴일 제외'
    + (MARKET.asof ? ' <span class="tfd">(현재 자료 ' + esc(MARKET.asof) + ' 기준)</span>' : '');
  if($("#trnote")) $("#trnote").textContent =
    "월평균 기준 · " + (MARKET.chartEnd || "") + " 까지";
  trendInto(MARKET.charts || [], $("#trend"));
}

/* 그래프를 그리는 몸통. 인라인 칸과 [전체보기] 창이 이 함수를 함께 쓴다
   → 두 곳의 양식이 어긋날 수 없다 (2026-09-10) */
function trendInto(cs, host){
  if(!host) return;
  if(!cs.length){ host.innerHTML = ""; return; }
  var W = 330, H = 176, L = 10, R = 10, T = 40, B = 34;
  /* 큰 숫자는 시세 카드와 같은 '당일값'을 쓴다. 그래프 선은 월평균이므로
     끝점의 월평균은 바로 아래에 작게 남겨 두 숫자가 왜 다른지 화면에서 바로 읽히게 한다 */
  var findIt = function(nm){
    var i;
    for(i = 0; i < MARKET.fx.length; i++) if(MARKET.fx[i].nm === nm) return [MARKET.fx[i], "고시"];
    for(i = 0; i < MARKET.mat.length; i++) if(MARKET.mat[i].nm === nm) return [MARKET.mat[i], "종가"];
    for(i = 0; i < MARKET.oil.length; i++) if(MARKET.oil[i].nm === nm) return [MARKET.oil[i], "종가"];
    return null;
  };
  host.innerHTML = cs.map(function(c){
    var s = c.series, n = s.length;
    var vs = s.map(function(p){ return p.v; });
    var mn = Math.min.apply(null, vs), mx = Math.max.apply(null, vs);
    var pad = (mx - mn) * 0.14 || 1;
    var lo = mn - pad, hi = mx + pad;
    var X = function(i){ return L + i * (W - L - R) / (n - 1); };
    var Y = function(v){ return T + (hi - v) / (hi - lo) * (H - T - B); };
    var d = s.map(function(p, i){ return (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.v).toFixed(1); }).join(" ");
    var ar = "M" + X(0).toFixed(1) + " " + (H - B) + " " + d.slice(1) + " L" + X(n-1).toFixed(1) + " " + (H - B) + " Z";
    var sym = CURSYM(c.unit);
    var f = function(v){ return v.toLocaleString("ko-KR",
      {minimumFractionDigits: c.dec, maximumFractionDigits: c.dec}); };
    var fc = function(v){ return sym + f(v); };
    /* 12개월(ym="2026-08") 과 5개년(ym="2026") 을 같은 함수로 그린다.
       연도 축은 "22년"·"26년" 처럼 읽히게 표기한다 (2026-09-10) */
    var YR = (c.span === "year");
    var ym = function(i){ var y = s[i].ym;
      return YR ? y.slice(2) + "년" : y.slice(2).replace("-", "."); };
    var AVG = YR ? " 연평균" : " 월평균";
    /* 당월평균 · 전월평균 표기 (연평균 화면에서는 올해·작년으로) — 요청 2026-09-16 */
    var CUR_LBL = YR ? "올해평균" : "당월평균";
    var PREV_LBL = YR ? "작년평균" : "전월평균";
    /* 진행 중인 해는 몇 월까지의 평균인지 밝힌다 (26년 = 1~8월) */
    var part = function(i){ var p = s[i];
      return (YR && p.n && p.n < 12) ? " (1~" + p.n + "월)" : ""; };
    /* 그래프 안 숫자는 최고·최저 두 개만. 최고는 점 위, 최저는 점 아래로 자리를 가른다 */
    var mark = function(v, i, up){
      var an = i < 2 ? "start" : (i > n - 3 ? "end" : "middle");
      var xx = X(i) + (an === "start" ? -3 : (an === "end" ? 3 : 0));
      /* 라벨을 키웠더니 오른쪽이 잘렸다(₩1,52…). 대략의 글자폭을 재서 안으로 당긴다.
         '최고'/'최저' 2글자 = 16px 급 · 숫자는 26px 급 */
      var tw = 2 * 17 + 8 + fc(v).length * 26 * 0.62;
      if(an === "middle") xx = Math.min(Math.max(xx, L + tw / 2), W - R - tw / 2);
      else if(an === "start") xx = Math.min(xx, W - R - tw);
      else xx = Math.max(xx, L + tw);
      return '<text class="tpk'+(up ? " up" : " dn")+'" x="'+xx.toFixed(1)
        + '" y="'+(Y(v) + (up ? -14 : 29)).toFixed(1)+'" text-anchor="'+an+'">'
        + '<tspan class="tpc">'+(up ? "최고" : "최저")+'</tspan> '+fc(v)+'</text>';
    };
    var peak = mark(mx, vs.indexOf(mx), true) + mark(mn, vs.lastIndexOf(mn), false);
    var hit = s.map(function(p, i){
      var w = (W - L - R) / (n - 1);
      var lbl = ym(i) + "  " + fc(p.v) + " " + c.unit + part(i);
      return '<g class="hp" role="img" aria-label="'+esc(lbl)+'" data-t="'+esc(lbl)+'">'
        + '<rect x="'+(X(i)-w/2).toFixed(1)+'" y="0" width="'+w.toFixed(1)
        + '" height="'+H+'" fill="transparent"></rect>'
        + '<line class="ch" x1="'+X(i).toFixed(1)+'" y1="'+T+'" x2="'+X(i).toFixed(1)+'" y2="'+(H-B)+'"></line>'
        + '<circle class="hd" cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="6"></circle>'
        + '</g>';
    }).join("");
    return '<figure class="tf">'
      + '<figcaption>'+esc(c.nm)+'<span>'+esc(c.unit)+' ·'+AVG+'</span></figcaption>'
      + (function(){
          var hit2 = findIt(c.nm);
          if(!hit2 || hit2[0].daily == null)
            return '<div class="tnow"><b>'+fc(s[n-1].v)+'</b><em>'+CUR_LBL+' · '+ym(n-1)+part(n-1)+'</em></div>'
              + (n >= 2 ? '<div class="tsub">'+PREV_LBL+' <b>'+fc(s[n-2].v)+'</b>'+part(n-2)+' ('+ym(n-2)+')</div>' : '');
          var r2 = hit2[0];
          /* 값이 가진 자리수를 그대로 쓴다 : 달러 1,337.90 → ₩1,337.9 ·
             유로 1,556.98 → ₩1,556.98 · 구리 14672 → $14,672 */
          var dd = NDEC(r2.daily, r2.dec, r2.unit);
          var dv = sym + r2.daily.toLocaleString("ko-KR",
            {minimumFractionDigits: dd, maximumFractionDigits: dd});
          /* 당월평균·전월평균 : 그래프 점(완결월)이 아니라 실제 이번 달(진행 중,
             영업일이 며칠 안 되도 그대로)·지난달 평균을 쓴다 — 요청 2026-09-16.
             연평균(5개년) 화면은 '달' 개념이 없어 기존처럼 그래프 점을 쓴다 */
          var curTxt, prevTxt;
          if(!YR && r2.month != null && r2.prev != null){
            var fR = function(v){ var d3 = NDEC(v, r2.dec, r2.unit);
              return sym + v.toLocaleString("ko-KR", {minimumFractionDigits: d3, maximumFractionDigits: d3}); };
            var ymShort = function(y){ return y.slice(2).replace("-", "."); };
            curTxt  = CUR_LBL +' <b>'+fR(r2.month)+'</b> ('+ymShort(r2.ym)+')';
            prevTxt = PREV_LBL+' <b>'+fR(r2.prev)+'</b> ('+ymShort(r2.prevYm)+')';
          } else {
            curTxt  = CUR_LBL +' <b>'+fc(s[n-1].v)+'</b>'+part(n-1)+' ('+ym(n-1)+')';
            prevTxt = (n >= 2) ? PREV_LBL+' <b>'+fc(s[n-2].v)+'</b>'+part(n-2)+' ('+ym(n-2)+')' : '';
          }
          return '<div class="tnow"><b>'+dv+'</b><em>'
            + r2.date.slice(5).replace("-", ".")+' '+hit2[1]+'</em></div>'
            + '<div class="tsub">'+curTxt+'</div>'
            + (prevTxt ? '<div class="tsub">'+prevTxt+'</div>' : '');
        })()
      + '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(c.nm)
      + ' 최근 '+n+(YR ? '개년' : '개월')+' 추이. '+ym(0)+' '+fc(s[0].v)+' → '+ym(n-1)+' '+fc(s[n-1].v)+'">'
      + '<path class="tar" d="'+ar+'"></path>'
      + '<line class="tb" x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'"></line>'
      + '<path class="tln" d="'+d+'"></path>'
      + '<circle class="te" cx="'+X(n-1).toFixed(1)+'" cy="'+Y(s[n-1].v).toFixed(1)+'" r="5"></circle>'
      + peak + hit
      + '<g class="tpick" hidden><rect class="tpb" rx="7"></rect>'
      +   '<text class="tpt"></text></g>'
      + '</svg>'
      + '<div class="tfoot"><span>'+ym(0)+'</span><span>'+ym(n-1)+'</span></div>'
      + '</figure>';
  }).join("");
}

/* ── 추이 그래프 : 터치로 값 읽기 ─────────────────────────────
   데스크탑은 CSS :hover 로 되지만 모바일은 hover 가 없어 값을 볼 수 없었다.
   손가락을 대거나 끌면 가장 가까운 달의 점을 잡아 말풍선으로 띄운다 */
function trendTouch(root){
  var figs = (root || document).querySelectorAll(".tf svg");
  Array.prototype.forEach.call(figs, function(sv){
    var hps = sv.querySelectorAll(".hp");
    if(!hps.length) return;
    var pick = sv.querySelector(".tpick");
    var box = pick && pick.querySelector(".tpb");
    var txt = pick && pick.querySelector(".tpt");
    var W = sv.viewBox.baseVal.width;
    function clear(){
      Array.prototype.forEach.call(hps, function(g){ g.classList.remove("on"); });
      if(pick) pick.setAttribute("hidden", "");
    }
    function at(cx){
      var r = sv.getBoundingClientRect();
      var vx = (cx - r.left) / r.width * W;              /* 화면좌표 → viewBox */
      var best = null, bd = 1e9;
      Array.prototype.forEach.call(hps, function(g){
        var d = g.querySelector(".hd");
        var x = +d.getAttribute("cx");
        var dist = Math.abs(x - vx);
        if(dist < bd){ bd = dist; best = g; }
      });
      if(!best) return;
      Array.prototype.forEach.call(hps, function(g){ g.classList.remove("on"); });
      best.classList.add("on");
      if(!pick) return;
      txt.textContent = (best.getAttribute("data-t") || "").replace(/\s+/g, " ").trim();
      var d = best.querySelector(".hd");
      var x = +d.getAttribute("cx"), y = +d.getAttribute("cy");
      pick.removeAttribute("hidden");
      var tw = txt.getComputedTextLength ? txt.getComputedTextLength() : 90;
      var bw = tw + 22, bh = 28;
      var bx = Math.min(Math.max(x - bw / 2, 2), W - bw - 2);
      var by = (y > 66) ? y - bh - 10 : y + 12;
      box.setAttribute("x", bx); box.setAttribute("y", by);
      box.setAttribute("width", bw); box.setAttribute("height", bh);
      txt.setAttribute("x", bx + bw / 2); txt.setAttribute("y", by + 19.5);
    }
    /* 마우스 : 갖다 대면 바로 뜨고 벗어나면 사라진다 (2026-09-10)
       전에는 마우스를 제외해 브라우저 기본 풍선만 보였다 — 느리고 꾸밈이 없었다.
       손가락 : 누르거나 끌 때만 뜨고, 떼면 잠깐 남겨 두고 지운다 (기존 그대로) */
    sv.addEventListener("pointerdown", function(e){
      if(e.pointerType === "mouse"){ at(e.clientX); return; }
      at(e.clientX);
      if(sv.setPointerCapture) try{ sv.setPointerCapture(e.pointerId); }catch(x){}
    });
    sv.addEventListener("pointermove", function(e){
      if(e.pointerType === "mouse"){ at(e.clientX); return; }
      if(e.buttons === 0 && e.pressure === 0) return;
      at(e.clientX);
    });
    sv.addEventListener("pointerleave", function(e){
      if(e.pointerType === "mouse") clear();
    });
    sv.addEventListener("pointerup", function(e){
      if(e.pointerType === "mouse") return;             /* 마우스는 벗어날 때 지운다 */
      setTimeout(clear, 2600);                          /* 잠깐 남겨 두고 지운다 */
    });
    sv.addEventListener("pointercancel", clear);
  });
}

/* 시세 탭 안 미니 그래프 · 월별(연도별) 상세표 — 요청 2026-09-16
   "상단 추이 그래프보다 이 탭이 오히려 정보가 적다" 는 지적을 받아,
   카드마다 작은 추이 그래프와 펼쳐보는 상세표를 붙인다.
   숫자 계산은 하나도 새로 안 한다 — MARKET.chartsAll/chartsYear 의 series 를
   그대로 읽어서 그리고 나열할 뿐이라, 상단 그래프·전체보기 창과 항상 같은 숫자다 */
var mktSpan = "m";

function mktChart(c){
  var s = c.series, n = s.length;
  if(!s || n < 2) return "";
  /* 가로 폭(W)은 상단 그래프(330)와 같게 둬서 글자 크기(.tpk/.tpc)가
     그대로 맞게 하고 — 요청 2026-09-16, 2차 — 세로(H)만 키워 높낮이가
     잘 보이게 한다 — 요청 2026-09-16, 5차 */
  var W = 320, H = 215, L = 10, R = 10, T = 38, B = 32;
  var vs = s.map(function(p){ return p.v; });
  var mn = Math.min.apply(null, vs), mx = Math.max.apply(null, vs);
  var pad = (mx - mn) * 0.14 || 1;
  var lo = mn - pad, hi = mx + pad;
  var X = function(i){ return L + i * (W - L - R) / (n - 1); };
  var Y = function(v){ return T + (hi - v) / (hi - lo) * (H - T - B); };
  var d = s.map(function(p, i){ return (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.v).toFixed(1); }).join(" ");
  var ar = "M" + X(0).toFixed(1) + " " + (H - B) + " " + d.slice(1) + " L" + X(n-1).toFixed(1) + " " + (H - B) + " Z";
  var sym = CURSYM(c.unit);
  var f = function(v){ return v.toLocaleString("ko-KR",
    {minimumFractionDigits: c.dec, maximumFractionDigits: c.dec}); };
  var fc = function(v){ return sym + f(v); };
  var YR = (c.span === "year");
  var DY = (c.span === "day");
  /* 일별(YYYY-MM-DD)은 앞 4자리(연도)까지 자르면 "26.09-15"처럼 하이픈이
     하나 남는다 — 뒤 5자리(MM-DD)만 잘라 "09.15"로 보여준다 (요청 2026-09-18) */
  var ym = function(i){ var y = s[i].ym;
    return YR ? y.slice(2) + "년" : DY ? y.slice(5).replace("-", ".") : y.slice(2).replace("-", "."); };
  var part = function(i){ var p = s[i];
    return (YR && p.n && p.n < 12) ? " (1~" + p.n + "월)" : ""; };
  var mark = function(v, i, up){
    var an = i < 2 ? "start" : (i > n - 3 ? "end" : "middle");
    var xx = X(i) + (an === "start" ? -3 : (an === "end" ? 3 : 0));
    var tw = 2 * 17 + 8 + fc(v).length * 26 * 0.62;
    if(an === "middle") xx = Math.min(Math.max(xx, L + tw / 2), W - R - tw / 2);
    else if(an === "start") xx = Math.min(xx, W - R - tw);
    else xx = Math.max(xx, L + tw);
    return '<text class="tpk'+(up ? " up" : " dn")+'" x="'+xx.toFixed(1)
      + '" y="'+(Y(v) + (up ? -14 : 29)).toFixed(1)+'" text-anchor="'+an+'">'
      + '<tspan class="tpc">'+(up ? "최고" : "최저")+'</tspan> '+fc(v)+'</text>';
  };
  var peak = mark(mx, vs.indexOf(mx), true) + mark(mn, vs.lastIndexOf(mn), false);
  /* 상단 그래프와 같은 방식(손가락·마우스로 짚으면 숫자가 뜨는)으로 —
     요청 2026-09-16. trendTouch() 가 이미 하는 일이라 새로 만들지 않고
     그 함수가 찾는 .hp/.tpick 구조만 그대로 맞춰 준다 */
  var hit = s.map(function(p, i){
    var w = (W - L - R) / (n - 1);
    var lbl = ym(i) + "  " + fc(p.v) + " " + c.unit + part(i);
    return '<g class="hp" role="img" aria-label="'+esc(lbl)+'" data-t="'+esc(lbl)+'">'
      + '<rect x="'+(X(i)-w/2).toFixed(1)+'" y="0" width="'+w.toFixed(1)
      + '" height="'+H+'" fill="transparent"></rect>'
      + '<line class="ch" x1="'+X(i).toFixed(1)+'" y1="'+T+'" x2="'+X(i).toFixed(1)+'" y2="'+(H-B)+'"></line>'
      + '<circle class="hd" cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="6"></circle>'
      + '</g>';
  }).join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(c.nm)
    + ' 최근 '+n+(YR ? '개년' : DY ? '일' : '개월')+' 추이. '+ym(0)+' '+fc(s[0].v)+' → '+ym(n-1)+' '+fc(s[n-1].v)+'">'
    + '<path class="tar" d="'+ar+'"></path>'
    + '<line class="tb" x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'"></line>'
    + '<path class="tln" d="'+d+'"></path>'
    + '<circle class="te" cx="'+X(n-1).toFixed(1)+'" cy="'+Y(s[n-1].v).toFixed(1)+'" r="5"></circle>'
    + peak + hit
    + '<g class="tpick" hidden><rect class="tpb" rx="7"></rect><text class="tpt"></text></g>'
    + '</svg>'
    + '<div class="tfoot"><span>'+ym(0)+'</span><span>'+ym(n-1)+'</span></div>';
}

/* '전체'(2022~) 모드 전용 상세 그래프 — 미니 그래프의 확대판이 아니라
   구분되는 컴포넌트로 만든다: 카드가 한 줄 전체 폭을 쓰고(그만큼 높이도
   커진다), 선을 굵게 하고, 1월마다 연도 경계선·라벨을 그어 56개월치를
   한눈에 나눠 읽을 수 있게 한다 — 요청 2026-09-16, 5차 */
function mktChartDetail(c){
  var s = c.series, n = s.length;
  if(!s || n < 2) return "";
  /* 모바일은 카드가 좁아서(12개월/5개년과 같은 폭) 데스크톱용 900 폭 그대로
     쓰면 같은 .tpk 글자가 훨씬 작게 그려진다(뷰박스 단위당 실제 픽셀이 줄어듦).
     가로 폭을 미니 그래프(320)와 맞춰 글자 크기를 그대로 맞추고, 세로만 키워
     '상세' 느낌은 유지한다 — 요청 2026-09-16, 7차 */
  var MOBILE = (typeof window !== "undefined" && window.innerWidth <= 699);
  var W = MOBILE ? 320 : 1200, H = MOBILE ? 240 : 340,   /* 모바일 420→240 : 너무 길다 (2026-09-23) */   /* 데스크톱 900→1200 : 같은 폭에서 0.75배 (2026-09-23) */
      L = MOBILE ? 10  : 36,  R = MOBILE ? 10  : 36,
      T = MOBILE ? 42  : 46,  B = MOBILE ? 38  : 40;
  var vs = s.map(function(p){ return p.v; });
  var mn = Math.min.apply(null, vs), mx = Math.max.apply(null, vs);
  var pad = (mx - mn) * 0.14 || 1;
  /* 모바일은 그래프 높이를 줄여서(2026-09-23) 아래 '최저' 표시가 연도 눈금과 겹친다
     → 아래쪽 여유만 넓혀 최저 표시가 눈금 위에 앉게 한다 */
  var lo = mn - pad * (MOBILE ? 2.8 : 1), hi = mx + pad;
  var X = function(i){ return L + i * (W - L - R) / (n - 1); };
  var Y = function(v){ return T + (hi - v) / (hi - lo) * (H - T - B); };
  var d = s.map(function(p, i){ return (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.v).toFixed(1); }).join(" ");
  var ar = "M" + X(0).toFixed(1) + " " + (H - B) + " " + d.slice(1) + " L" + X(n-1).toFixed(1) + " " + (H - B) + " Z";
  var sym = CURSYM(c.unit);
  var f = function(v){ return v.toLocaleString("ko-KR",
    {minimumFractionDigits: c.dec, maximumFractionDigits: c.dec}); };
  var fc = function(v){ return sym + f(v); };
  var ym = function(i){ return s[i].ym.slice(2).replace("-", "."); };
  var mark = function(v, i, up){
    var an = i < 3 ? "start" : (i > n - 4 ? "end" : "middle");
    var xx = X(i) + (an === "start" ? -3 : (an === "end" ? 3 : 0));
    var tw = 2 * 17 + 8 + fc(v).length * 26 * 0.62;
    if(an === "middle") xx = Math.min(Math.max(xx, L + tw / 2), W - R - tw / 2);
    else if(an === "start") xx = Math.min(xx, W - R - tw);
    else xx = Math.max(xx, L + tw);
    return '<text class="tpk'+(up ? " up" : " dn")+'" x="'+xx.toFixed(1)
      + '" y="'+(Y(v) + (up ? -14 : 29)).toFixed(1)+'" text-anchor="'+an+'">'
      + '<tspan class="tpc">'+(up ? "최고" : "최저")+'</tspan> '+fc(v)+'</text>';
  };
  var peak = mark(mx, vs.indexOf(mx), true) + mark(mn, vs.lastIndexOf(mn), false);
  /* 연도 경계(매년 1월)마다 세로 눈금선 + 연도 라벨 */
  var grid = s.map(function(p, i){
    if(p.ym.slice(5) !== "01") return "";
    return '<line class="mgy" x1="'+X(i).toFixed(1)+'" y1="'+T+'" x2="'+X(i).toFixed(1)+'" y2="'+(H-B)+'"></line>'
      + '<text class="mgyl" x="'+X(i).toFixed(1)+'" y="'+(H-B+18)+'" text-anchor="'
      + (X(i) - L < 24 ? 'start' : (W - R - X(i) < 24 ? 'end' : 'middle'))+'">'+p.ym.slice(0,4)+'</text>';
  }).join("");
  var hit = s.map(function(p, i){
    var w = (W - L - R) / (n - 1);
    var lbl = ym(i) + "  " + fc(p.v) + " " + c.unit;
    return '<g class="hp" role="img" aria-label="'+esc(lbl)+'" data-t="'+esc(lbl)+'">'
      + '<rect x="'+(X(i)-w/2).toFixed(1)+'" y="0" width="'+w.toFixed(1)
      + '" height="'+H+'" fill="transparent"></rect>'
      + '<line class="ch" x1="'+X(i).toFixed(1)+'" y1="'+T+'" x2="'+X(i).toFixed(1)+'" y2="'+(H-B)+'"></line>'
      + '<circle class="hd" cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="6"></circle>'
      + '</g>';
  }).join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(c.nm)
    + ' 전체 기간('+ym(0)+' ~ '+ym(n-1)+') 월별 추이">'
    + grid
    + '<path class="tar" d="'+ar+'"></path>'
    + '<line class="tb" x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'"></line>'
    + '<path class="tln" d="'+d+'"></path>'
    + '<circle class="te" cx="'+X(n-1).toFixed(1)+'" cy="'+Y(s[n-1].v).toFixed(1)+'" r="5"></circle>'
    + peak + hit
    + '<g class="tpick" hidden><rect class="tpb" rx="7"></rect><text class="tpt"></text></g>'
    + '</svg>'
    + '<div class="tfoot"><span>'+ym(0)+' ~ '+ym(n-1)+'</span><span>'+n+'개월 전체</span></div>';
}

function mktTable(c, full){
  var s = c.series, n = s.length;
  var YR = (c.span === "year");
  var DY = (c.span === "day");
  var sym = CURSYM(c.unit);
  var f = function(v){ return v.toLocaleString("ko-KR",
    {minimumFractionDigits: c.dec, maximumFractionDigits: c.dec}); };
  /* '26년 (1~8월)'을 한 줄로 쓰면 칸이 넓어져 표 전체에 가로 스크롤이
     생겼다. 진행 중 연도만 두 번째 줄에 작게 적는다 — 요청 2026-09-18 */
  var ymFull = function(i){ var p = s[i];
    if(DY) return esc(p.ym.slice(5).replace("-", "."));
    if(!YR) return esc(p.ym.slice(2).replace("-", "."));
    var yy = esc(p.ym.slice(2) + "년");
    return (p.n && p.n < 12) ? yy + '<br><span class="mosub">(1~'+p.n+'월)</span>' : yy; };
  var vs = s.map(function(p){ return p.v; });
  var mn = Math.min.apply(null, vs), mx = Math.max.apply(null, vs);
  var rows = [];
  for(var i = n - 1; i >= 0; i--){
    var chg = (i > 0) ? (s[i].v - s[i-1].v) : null;
    var pct2 = (i > 0 && s[i-1].v) ? (chg / s[i-1].v * 100) : null;
    /* 변동액+퍼센트 표기는 칸이 넓은 전체이력(full)에서만 — 12개월·5개년
       (일반) 표에서는 실측 결과 표 너비를 넘겨 가로 스크롤이 생겼다
       (요청 2026-09-18, 3차) */
    var chip = (pct2 == null) ? '<span class="mtd na">—</span>'
      : full
      ? '<span class="mtd '+(pct2 >= 0 ? "up" : "dn")+'">'+(pct2 >= 0 ? "▲" : "▼")
        + sym + f(Math.abs(chg))
        + ' <span class="mtdp">('+(pct2 >= 0 ? "+" : "-")+Math.abs(pct2).toFixed(1)+'%)</span></span>'
      : '<span class="mtd '+(pct2 >= 0 ? "up" : "dn")+'">'+(pct2 >= 0 ? "▲" : "▼")
        + Math.abs(pct2).toFixed(1)+'%</span>';
    var valCell;
    if(full){
      var pct = (mx > mn) ? (s[i].v - mn) / (mx - mn) : 1;
      valCell = '<td class="mval"><span class="bar" style="width:'+(Math.max(pct*100,6)).toFixed(1)+'%"></span>'
        + '<b class="mv">'+sym+f(s[i].v)+'</b></td>';
    } else {
      valCell = '<td>'+sym+f(s[i].v)+'</td>';
    }
    rows.push('<tr><th>'+ymFull(i)+'</th>'+valCell+'<td>'+chip+'</td></tr>');
  }
  return '<table class="mtbl'+(full?' mtbl-bar':'')+'"><thead><tr><th>'+(YR ? "연도" : DY ? "일" : "월")
    + '</th><th>'+(DY ? "값" : "평균")+'</th><th>전'+(YR ? "년" : DY ? "일" : "월")+'대비</th></tr></thead><tbody>'
    + rows.join("") + '</tbody></table>';
}

function market(){
  var f = function(v, dec, unit){
    if(v == null) return "—";
    var d = NDEC(v, dec, unit);
    return v.toLocaleString("ko-KR", {minimumFractionDigits: d, maximumFractionDigits: d}); };
  /* 사내 데일리 리포트 카드 형식 : 당월평균·전월평균 / 전월대비·전일대비.
     변동액은 여기(상단 카드)에는 안 붙인다 — 월별/연도별 상세표로 옮겼다
     (요청 2026-09-18, 2차) */
  var pct = function(v){
    if(v == null) return '<b class="chg na">—</b>';
    var up = v >= 0;
    return '<b class="chg '+(up?'up':'dn')+'">'+(up?"▲":"▼")
      + Math.abs(v).toFixed(2)+'%</b>';
  };
  /* '전체'(f) — 2022년 1월부터의 월별 전체 이력. 미니 그래프(12개월/5개년)와는
     다른 상세 그래프(mktChartDetail)로 그려 구분한다 — 요청 2026-09-16, 5차 */
  var detail = (mktSpan === "f");
  var chSrc = (mktSpan === "y") ? (MARKET.chartsYear || [])
    : (mktSpan === "d") ? (MARKET.chartsDaily || [])
    : detail ? (MARKET.chartsFull || [])
    : (MARKET.chartsAll || MARKET.charts || []);
  var chMap = {};
  chSrc.forEach(function(c){ chMap[c.nm] = c; });
  var card = function(r, dlbl){
    var tip = r.nm + ' · ' + r.date.slice(5).replace("-", ".") + ' ' + dlbl
      + ' · 당월 ' + r.days + '영업일'
      + (r.pdate ? ' · 전일 ' + r.pdate.slice(5).replace("-", ".") : '');
    /* Dubai · Brent · WTI · Naphtha 처럼 로마자만 있는 이름은 x-높이가 낮아
       같은 22px 인데도 한글(구리·아연)보다 작게 보인다 → 클래스로 보정한다 */
    var en = /^[\x20-\x7E]+$/.test(r.nm) ? " en" : "";
    var c = chMap[r.nm];
    return '<div class="mcard'+(detail?" full":"")+'" title="'+esc(tip)+'"><div class="t"><span class="n'+en+'">'+esc(r.nm)+'</span>'
      + '<span class="u">'+esc(r.unit)+'</span></div>'
      + '<div class="v">'+f(r.daily, r.dec, r.unit)
      +   '<em class="vl">'+r.date.slice(5).replace("-", ".")+' '+dlbl+'</em></div>'
      + '<div class="mg">'
      +   '<div class="ml"><span>당월평균</span><b>'+f(r.month, r.dec, r.unit)+'</b></div>'
      +   '<div class="mr"><span>전월대비</span>'+pct(r.vsPrev)+'</div>'
      +   '<div class="ml"><span>전월평균</span><b>'+f(r.prev, r.dec, r.unit)+'</b></div>'
      +   '<div class="mr"><span>전일대비</span>'+pct(r.vsDay)+'</div>'
      + '</div>'
      + (c ? (detail
          ? '<div class="mchart mchart-detail tf">'+mktChartDetail(c)+'</div>'
          : '<div class="mchart tf">'+mktChart(c)+'</div>')
        + '<button class="mtog mtblt" type="button" aria-expanded="false">'
        +   '<span class="cv" aria-hidden="true">›</span>'+(c.span === "year" ? "연도별" : c.span === "day" ? "일별" : "월별")+' 상세 보기</button>'
        + '<div class="mtbl-wrap" hidden>'+mktTable(c, detail)+'</div>' : '')
      + '</div>'; };
  /* 카드 밑에 있던 '09.07 종가 · 당월 5영업일 · 전일 09.04' 줄은 걷어냈다.
     앞부분은 큰 숫자 옆에 이미 있고(중복), 영업일 수와 전일 기준일은
     카드 툴팁과 아래 안내 문구가 맡는다. 그 자리를 글씨 크기로 돌린다 */
  var sec = function(lbl, arr, dlbl){
    return '<div class="mgroup">'+lbl+'</div><div class="mgrid'+(detail?" full":"")+'">'
      + arr.map(function(r){ return card(r, dlbl); }).join("") + '</div>'; };
  /* 기준일은 각주로 밀어 넣으면 아무도 안 읽는다 → 제목 줄 오른쪽 끝에 알약으로 */
  /* 기준일이 오늘보다 오래면 그대로 알린다 — '오늘 값' 으로 오해하는 것을 막는다
     (2026-09-10 : 사이트가 09-09 값을 보여주는데 09-10 값과 비교해 오류로 보였다) */
  if($("#mktasof")){
    var el = $("#mktasof");
    el.textContent = MARKET.asof + " 기준";
    el.classList.remove("old");
    var lag = bizLag(MARKET.asof);
    if(lag >= 1){
      el.textContent = MARKET.asof + " 기준 · " + lag + "영업일 전";
      el.classList.add("old");
      el.title = "오늘 값이 아닙니다. 최신 스냅샷이 아직 반영되지 않았습니다.";
    }
  }
  Array.prototype.forEach.call((($("#mspan")||{}).querySelectorAll) ? $("#mspan").querySelectorAll("button") : [],
    function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-s") === mktSpan ? "true" : "false"); });
  $("#market").innerHTML =
      sec("원자재", MARKET.mat, "종가")
    + sec("유가 · 나프타", MARKET.oil, "종가")
    + sec("환율", MARKET.fx, "최초고시")
    + '<p class="dsum" style="margin:14px 0 0;font-size:12px;color:var(--mute)">'
    + '출처 : KOMIS(LME) · 하나은행 최초고시 매매기준율 · 오피넷. '
    + '<b>전월대비</b>는 당월평균 vs 전월평균, <b>전일대비</b>는 당일값 vs 직전 거래일입니다. '
    + '상승 빨강 / 하락 파랑. '
    + '당일값은 항목별 최신 고시일 기준이라 날짜가 다를 수 있고, 전일대비의 기준일도 항목마다 다릅니다(카드에 마우스를 올리면 표시). '
    + '그래프·상세표의 월평균은 완결된 '+(MARKET.chartEnd||"")+' 까지, 연평균은 '+(MARKET.yearEnd||"")+'까지입니다.</p>';
  trendTouch($("#market"));
}

/* 시세 탭 : 그래프 기간(12개월/5개년) 전환 · 카드별 상세표 접기 */
(function(){
  var sg = $("#mspan");
  if(sg) sg.addEventListener("click", function(e){
    var b = e.target.closest("button[data-s]");
    if(!b) return;
    mktSpan = b.getAttribute("data-s");
    market();
  });
  var host = $("#market");
  if(host) host.addEventListener("click", function(e){
    var b = e.target.closest(".mtblt");
    if(!b) return;
    var wrap = b.nextElementSibling;
    var open = b.getAttribute("aria-expanded") === "true";
    b.setAttribute("aria-expanded", open ? "false" : "true");
    b.classList.toggle("on", !open);
    b.querySelector(".cv").textContent = open ? "›" : "⌄";
    if(wrap) wrap.hidden = open;
  });
})();

/* ── 추이 접기 ──────────────────────────────── */
(function(){
  /* [전체보기] : 12개 지표를 겹침창에 같은 양식으로 그린다.
     진짜 새 창(window.open)은 팝업 차단에 막히고 파일을 복제해야 해서
     지도 [전체화면] 과 같은 겹침창을 쓴다 (2026-09-10) */
  var tm = $("#tmodal"), ta = $("#tall");
  /* 기간 : "m" = 12개월(월평균) · "y" = 5개년(연평균). 제목·부제도 함께 바뀐다 */
  var span = "m";
  function taDraw(){
    var yr = (span === "y");
    var cs = (yr ? MARKET.chartsYear : (MARKET.chartsAll || MARKET.charts)) || [];
    if(!cs.length){ span = "m"; yr = false; cs = MARKET.chartsAll || MARKET.charts || []; }
    var ti = $("#tatitle");
    if(ti) ti.innerHTML = '원자재 · 환율 변동 <i>(' + (yr ? '5개년' : '12개월') + ')</i>';
    if($("#tanote")) $("#tanote").textContent = yr
      ? cs.length + "개 지표 · 연평균 기준 · " + cs[0].series[0].ym + "년 ~ "
        + (MARKET.yearEnd || "").replace(/(\d+)년 (1~\d+월)/, "$1년 ($2)")
          + "   (업데이트 평일 오전 10시)"
      : cs.length + "개 지표 · 월평균 기준 · " + (MARKET.chartEnd || "") + " 까지"
          + "   (업데이트 평일 오전 10시)";
    var sg = $("#tspan");
    if(sg) Array.prototype.forEach.call(sg.querySelectorAll("button"), function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-s") === span ? "true" : "false"); });
    trendInto(cs, $("#trendall"));
    trendTouch($("#trendall"));
  }
  (function(){
    var sg = $("#tspan");
    if(!sg) return;

/* ── 지도 크게 보기 ─────────────────────────── */
(function(){
  var md = $("#modal"), open = false, back = null;
  /* 패널을 복제하지 않고 실제 DOM 을 옮겨 온다.
     복제본은 표식 클릭이 죽고(핸들러가 안 따라온다) 갱신도 안 된다.
     render() 는 id 로 그리므로 노드가 어디에 있든 그대로 동작한다.
     닫을 때는 자리표(빈 span)를 기준으로 원래 위치에 되돌린다. */
  function moveIn(el, host){
    var slot = document.createElement("span");
    slot.hidden = true;
    el.parentNode.insertBefore(slot, el);
    host.appendChild(el);
    return { el: el, slot: slot };
  }
  function show(){
    if(open) return;
    var mapPanel = $("#map") && $("#map").closest(".panel");
    var recPanel = $("#elist") && $("#elist").closest(".panel");
    if(!mapPanel) return;
    back = [ moveIn(mapPanel, $("#mleft")) ];
    if($("#detail")) back.push(moveIn($("#detail"), $("#mright")));
    if(recPanel) back.push(moveIn(recPanel, $("#mright")));
    /* #ynote 는 지도 패널에서 걷어냈으므로 상단 소제목 옆 문구를 쓴다 */
    $("#mnote").textContent = ($("#sheadn") && $("#sheadn").textContent) || "";
    md.hidden = false; open = true;
    document.body.style.overflow = "hidden";
    document.body.classList.add("mopen");
    render();                                   /* 틀(VSH)과 카드 자리를 다시 잡는다 */
    $("#mclose").focus();
  }
  function hide(){
    if(!open) return;
    (back || []).forEach(function(b){
      b.slot.parentNode.insertBefore(b.el, b.slot);
      b.slot.parentNode.removeChild(b.slot);
    });
    back = null;
    md.hidden = true; open = false; document.body.style.overflow = "";
    document.body.classList.remove("mopen");
    render();
    $("#zoomb").focus();
  }
  $("#zoomb").onclick = show;
  $("#mclose").onclick = hide;
  md.onclick = function(e){ if(e.target === md) hide(); };

/* 인트로는 4.6초 뒤 스스로 걷히고, 그 전에 누르거나 스크롤하면 바로 걷힌다
   (모바일에서는 주소창이 자동으로 접히면서 로드 직후 가짜 scroll 이벤트가 발생해

/* ── 뉴스레터 아카이브 ───────────────────────── */
var SOCIAL = "사회공헌", icur = 0, q = "";

function ihit(it){
  if(!q) return true;
  return (it.title+" "+it.summary+" "+it.press+" "+it.outlets+" "+it.cat)
    .toLowerCase().indexOf(q) >= 0;
}
function imark(t){
  if(!q) return esc(t);
  var i = t.toLowerCase().indexOf(q);
  if(i < 0) return esc(t);
  return esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length));
}
/* 2026-35 만으로는 언제인지 감이 안 온다. 그 주 월요일이 그 달의 몇 번째 월요일인지로 적는다 */
function wkLabel(d){
  /* 주가 달을 걸칠 때 첫날로 세면 깨진다 (08-31 시작 → '8월 5주차').
     그 주의 목요일을 기준으로 삼는다 = 7일 중 다수가 속한 달 (ISO 관례) */
  var t = new Date(d + "T12:00:00Z");
  t.setUTCDate(t.getUTCDate() + 3);
  var day = t.getUTCDate();
  return (t.getUTCMonth() + 1) + "월 " + (Math.floor((day - 1) / 7) + 1) + "주차";
}
function irail(){
  /* "29호" 는 제29호로 읽힌다. 실제로는 '수록된 호의 개수' 이고
     최신 호는 Vol. 2026-36 이다(기사가 확인되지 않은 주는 호가 없어 번호에 빈칸이 있다) */
  var an = document.getElementById("arcN");
  an.textContent = ISSUES.length + "개 호";
  an.title = "2026년 " + ISSUES.length + "개 호 수록 · 최신 Vol. " + ISSUES[0].vol
    + " (기사가 확인되지 않은 주는 호가 없습니다)";
  document.getElementById("ilist").innerHTML = ISSUES.map(function(i,n){
    var c = i.items.filter(ihit).length;
    return '<div class="ili" role="button" tabindex="0" aria-current="'+(n===icur)+'" data-n="'+n+'">'
      + '<span class="iv">Vol. '+i.vol+'<em>'+wkLabel(i.start)+'</em></span>'
      + (i.pdf
          ? '<a class="ilipdf" href="'+esc(i.pdf)+'" download="'+esc(i.pdf.split("/").pop())
              +'" rel="noopener" aria-label="Vol. '+i.vol+' 발송본 PDF 내려받기">'
              + '<span class="pi" aria-hidden="true">↓</span>PDF 내려받기</a>'
          : '<span class="im num">'+fd(i.start)+' · '
              + (q ? c+"/"+i.items.length : i.items.length+"건")+'</span>')
      + '</div>';
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll(".ili"), function(b){
    var go = function(){ icur = +b.dataset.n; irail(); ipane(); };
    b.onclick = function(e){ if(e.target.closest(".ilipdf")) return; go(); };
    b.onkeydown = function(e){
      if(e.target.closest(".ilipdf")) return;
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); go(); }
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll(".ilipdf"), function(a){
    a.onclick = function(e){
      e.preventDefault(); e.stopPropagation();
      var url = a.getAttribute("href"), nm = a.getAttribute("download");
      var save = function(){
        var t = document.createElement("a"); t.href = url; t.download = nm;
        document.body.appendChild(t); t.click(); t.remove();
      };
      if(location.protocol === "file:"){ window.open(url, "_blank"); return; }
      fetch(url, {method: "HEAD"}).then(function(r){ if(r.ok){ save(); } else { window.open(url, "_blank"); } })
        ["catch"](function(){ save(); });
    };
  });
}
function icard(it){
  return '<div class="acard'+(it.official || it.cov >= 4 ? ' hi' : '')+'">'
   + '<div class="imeta"><span class="num">'+fd(it.date)+'</span>'
   + '<span class="chip">'+esc(it.cat)+'</span>'
   + (it.official ? '<span class="chip off">공식 보도자료</span>' : '')
   + '<span class="num">보도 '+it.cov+'건</span>'
   + (it.outlets ? '<span>'+esc(it.outlets)+'</span>' : '') + '</div>'
