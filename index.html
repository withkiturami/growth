<style>
:root{
 --bg:#E5EDFA; --card:#FFFFFF; --card2:#F3F7FE;
 --ink:#0E1826; --body:#313C4E; --mute:#5C6880;
 --line:#C6D3E6; --line2:#E1E9F6;
 --acc:#123C7A; --acc-w:#E1ECFC; --acc-2:#2E6BB8;
 --map:#CBD8EC; --map-line:#FFFFFF; --map-on:#B7C8E4;
 --hl:#EAF2FE; --hl-ln:#C6DBF8; --tile-ln:#E1E9F5;
 --mkt:#3A4E9E; --mkt-bg:#F3F5FE; --mkt-ln:#D7DDF6;
 --news:#1F5E6B; --news-bg:#F1F8F7; --news-ln:#CFE4E7;
 --teal:#1F5E6B; --teal-w:#E6F0F2;
 --gold:#8A6A22; --gold-w:#FBF4E4;
 --don:#B8451F; --don-w:#FBEDE4; --bar-fill:rgba(47,86,199,.42);
 --up:#C0392B; --down:#1C6EA4;
 --shadow:0 1px 2px rgba(18,60,122,.10),0 8px 24px rgba(18,60,122,.11);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#080C15; --card:#171F2D; --card2:#1D2635;
 --ink:#EBF0F8; --body:#B7C2D2; --mute:#848FA3;
 --line:#2F3A4C; --line2:#252F3F;
 --acc:#77ACEE; --acc-w:#12233C; --acc-2:#9AC4F6;
 --map:#20293A; --map-line:#080C15; --map-on:#2F3B52;
 --hl:#16233A; --hl-ln:#2B4468; --tile-ln:#2F3A4C;
 --mkt:#9AA9F2; --mkt-bg:#151A2C; --mkt-ln:#2A3052;
 --news:#67C2D1; --news-bg:#11262A; --news-ln:#22434A;
 --teal:#67C2D1; --teal-w:#122B30;
 --gold:#D4B063; --gold-w:#2B2413;
 --don:#F0985A; --don-w:#2E2013; --bar-fill:rgba(120,145,255,.5);
 --up:#E4675A; --down:#5FA8D8;
 --shadow:0 1px 2px rgba(0,0,0,.55),0 10px 28px rgba(4,12,28,.42);
}}
:root[data-theme="dark"]{
 --bg:#080C15; --card:#171F2D; --card2:#1D2635;
 --ink:#EBF0F8; --body:#B7C2D2; --mute:#848FA3;
 --line:#2F3A4C; --line2:#252F3F;
 --acc:#77ACEE; --acc-w:#12233C; --acc-2:#9AC4F6;
 --map:#20293A; --map-line:#080C15; --map-on:#2F3B52;
 --hl:#16233A; --hl-ln:#2B4468; --tile-ln:#2F3A4C;
 --mkt:#9AA9F2; --mkt-bg:#151A2C; --mkt-ln:#2A3052;
 --news:#67C2D1; --news-bg:#11262A; --news-ln:#22434A;
 --teal:#67C2D1; --teal-w:#122B30;
 --gold:#D4B063; --gold-w:#2B2413;
 --don:#F0985A; --don-w:#2E2013; --bar-fill:rgba(120,145,255,.5);
 --up:#E4675A; --down:#5FA8D8;
 --shadow:0 1px 2px rgba(0,0,0,.55),0 10px 28px rgba(4,12,28,.42);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--body);
 font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
 font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Gothic A1","IBM Plex Sans KR",sans-serif;color:var(--ink);
 text-wrap:balance;margin:0}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding:26px 22px 60px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;
 padding-bottom:16px;border-bottom:2px solid var(--ink)}
.brand{display:flex;gap:12px;align-items:center}
.bar{width:5px;height:46px;background:var(--acc);border-radius:2px}
h1{font-size:27px;font-weight:800;letter-spacing:-.02em}
.sub{font-size:12.5px;color:var(--mute);margin-top:3px}
.spacer{flex:1}
.tbtn{background:var(--card);border:1px solid var(--line);color:var(--body);
 border-radius:999px;padding:7px 14px;font:inherit;font-size:12.5px;cursor:pointer}
.tbtn:hover{border-color:var(--acc);color:var(--acc)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:16px 0 8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;
 padding:12px 15px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:"Gothic A1",sans-serif;font-weight:800;font-size:22px;
 color:var(--ink);letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--mute)}
.stat.hl{background:var(--acc-w);border-color:transparent}
.stat.hl b{color:var(--acc)}
.stat.tl{background:var(--teal-w);border-color:transparent}
.stat.tl b{color:var(--teal)}
.legacy{font-size:11.5px;color:var(--mute);margin:0 0 16px;padding-left:2px}
/* 상단 시세 띠 — 모든 탭에서 항상 보인다 */
.tick{display:flex;gap:0;overflow-x:auto;background:var(--card);border:1px solid var(--line);
 border-radius:11px;box-shadow:var(--shadow);padding:2px}
.tick::-webkit-scrollbar{height:6px}
.tick::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.ti{flex:1 0 auto;min-width:132px;padding:9px 14px;border-right:1px solid var(--line2)}
.ti:last-child{border-right:0}
.ti .n{font-size:11.5px;color:var(--mute);white-space:nowrap}
.ti .r{display:flex;align-items:baseline;gap:7px;margin-top:1px}
.ti .v{font-family:"Gothic A1",sans-serif;font-weight:800;font-size:17px;color:var(--ink);
 letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.ti .c{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ti .c.up{color:var(--up)} .ti .c.dn{color:var(--down)}
.tickfoot{font-size:11px;color:var(--mute);margin:7px 0 0;padding-left:2px}

/* 컨트롤 */
.bars{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);
 border-radius:9px;padding:3px;gap:2px}
.seg button{background:none;border:0;border-radius:7px;padding:6px 13px;font:inherit;
 font-size:13px;color:var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--acc);color:#fff;font-weight:600}
.seg button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.seg.mon button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.mlbl{font-size:11.5px;color:var(--mute);letter-spacing:.04em}
.seg[hidden]{display:none}
/* 상단 탭 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 20px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;
 padding:9px 16px;font:inherit;font-size:14px;font-weight:600;color:var(--mute);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--acc);border-bottom-color:var(--acc)}
.tabs button:focus-visible{outline:2px solid var(--acc);outline-offset:-2px;border-radius:6px}
.tabs .cnt{font-weight:400;font-size:12px;color:var(--mute);margin-left:5px}
[role="tabpanel"][hidden]{display:none}
/* 아카이브 */
.arch{display:grid;grid-template-columns:280px minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:900px){.arch{grid-template-columns:1fr}}
.arail{position:sticky;top:16px;display:flex;flex-direction:column;gap:12px}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:9px;
 padding:10px 13px;font:inherit;font-size:14px;color:var(--ink)}
.search:focus{outline:2px solid var(--acc);outline-offset:1px}
.ilist{background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden;
 box-shadow:var(--shadow)}
.ili{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;
 border:0;border-bottom:1px solid var(--line2);padding:11px 14px;font:inherit;cursor:pointer;color:var(--body)}
.ili:last-child{border-bottom:0}
.ili:hover{background:var(--card2)}
.ili[aria-current="true"]{background:var(--acc-w);box-shadow:inset 3px 0 0 var(--acc)}
.ili[aria-current="true"] .iv{color:var(--acc)}
.iv{font-family:"Gothic A1",sans-serif;font-weight:800;font-size:13.5px;color:var(--ink);white-space:nowrap}
.im{font-size:11.5px;color:var(--mute);flex:1}
.ilipdf{display:inline-flex;align-items:center;gap:6px;justify-content:center;margin-left:auto;flex-shrink:0;background:var(--ci-or);color:#fff;text-decoration:none;border-radius:8px;padding:8px 16px;font-size:13.5px;font-weight:800;letter-spacing:-.01em;box-shadow:0 2px 8px rgba(232,119,34,.25)}
.ilipdf:hover{background:#C2560E;color:#fff}
.ilipdf:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ilipdf .pi{font-size:14px;line-height:1}
.isect{font-family:"Gothic A1",sans-serif;font-weight:800;font-size:12px;letter-spacing:.08em;
 color:var(--acc);display:flex;align-items:center;gap:9px;margin:22px 0 12px}
.isect:first-of-type{margin-top:0}
.isect::after{content:"";flex:1;height:1px;background:var(--line)}
.acard{border:1px solid var(--line);border-left:3px solid var(--line);border-radius:9px;
 padding:13px 15px;margin-bottom:10px;background:var(--card2)}
.acard.hi{border-left-color:var(--acc)}
.acard h3{font-size:15.5px;font-weight:600;line-height:1.45;margin:5px 0}
.acard h3 a{text-decoration:none;border-bottom:1px solid transparent}
.acard h3 a:hover{color:var(--acc);border-bottom-color:var(--acc)}
.acard p{margin:0;font-size:13px;color:var(--body)}
mark{background:var(--acc-w);color:var(--acc);padding:0 2px;border-radius:3px}

svg.kmap{width:100%;height:auto;display:block;overflow:visible}
svg.kmap .prov{fill:var(--map);stroke:var(--map-line);stroke-width:1.1;transition:fill .18s}
svg.kmap .prov.on{fill:var(--map-on)}
.mk{cursor:pointer}
.mk .halo{fill:var(--acc);opacity:.11}
.mk .dot{fill:var(--acc);stroke:var(--card);stroke-width:1.1}
.mk .mlab{fill:var(--ink);font-size:10.5px;font-weight:600;
 font-family:"IBM Plex Sans KR",sans-serif;pointer-events:none;paint-order:stroke;
 stroke:var(--card);stroke-width:3.2px}
.mk[aria-pressed="true"] .dot{fill:var(--acc-2)}
.mk[aria-pressed="true"] .halo{opacity:.32}
.mk:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pcount{fill:var(--teal);font-size:12px;font-weight:600;text-anchor:middle;
 font-family:"IBM Plex Sans KR",sans-serif;pointer-events:none;paint-order:stroke;
 stroke:var(--card);stroke-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:11.5px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;
 background:var(--acc);margin-right:5px;vertical-align:-1px}
.legend i.t{background:var(--teal);border-radius:2px}

.cols{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:22px;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;
 box-shadow:var(--shadow);padding:18px 20px 20px}
.ptitle{font-family:"Gothic A1",sans-serif;font-weight:800;font-size:13px;
 letter-spacing:.06em;color:var(--acc);display:flex;align-items:center;gap:9px;margin-bottom:14px}
.ptitle::after{content:"";flex:1;height:1px;background:var(--line)}
.ptitle.t{color:var(--teal)}

.detail{margin-bottom:18px}
.dhead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.dhead h2{font-size:21px;font-weight:800;letter-spacing:-.02em}
.chip{border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px;color:var(--mute)}
.chip.off{background:var(--gold-w);border-color:transparent;color:var(--gold);font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0 10px;font-size:13.5px}
.kv dt{color:var(--mute);font-size:12.5px}
.kv dd{margin:0;color:var(--ink);font-weight:600}
.dsum{font-size:13.5px;color:var(--body);margin:0 0 10px}
.dlink{display:inline-block;font-size:13px;color:var(--acc);font-weight:600;
 text-decoration:none;border-bottom:1px solid var(--acc)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:16px;
 background:var(--card2);font-size:13px;color:var(--mute)}
.empty b{color:var(--ink);display:block;margin-bottom:5px;font-weight:600}
.empty code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
 background:var(--bg);padding:1px 5px;border-radius:4px}

.cov{margin:0 0 14px}
.covbar{height:8px;border-radius:5px;background:var(--line2);overflow:hidden}
.covbar span{display:block;height:100%;background:var(--teal);border-radius:5px}
.covtx{font-size:12.5px;color:var(--mute);margin-top:7px}
.covtx b{font-family:"Gothic A1",sans-serif;font-size:17px;color:var(--teal);font-weight:800}
.cand{margin-top:14px;padding:13px 15px;border-radius:10px;background:var(--teal-w)}
.cand b{font-family:"Gothic A1",sans-serif;font-size:12.5px;color:var(--teal);
 letter-spacing:.04em;font-weight:800}
.cand p{margin:4px 0 8px;font-size:12px;color:var(--mute)}
.cand ol{margin:0;padding-left:19px;font-size:13.5px;color:var(--ink)}
.cand li{margin-bottom:3px}
.cand li span{color:var(--mute);font-weight:400;font-size:12.5px}
table.ov{width:100%;border-collapse:collapse;font-size:13px}
table.ov th{text-align:left;font-size:11.5px;color:var(--mute);font-weight:500;
 padding:0 0 6px;border-bottom:1px solid var(--line)}
table.ov td{padding:7px 0;border-bottom:1px solid var(--line2);color:var(--ink)}
table.ov td.n{text-align:right;font-variant-numeric:tabular-nums}
table.ov tr.miss td{color:var(--mute)}

.mkt{margin-top:22px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.mcard{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--card2);
  box-shadow:var(--shadow)}
.mcard .t{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.mcard .n{font-size:12.5px;font-weight:600;color:var(--ink)}
.mcard .u{font-size:10.5px;color:var(--mute)}
.mcard .v{font-family:"Gothic A1",sans-serif;font-weight:800;font-size:21px;color:var(--ink);
 letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.mcard .dt{font-size:11px;color:var(--mute);margin-top:1px}
.mcard .d{display:flex;justify-content:space-between;align-items:baseline;margin-top:3px;
 font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.mcard .chg{font-weight:700}
.mcard .chg.up{color:var(--up)} .mcard .chg.dn{color:var(--down)}
.mgroup{font-size:11.5px;color:var(--mute);letter-spacing:.04em;margin:16px 0 8px}
.mgroup:first-of-type{margin-top:0}
.feed{max-height:460px;overflow:auto;margin:0 -4px;padding:0 4px}
.item{border-left:3px solid var(--line);padding:10px 0 10px 12px;
 border-bottom:1px solid var(--line2)}
.item:last-child{border-bottom:0}
.item.soc{border-left-color:var(--acc)}
.imeta{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--mute);margin-bottom:3px}
.item h3{font-size:14px;font-weight:600;line-height:1.45}
.item h3 a{text-decoration:none;border-bottom:1px solid transparent}
.item h3 a:hover{color:var(--acc);border-bottom-color:var(--acc)}
.item p{margin:3px 0 0;font-size:12.5px;color:var(--mute)}
.foot{margin-top:22px;font-size:11.5px;color:var(--mute);line-height:1.6;
 border-top:1px solid var(--line);padding-top:14px}

/* 전달 기록 목록 */
.pn{font-weight:600;color:var(--mute);font-size:11px;margin-left:6px}
.elist{max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.erow{display:grid;grid-template-columns:52px 1fr auto auto;gap:8px;align-items:center;
  width:100%;text-align:left;padding:7px 8px;border:0;border-radius:6px;cursor:pointer;
  background:transparent;color:var(--ink);font:inherit;font-size:12.5px}
.erow:hover{background:var(--card2)}
.erow.on{background:var(--acc-w);box-shadow:inset 2px 0 0 var(--acc)}
.erow .ed{color:var(--mute);font-size:11.5px;font-variant-numeric:tabular-nums}
.erow .en{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .en i{font-style:normal;font-size:9.5px;font-weight:700;color:var(--teal);
  border:1px solid var(--teal);border-radius:3px;padding:0 3px;margin-left:5px;vertical-align:1px}
.erow .ec{color:var(--mute);font-variant-numeric:tabular-nums;font-size:11.5px}
.erow .ea{font-weight:700;font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.dnote{margin:6px 0 0;font-size:11.5px;color:var(--mute)}
.mk.sel .dot{stroke:var(--ink);stroke-width:2}
.mk .llead{stroke:var(--ink);stroke-width:.9;opacity:.55}
.mk.sel .mlab{paint-order:stroke;stroke:var(--card);stroke-width:3.4;stroke-linejoin:round}

/* 연도 · 월 칩 */
.mrow{margin-top:8px}
#yr button em{font-style:normal;font-size:10px;font-weight:700;opacity:.6;margin-left:5px}
#mon button[disabled]{opacity:.32;cursor:default}
.ynote{font-size:11.5px;color:var(--mute);white-space:nowrap}

/* 월별 접이식 토글 */
.mtog{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
  background:var(--card);color:var(--body);border-radius:8px;padding:5px 11px;
  font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.mtog:hover{border-color:var(--acc-2);color:var(--acc)}
.mtog.on{border-color:var(--acc);color:var(--acc);background:var(--acc-w)}
.mtog .cv{font-size:14px;line-height:1;transition:transform .15s}
.monwrap{margin-top:8px}
.monwrap[hidden]{display:none}
#yr .allb{font-weight:700}
.legend .lnote{color:var(--mute);font-size:11px}
/* 전체 보기 연도별 색 (밝을수록 오래된 해) */
:root{ --y1:#86ADD8; --y2:#5A8CC8; --y3:#3570B4; --y4:#1C5391; --y5:#0B3268; }
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --y1:#54718F; --y2:#6C90B8; --y3:#87ADDD; --y4:#A2C6F4; --y5:#C8DFFF; }}
:root[data-theme="dark"]{
  --y1:#54718F; --y2:#6C90B8; --y3:#87ADDD; --y4:#A2C6F4; --y5:#C8DFFF; }
.mk .dot.y1{fill:var(--y1)} .mk .dot.y2{fill:var(--y2)} .mk .dot.y3{fill:var(--y3)}
.mk .dot.y4{fill:var(--y4)} .mk .dot.y5{fill:var(--y5)}
.legend i.y1{background:var(--y1)} .legend i.y2{background:var(--y2)}
.legend i.y3{background:var(--y3)} .legend i.y4{background:var(--y4)}
.legend i.y5{background:var(--y5)}
/* 기부(발전기금 등) 표식도 다른 표식과 같은 색으로 통일 — 요청 2026-09-17 */

.mtog[hidden]{display:none}
/* 전체 보기 : 표식이 122개라 후광을 빼고 선택한 것만 남긴다 */
.kmap.dense .mk .halo{opacity:0}
/* 촘촘할 때 흰 테두리를 조금 더 줘서 옅은 연도색도 육지에서 떠 보이게 한다 */
.kmap.dense .mk .dot{stroke-width:1.4}
.kmap.dense .mk.sel .halo,.kmap.dense .mk:hover .halo{opacity:.3}
/* 선택 강조는 연도 색보다 뒤에 와야 이긴다 */
.mk.sel .dot,.mk[aria-pressed="true"] .dot{fill:var(--acc-2);stroke:var(--ink);stroke-width:2}

.chip.wr{border-color:var(--gold);color:var(--gold);background:var(--gold-w)}
.erow .en i.ag{font-style:normal;font-size:9.5px;font-weight:700;color:var(--gold);
  border:1px solid var(--gold);border-radius:3px;padding:0 3px;margin-left:5px;vertical-align:1px}

/* ══ 기사 우선 레이아웃 ══════════════════════ */
.cols2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.newscol,.sidecol{display:flex;flex-direction:column;gap:16px;min-width:0}
.nbar{align-items:baseline;margin-bottom:10px}
.ptitle.nt{margin:0;border:0;padding:0}

/* 대표 기사 */
.hero{background:linear-gradient(160deg,var(--acc-w) 0%,var(--card) 62%)}
.bigart h3{margin:8px 0 10px;font-size:23px;line-height:1.32;letter-spacing:-.02em;
  font-family:"Gothic A1",sans-serif;font-weight:800;text-wrap:balance}
.bigart h3 a{color:var(--ink);text-decoration:none}
.bigart h3 a:hover{color:var(--acc);text-decoration:underline;text-underline-offset:3px}
.bigart p{margin:0;font-size:14.5px;line-height:1.62;color:var(--body);max-width:62ch}

/* 분류 필터 */
.seg.cat{flex-wrap:wrap;justify-content:flex-end}
.seg.cat button{font-size:11.5px;padding:5px 9px}
.seg.cat button em{font-style:normal;font-size:10px;font-weight:700;opacity:.55;margin-left:4px}

/* 기사 카드 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:11px}
.card{border:1px solid var(--line);border-radius:10px;padding:13px 14px 11px;
  background:var(--card2);display:flex;flex-direction:column;gap:0;transition:border-color .15s}
.card:hover{border-color:var(--acc-2)}
.card.soc{border-left:3px solid var(--acc)}
.bigart.soc{border-left:0}
.card h3{margin:7px 0 7px;font-size:14.5px;line-height:1.42;font-weight:700;letter-spacing:-.01em}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a:hover{color:var(--acc);text-decoration:underline;text-underline-offset:2px}
.card p{margin:0;font-size:12.5px;line-height:1.58;color:var(--mute);flex:1}
.ifoot{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:8px;
  border-top:1px solid var(--line2)}
.ifoot .pr{font-size:11.5px;color:var(--mute);font-weight:600}
.mlink{margin-left:auto;border:0;background:transparent;color:var(--acc);cursor:pointer;
  font:inherit;font-size:11.5px;font-weight:700;padding:2px 0}
.mlink:hover{text-decoration:underline;text-underline-offset:2px}
.chip.c{border-color:var(--line);color:var(--mute)}
.chip.c.soc{border-color:var(--acc);color:var(--acc);background:var(--acc-w)}

/* 축소된 지도 */
.mapbox #map{margin-top:10px}
.mapbox svg.kmap{max-height:330px}
.zoomb{border:1px solid var(--line);background:var(--card);color:var(--body);
  border-radius:8px;padding:4px 10px;font:inherit;font-size:11.5px;font-weight:600;cursor:pointer}
.zoomb:hover{border-color:var(--acc);color:var(--acc)}
.mapbox .legend{margin-top:8px;font-size:11px}
.mapbox #yr button{font-size:11.5px;padding:5px 8px}
.mapbox #yr button em{margin-left:3px}
.mapbox .ynote{font-size:11px}

/* 지도 크게 보기 */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,14,20,.62);
  backdrop-filter:blur(3px);display:flex;flex-direction:column;padding:18px}
.modal[hidden]{display:none}
.mhead{display:flex;align-items:center;gap:10px;color:#fff;padding:0 4px 12px;font-size:15px}
.mhead .mnote{font-size:12px;opacity:.8;font-weight:400}
.mclose{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;
  border-radius:8px;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.mclose:hover{background:rgba(255,255,255,.14)}
.mbody{flex:1;min-height:0;background:var(--card);border-radius:12px;padding:14px;
  display:flex;align-items:center;justify-content:center}
.mbody svg{max-height:100%}

/* 기사에서 지도로 이동했을 때 표식 강조 */
@keyframes pl{0%,100%{opacity:.14}50%{opacity:.62}}
.mk.pulse .halo{animation:pl .5s ease-in-out 3}
@media (prefers-reduced-motion:reduce){.mk.pulse .halo{animation:none;opacity:.5}}

@media (max-width:1080px){
  .cols2{grid-template-columns:1fr}
  .sidecol{order:-1}            /* 좁은 화면에서는 지도를 먼저 */
  .mapbox svg.kmap{max-height:420px}
  .seg.cat{justify-content:flex-start}
  .bigart h3{font-size:20px}
}

.moreb{width:100%;margin-top:12px;border:1px dashed var(--line);background:transparent;
  color:var(--acc);border-radius:9px;padding:11px;font:inherit;font-size:12.5px;
  font-weight:700;cursor:pointer}
.moreb:hover{border-color:var(--acc);background:var(--acc-w)}
.moreb[hidden]{display:none}
/* 스크롤해도 지도가 따라온다 */
@media (min-width:1081px){ .sidecol{position:sticky;top:14px} }

/* ══ 대문 2건 ══════════════════════════════ */
.hero2{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.hpanel{background:linear-gradient(158deg,var(--acc-w) 0%,var(--card) 60%)}
.hpanel2{background:var(--card)}
.subart h3{margin:7px 0 8px;font-size:16px;line-height:1.38;font-weight:800;
  letter-spacing:-.015em;text-wrap:balance}
.subart h3 a{color:var(--ink);text-decoration:none}
.subart h3 a:hover{color:var(--acc);text-decoration:underline;text-underline-offset:2px}
.subart p{margin:0;font-size:12.5px;line-height:1.6;color:var(--mute)}

/* 핵심 숫자 배지 */
.nbadge{display:flex;gap:8px;margin:2px 0 12px}
.nbadge span{display:inline-flex;align-items:baseline;gap:2px;padding:6px 12px 5px;
  border-radius:9px;background:var(--card);border:1px solid var(--acc-2)}
.nbadge b{font-family:"Gothic A1",sans-serif;font-size:22px;font-weight:800;
  color:var(--acc);letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.nbadge i{font-style:normal;font-size:11.5px;font-weight:700;color:var(--acc-2)}
.subart .nbadge{margin:2px 0 9px}
.subart .nbadge span{padding:4px 9px 3px}
.subart .nbadge b{font-size:17px}

/* 지도 확대 (A안) — 넓은 화면에서만 2열. 좁은 화면 규칙을 덮지 않도록 min-width로 감싼다 */
@media (min-width:1081px){
  .cols2{grid-template-columns:minmax(0,1.02fr) minmax(0,1fr)}
  .hero2{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
  .mapbox svg.kmap{max-height:460px}
}
@media (max-width:1080px){
  .cols2,.hero2{grid-template-columns:1fr}
  .mapbox svg.kmap{max-height:440px}
}

/* 칩이 좁은 카드에서 글자 단위로 쪼개지는 것 방지 */
.imeta{flex-wrap:wrap;row-gap:5px}
.imeta .chip,.imeta .num{white-space:nowrap}

/* ══ 12개월 추이 (small multiples · 한 칸 한 계열) ══ */
.trend{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:14px}
.tf{margin:0;border:1px solid var(--line);border-radius:10px;padding:11px 12px 6px;background:var(--card2)}
.tf figcaption{display:flex;align-items:baseline;gap:8px;font-size:12.5px;font-weight:700;
  color:var(--ink);margin-bottom:2px}
.tf figcaption span{font-size:10.5px;font-weight:600;color:var(--mute)}
.tf svg{display:block;width:100%;height:auto}
.tln{fill:none;stroke:var(--acc);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.te{fill:var(--acc);stroke:var(--card2);stroke-width:1.5}
.tb{stroke:var(--line);stroke-width:1}
.tar{fill:var(--acc);opacity:.09;stroke:none}
/* 숫자는 정해진 자리에만 둔다 : 머리(현재값) · 그래프 안 최고점 하나 · 바닥(연월) */
.tnow{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 7px;margin:2px 0 4px}
.tnow b{font-size:31px;font-weight:800;letter-spacing:-.03em;line-height:1.05;
  color:var(--ink);font-variant-numeric:tabular-nums}
.tnow em{font-style:normal;font-size:13.5px;font-weight:700;color:var(--mute);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.tsub{font-size:12.5px;font-weight:600;color:var(--mute);margin:-3px 0 3px;
  font-variant-numeric:tabular-nums}
.tsub b{color:var(--ink);font-weight:800}
.tpk{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;
  paint-order:stroke;stroke:var(--card2);stroke-width:4.2;stroke-linejoin:round}
.tpk.up{fill:var(--ink)} .tpk.dn{fill:var(--mute)}
.tpc{font-size:12.5px;font-weight:700;fill:var(--mute)}
.mcard .v .vl{font-style:normal;font-size:12px;font-weight:700;color:var(--mute);
  margin-left:8px;letter-spacing:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.tfoot{display:flex;justify-content:space-between;margin-top:1px;
  font-size:15px;font-weight:600;color:var(--mute);font-variant-numeric:tabular-nums}
.hp .ch,.hp .hd{opacity:0;transition:opacity .12s}
.hp .ch{stroke:var(--acc-2);stroke-width:1;stroke-dasharray:2 2}
.hp .hd{fill:var(--acc-2);stroke:var(--card2);stroke-width:1.5}
.hp:hover .ch,.hp:hover .hd{opacity:1}
.tnote{margin:10px 0 0;font-size:11.5px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){.hp .ch,.hp .hd{transition:none}}

/* 시세 카드 — 사내 데일리 리포트 형식 (당월/전월평균 · 전월/전일대비) */
.mcard .mg{display:grid;grid-template-columns:1fr auto;gap:2px 12px;margin-top:6px}
.mcard .ml,.mcard .mr{display:flex;align-items:baseline;gap:7px;font-size:11.5px}
.mcard .mr{justify-content:flex-end}
.mcard .ml span,.mcard .mr span{color:var(--mute)}
.mcard .ml b{font-weight:700;color:var(--body);font-variant-numeric:tabular-nums}
.mcard .chg{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.mcard .chg.up{color:var(--up)} .mcard .chg.dn{color:var(--down)}
.mcard .chg.na{color:var(--mute);font-weight:600}
.mcard .dt{margin-top:7px;padding-top:6px;border-top:1px solid var(--line2);font-size:10.5px}
/* 시세 탭 카드 안 미니 그래프 · 월별(연도별) 상세표 — 요청 2026-09-16
   .tf 클래스를 같이 줘서 손가락·마우스로 짚으면 숫자가 뜨는 trendTouch() 를
   그대로 재사용한다 (요청 2026-09-16, 2차) — 카드용 크기로만 .tf 기본 박스를 지운다 */
.mchart.tf{margin:10px 0 2px;padding:9px 0 0;border:0;border-top:1px solid var(--line2);
  background:transparent}
.mchart svg{display:block;width:100%;height:auto}
/* 12개월/5개년 버튼이 잘 안 보인다는 지적 — 요청 2026-09-16, 4차.
   #tmodal(전체보기 모달) 쪽 같은 버튼은 이미 크게(18.5px) 잡혀 있는데,
   시세 탭 헤더의 이 버튼만 일반 .seg 기본 크기를 그대로 물려받고 있었다 */
/* 버튼 3개 중 선택 안 된 것들은 배경색 없는 투명 글씨라 버튼처럼 안 보인다는
   지적 — 요청 2026-09-16, 7차. 안 눌린 버튼에도 자기 테두리를 줘서 항상
   "버튼 묶음"으로 보이게 하고, 눌린 버튼만 테두리 없이 꽉 찬 색으로 둔다 */
#mspan{background:var(--card);border:1.5px solid var(--line);padding:4px;gap:4px}
#mspan button{font-size:15.5px;font-weight:700;padding:9px 18px}
#mspan button:not([aria-pressed="true"]){border:1.5px solid var(--line);background:var(--card2)}
#mspan button[aria-pressed="true"]{font-weight:800}
#mspan button:not([aria-pressed="true"]):hover{border-color:var(--acc-2);background:var(--card)}
.mtog.mtblt{display:flex;width:100%;justify-content:center;margin-top:9px;font-size:24px;font-weight:700;padding:12px 16px;gap:10px}
.mtog.mtblt .cv{font-size:22px}
/* 12개월·5개년(일반) 카드는 전체이력만큼 넓지 않아 버튼 글자를 절반으로 줄인다 — 요청 2026-09-18 */
.mcard:not(.full) .mtog.mtblt{font-size:12px;padding:7px 12px;gap:5px}
.mcard:not(.full) .mtog.mtblt .cv{font-size:11px}
/* '전체'(2022~) 상세 그래프 — 카드가 한 줄 전체 폭을 쓰고, 선을 굵게,
   연도 경계선·라벨을 더한다 — 요청 2026-09-16, 5차 */
.mgrid.full{grid-template-columns:1fr!important}
.mcard.full{padding:22px 24px 18px}
/* ══ 전체이력 카드 헤더 : 히어로 넘버 (요청 2026-09-17) ══════════
   그래프가 카드 한 줄 전체를 쓰는 큰 그림으로 바뀌면서 그 위 이름·시세가
   상대적으로 작아 보였다. 이름 → 큰 시세 숫자 → 4분할 보조지표 띠 순서로
   위에서 아래로 시선이 내려가게 다시 짰다(세 시안 중 A안 채택).
   그래프·"월별 상세 보기" 버튼·마크업은 그대로, .full 스코프 CSS만 새로 얹는다 */
.mcard.full{text-align:left!important}
.mcard.full .t{align-items:center!important;justify-content:flex-start!important;
  gap:10px!important;position:relative;padding-left:14px!important;margin-bottom:2px!important}
.mcard.full .t::before{content:"";position:absolute;left:0;top:1px;bottom:1px;
  width:4px;border-radius:2px;background:var(--mkt)}
.mcard.full .n{font-size:28.8px!important;font-weight:800!important;letter-spacing:-.01em}
.mcard.full .u{font-size:15px!important;color:var(--mkt)!important;
  background:var(--mkt-bg);border:1px solid var(--mkt-ln);border-radius:999px;
  padding:2px 10px!important;font-weight:600}
.mcard.full .v{display:flex!important;align-items:baseline!important;justify-content:flex-start!important;
  gap:12px!important;font-size:60px!important;margin-top:10px!important}
.mcard.full .v .vl{font-size:13.5px!important;font-weight:600!important;
  color:var(--mute)!important;font-style:normal}
.mcard.full .mg{display:flex!important;grid-template-columns:none!important;
  border-top:1px solid var(--line2);margin-top:18px!important;
  padding-top:15px!important;gap:0!important}
.mcard.full .mg .ml,.mcard.full .mg .mr{flex:1;flex-direction:column!important;
  align-items:flex-start!important;justify-content:flex-start!important;
  gap:5px!important;padding:0 16px;border-left:1px solid var(--line2)}
.mcard.full .mg .ml:first-child{border-left:0;padding-left:0}
/* 어르신도 바로 읽히도록 라벨·값 모두 큰 폭으로 확대 (요청 2026-09-17, 3차) */
.mcard.full .mg span{font-size:19.6px!important;font-weight:500!important;color:var(--mute)!important}
.mcard.full .mg b,.mcard.full .mg .chg{font-size:27.6px!important}
/* 당월평균·전월평균(평균값 두 개)을 먼저, 전월대비·전일대비(증감률 두 개)를
   뒤로 — flex로 바꾸며 마크업 순서(평균/대비/평균/대비)가 그대로 노출돼
   시안(A안)과 다르게 보였다 — order로만 바로잡는다, 마크업은 그대로 (2026-09-17) */
.mcard.full .mg>*:nth-child(1){order:1}
.mcard.full .mg>*:nth-child(2){order:3}
.mcard.full .mg>*:nth-child(3){order:2}
.mcard.full .mg>*:nth-child(4){order:4}
@media (max-width:640px){
  .mcard.full .n{font-size:20px!important}
  .mcard.full .v{font-size:42px!important}
  .mcard.full .mg{flex-wrap:wrap!important;row-gap:16px!important}
  .mcard.full .mg .ml,.mcard.full .mg .mr{flex:1 1 45%!important;border-left:0!important;padding-left:16px!important}
  .mcard.full .mg span{font-size:15px!important}
  .mcard.full .mg b,.mcard.full .mg .chg{font-size:21px!important}
}
/* 다른 그래프(12개월·5개년 카드)에도 같은 통화 배지 스타일을 통일 적용
   — 히어로 넘버에서만 쓰던 알약형 단위 표시를 전체 카드로 확장 (2026-09-17) */
.mcard:not(.full) .u{color:var(--mkt);background:var(--mkt-bg);
  border:1px solid var(--mkt-ln);border-radius:999px;padding:1px 8px;font-weight:600}
.mchart.mchart-detail{padding-top:14px}
.mchart.mchart-detail .tln{stroke-width:2.6}
.tf svg{touch-action:none}
.mgy{stroke:var(--line2);stroke-width:1;stroke-dasharray:3 3}
.mgyl{font-size:14px;font-weight:700;fill:var(--mute)}
.mtbl-wrap{margin-top:7px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.mtbl-wrap[hidden]{display:none}
.mtbl{width:100%;border-collapse:collapse;font-size:11.5px}
.mtbl th,.mtbl td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--line2);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.mtbl thead th{position:sticky;top:0;z-index:5;background:var(--card2);color:var(--mute);font-weight:700}
/* 표 글씨가 상단 당월/전월평균 숫자보다 훨씬 작아 눈에 잘 안 띈다는 지적
   — 요청 2026-09-17. 카드 종류별로 위 숫자 크기에 맞춰 키운다 */
.mcard:not(.full) .mtbl{font-size:15.5px}
.mcard:not(.full) .mtbl th,.mcard:not(.full) .mtbl td{padding:8px 10px}
.mcard.full .mtbl-wrap{max-height:420px}
.mcard.full .mtbl{font-size:22px}
.mcard.full .mtbl th,.mcard.full .mtbl td{padding:12px 18px}
.mcard.full .mtbl thead th{font-size:15px}
.mtbl-bar th,.mtbl-bar td{padding-top:14px!important;padding-bottom:14px!important}
.mtbl-bar .mval{position:relative;text-align:right}
.mtbl-bar .mval .bar{position:absolute;left:0;top:4px;bottom:4px;
  background:var(--bar-fill);border-radius:6px;z-index:0}
.mtbl-bar .mval .mv{position:relative;z-index:1;padding-right:8px;
  font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.mtbl-bar.mtbl thead th:first-child{text-align:center;padding-left:30px;padding-right:14px}
.mtbl-bar.mtbl thead th:last-child{text-align:center;padding-left:14px;padding-right:30px}
.mtbl-bar tbody th:first-child,.mtbl-bar tbody td:first-child{text-align:center;padding-left:30px;padding-right:14px}
.mtbl-bar tbody th:last-child,.mtbl-bar tbody td:last-child{text-align:center;padding-left:14px;padding-right:30px}
.mtbl-bar.mtbl thead th{font-size:21.6px!important}
.mtbl-bar tbody th{font-size:21px}
.mtbl-bar .mtd{font-size:22px;font-weight:800}
@media (max-width:640px){
  .mcard.full .mtbl{font-size:18px}
  .mcard.full .mtbl th,.mcard.full .mtbl td{padding:10px 12px}
  /* 모바일에서 12개월·5개년(일반) 표와 전체년도(막대) 표의 글자 크기가 서로
     달라 보이던 것을 통일한다 — 일반 15.5px · 전체 21px 두 크기의 평균인
     18px로 맞춘다 (요청 2026-09-17) */
  .mcard:not(.full) .mtbl{font-size:18px!important}
  .mcard.full .mtbl thead th{font-size:18px!important}
  .mcard.full .mtbl tbody th{font-size:18px!important}
  .mcard.full .mtbl .mval .mv{font-size:18px!important}
  .mcard.full .mtbl .mtd{font-size:18px!important}
}
/* '월'(또는 '연도') 칸만 본문은 왼쪽 정렬(아래 tbody th)인데 머리글은
   공통 규칙(위 .mtbl th,.mtbl td)의 오른쪽 정렬을 그대로 물려받아
   따로 놀았다 — 요청 2026-09-16, 11차 */
.mtbl thead th:first-child{text-align:left}
.mtbl tbody th{text-align:left;font-weight:700;color:var(--body)}
.mtd.up{color:var(--up)} .mtd.dn{color:var(--down)} .mtd.na{color:var(--mute)}
.mtbl .mosub{display:block;font-size:.72em;font-weight:500;color:var(--mute)}
.mtbl .mtd .mtdp{font-size:.78em;font-weight:600;opacity:.85;white-space:nowrap}
/* ══ 모바일 (요청 2026-09-23) ══
   · 기간 버튼 4개가 글씨가 커서 두 줄로 꺾였다 → 한 줄, 네 칸 같은 폭
   · 월별 이력 카드가 너무 길다 → 그래프 높이를 줄이고 요약 칸 간격을 좁힌다 */
@media (max-width:640px){
  #mspan{display:flex!important;width:100%}
  #mspan button{flex:1 1 0;min-width:0;white-space:nowrap;font-size:13px!important;
    padding:9px 2px!important;letter-spacing:-.02em}
  .mcard.full .v{font-size:36px!important;margin-top:6px!important}
  .mcard.full .mg{margin-top:12px!important;padding-top:10px!important;row-gap:8px!important}
  .mcard.full .mg .ml,.mcard.full .mg .mr{gap:2px!important}
  .mcard.full .mg span{font-size:13px!important}
  .mcard.full .mg b,.mcard.full .mg .chg{font-size:18px!important}
  .mcard.full .mchart.mchart-detail{padding-top:6px}
  .mcard.full .tfoot{font-size:12px!important}
  .mcard.full .mtog.mtblt{font-size:16px;padding:9px 12px;margin-top:7px}
  .mcard.full .mtog.mtblt .cv{font-size:15px}
}
/* ══ 월별 이력(전체) 카드 : 현재의 75% 크기로 (요청 2026-09-23) ══════════
   너무 크고 여백이 없어 답답하다는 지적. 모양·순서는 그대로 두고 글자·간격·
   그래프 높이만 0.75배로, 카드 안쪽 여백은 조금 넓혔다. 데스크톱만 (모바일은 그대로).
   그래프는 mktChartDetail() 의 viewBox 가로를 900→1200 으로 넓혀 같은 폭에서
   높이·글자·선이 모두 0.75배가 되게 했다. */
@media (min-width:641px){
  .mcard.full{padding:22px 28px 18px!important}   /* 뒤쪽 .mcard{…!important} 를 이긴다 */
  .mcard.full .tfoot{font-size:11.3px!important}
  .mcard.full .t{gap:8px!important;padding-left:11px!important}
  .mcard.full .t::before{width:3px}
  .mcard.full .n{font-size:21.6px!important}
  .mcard.full .u{font-size:11.3px!important;padding:1.5px 7.5px!important}
  .mcard.full .v{font-size:45px!important;gap:9px!important;margin-top:7.5px!important}
  .mcard.full .v .vl{font-size:11px!important}   /* 0.75배면 10px 아래라 읽기 어려워 11px 로 둔다 */
  .mcard.full .mg{margin-top:13.5px!important;padding-top:11.3px!important}
  .mcard.full .mg .ml,.mcard.full .mg .mr{gap:3.8px!important;padding:0 12px}
  .mcard.full .mg span{font-size:14.7px!important}
  .mcard.full .mg b,.mcard.full .mg .chg{font-size:20.7px!important}
  .mcard.full .mchart.mchart-detail{padding-top:10.5px}
  .mcard.full .mtog.mtblt{font-size:18px;padding:9px 12px;gap:7.5px;margin-top:7px}
  .mcard.full .mtog.mtblt .cv{font-size:16.5px}
  .mcard.full .mtbl-wrap{max-height:315px}
  .mcard.full .mtbl{font-size:16.5px}
  .mcard.full .mtbl th,.mcard.full .mtbl td{padding:9px 13.5px}
  .mcard.full .mtbl thead th{font-size:11.3px}
}

/* 시세 띠 — 월/일 두 지표 */
.ti .v{margin-top:1px}
.ti .r{gap:8px;margin-top:2px}
.ti .c i{font-style:normal;font-size:9.5px;font-weight:700;color:var(--mute);margin-right:3px}

.mcard .ml span,.mcard .mr span,.mcard .ml b,.mcard .chg{white-space:nowrap}
/* 한 묶음이 4종이라 4칸으로 고정한다 (자동 배치는 3+1 로 남는 칸이 생긴다) */
@media (min-width:1180px){ .mgrid{grid-template-columns:repeat(4,minmax(0,1fr))!important} }
@media (min-width:700px) and (max-width:1179px){ .mgrid{grid-template-columns:repeat(2,minmax(0,1fr))!important} }
@media (max-width:699px){ .mgrid{grid-template-columns:1fr!important} }
.mcard .dt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ══ 소제목 (요청 6) ══════════════════════════ */
.sect{margin:0;font-family:"Gothic A1",sans-serif;font-size:19px;font-weight:800;
  letter-spacing:-.02em;color:var(--ink)}
.shead{align-items:baseline;margin:15px 0 9px;flex-wrap:wrap;row-gap:6px}
.sub2{font-size:12.5px;color:var(--mute)}
.trhead{margin-top:18px}
.ttog{margin-left:10px;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);
  background:var(--card);color:var(--body);border-radius:8px;padding:4px 10px;
  font:inherit;font-size:11.5px;font-weight:600;cursor:pointer}
.ttog:hover{border-color:var(--acc);color:var(--acc)}
.ttog .cv{font-size:13px;line-height:1}
#trwrap[hidden]{display:none}

/* ══ 추이 그래프 확대 (요청 5) ═══════════════ */
/* 4종이라 한 줄에 4칸으로 고정한다 (auto-fit 은 3+1 로 남는 칸이 생긴다) */
@media (min-width:1180px){ .trend{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px} }
@media (min-width:660px) and (max-width:1179px){ .trend{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px} }
@media (max-width:659px){ .trend{grid-template-columns:1fr;gap:12px} }
.tf{padding:10px 12px 5px}
.tf figcaption{font-size:15px;margin-bottom:3px}
.tf figcaption span{font-size:12px}
.tln{stroke-width:2.6}
@media (min-width:1180px){ .tnow b{font-size:34px} }

/* ══ 지도 확대 · 제주 인셋 (요청 1~4) ════════ */
.mapbox svg.kmap{max-height:660px}
/* 지도 카드는 좌우 여백을 줄여 그림에 폭을 더 준다 */
.panel.mapbox{padding-left:8px;padding-right:8px}
.mk .mlab{font-size:15.5px;font-weight:700;
  paint-order:stroke;stroke:var(--card2);stroke-width:3;stroke-linejoin:round}
.jbox{fill:none;stroke:var(--line);stroke-width:1.4;stroke-dasharray:4 3}
.jlab{fill:var(--mute);font-size:13px;font-weight:700}

/* ══ 시세 카드 글씨 확대 (요청 5·7) ══════════ */
.mcard{padding:14px 16px}
.mcard .n{font-size:15px;font-weight:700}
.mcard .u{font-size:12px}
.mcard .v{font-size:30px}
.mcard .ml,.mcard .mr{font-size:13.5px}
.mcard .chg{font-size:14.5px}
.mcard .dt{font-size:12px}
.mkt .ptitle{font-size:19px}
.mgroup{font-size:14px!important}
.mkt .dsum{font-size:12.5px!important}

/* ══ 기사 제목 확대 · 요약 축소 (요청 2) ══════ */
.card{padding:12px 14px 10px}
.card h3{margin:6px 0 0;font-size:17.5px;line-height:1.34;font-weight:800;letter-spacing:-.02em}
.bigart h3{font-size:24px}
.bigart p{font-size:14px;line-height:1.6}
.subart h3{font-size:19px;line-height:1.34}
.subart p.one{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;font-size:12.5px}
.cards{grid-template-columns:repeat(auto-fill,minmax(266px,1fr));gap:10px}
.ifoot{margin-top:9px;padding-top:7px}
.ifoot .pr{font-size:12px}
.mlink{font-size:12px}

/* ══ 선택한 지역 : 2단 · 높이 축소 (요청 3) ═══ */
.detail{padding:13px 15px}
.detail .dhead{margin-bottom:9px}
.detail .dhead h2{font-size:20px}
.d2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
.d2 .kv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.d2 .kv dt{color:var(--mute);white-space:nowrap}
.d2 .kv dd{margin:0;font-weight:700;color:var(--ink)}
.dside{display:flex;flex-direction:column;gap:6px;min-width:0}
.dside .dsum{margin:0;font-size:12.5px;line-height:1.5;color:var(--body);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dside .dlink{font-size:12.5px}
.dcov{font-size:11.5px;color:var(--mute)}
@media (max-width:520px){ .d2{grid-template-columns:1fr} }

/* ══ 연도별 색 범례 (요청 4) ══════════════════ */
.ylegend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin-top:10px;
  font-size:13.5px;font-weight:600;color:var(--body)}
.ylegend:empty{display:none}
.ylegend span{display:inline-flex;align-items:center;gap:6px}
.ylegend i{width:13px;height:13px;border-radius:50%;display:inline-block}
.ylegend i.y1{background:var(--y1)} .ylegend i.y2{background:var(--y2)}
.ylegend i.y3{background:var(--y3)} .ylegend i.y4{background:var(--y4)}
.ylegend i.y5{background:var(--y5)}
.ylegend .ynote2{font-size:11.5px;font-weight:400;color:var(--mute)}

/* ══ 뉴스레터 호 옆 주차 (요청 5) ═════════════ */
.iv em{font-style:normal;font-size:11px;font-weight:600;color:var(--mute);margin-left:7px}

/* 정리된 안내 문구 (요청 6) */
.legacy{font-size:12.5px;color:var(--mute);margin:8px 0 0}
.foot{font-size:11.5px}
/* 판 표시 — 옛 파일을 열었는지 한눈에 알 수 있게 (캐시 확인용) */
.ver{display:inline-block;margin-left:8px;padding:2px 8px;border:1px solid var(--line);
  border-radius:999px;font-size:11px;font-weight:700;color:var(--mute);
  background:var(--card);font-variant-numeric:tabular-nums;white-space:nowrap}

/* 상단을 눌러 지도가 한 화면에 더 들어오게 한다 */
.stats{gap:9px!important}
.stat{padding:11px 13px!important}
.stat .num{font-size:23px!important}
.legacy{margin:7px 0 0}

/* ══ 로고 · 인트로 · 섹션 구분선 (요청 2026-09-03) ══════════ */
/* 로고가 머리 오른쪽 끝 자리를 쓴다. 밝기 버튼은 바닥으로 내렸다 */
.logo{height:33px;width:auto;display:block;flex:0 0 auto}
.fbar{display:flex;align-items:flex-start;gap:16px;margin-top:14px}
.fbar .foot{flex:1 1 auto;margin:0}
.fbar .tbtn{flex:0 0 auto}
@media (max-width:560px){ .fbar{flex-direction:column} }
/* 로고 원본이 파랑+주황이라 어두운 배경에서는 흰 판 위에 얹는다 */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{
  background:#fff;padding:5px 9px;border-radius:8px;box-sizing:content-box}}
:root[data-theme="dark"] .logo{background:#fff;padding:5px 9px;border-radius:8px;box-sizing:content-box}

hr.sdiv{border:0;border-top:1px solid var(--line);margin:22px 0 0}

.intro{position:fixed;inset:0;z-index:99;display:grid;place-items:center;
  background:var(--bg);animation:ifade 4.4s ease forwards}
.intro .ib{text-align:center;animation:iup .9s cubic-bezier(.2,.7,.2,1) both}
.intro .ilogo{height:30px;width:auto;display:block;margin:0 auto 22px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .intro .ilogo{
  background:#fff;padding:7px 12px;border-radius:9px;box-sizing:content-box}}
:root[data-theme="dark"] .intro .ilogo{background:#fff;padding:7px 12px;border-radius:9px;box-sizing:content-box}
.intro .ik{display:block;font-family:"Gothic A1",sans-serif;font-weight:800;
  font-size:clamp(30px,6.4vw,60px);letter-spacing:-.03em;color:var(--acc)}
.intro .ie{display:block;margin-top:10px;font-size:clamp(12px,1.6vw,16px);
  font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
@keyframes ifade{0%,91%{opacity:1;visibility:visible}
  100%{opacity:0;visibility:hidden;pointer-events:none}}
@keyframes iup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.intro.off{animation:none;opacity:0;visibility:hidden;pointer-events:none}
@media (prefers-reduced-motion:reduce){
  .intro{animation-duration:2.2s}
  .intro .ib{animation:none}
}

/* ══ 선택한 지역 표식 : 계속 깜빡여 눈에 남게 한다 (한 번에 1건) ══ */
.mk .pulse{fill:none;stroke:var(--acc-2);stroke-width:2.2;
  transform-box:fill-box;transform-origin:center;animation:mkp 1.6s ease-out infinite}
@keyframes mkp{0%{transform:scale(.82);opacity:.9} 72%,100%{transform:scale(2.05);opacity:0}}
.mk.sel .dot,.mk[aria-pressed="true"] .dot{animation:mkd 1.6s ease-in-out infinite}
@keyframes mkd{0%,100%{stroke-width:2} 50%{stroke-width:3.4}}
@media (prefers-reduced-motion:reduce){
  .mk .pulse{animation:none;opacity:.55;transform:scale(1.35)}
  .mk.sel .dot,.mk[aria-pressed="true"] .dot{animation:none}
}

/* ══ 지도 안 연도 요약 (동해 · 울릉도 위쪽) ══════════════════ */
.msum{pointer-events:none}
.msum .mscard{fill:var(--card);stroke:var(--line);stroke-width:1}
.msum .mst{fill:var(--acc);font-size:12.5px;font-weight:800;
  font-family:"Gothic A1",sans-serif;font-variant-numeric:tabular-nums}
.msum .msl{stroke:var(--line2);stroke-width:1}
.msum .msk{fill:var(--mute);font-size:11.5px;font-weight:600;
  font-family:"IBM Plex Sans KR",sans-serif}
.msum .msv{fill:var(--ink);font-size:16px;font-weight:800;
  font-family:"Gothic A1",sans-serif;font-variant-numeric:tabular-nums}

/* ══ 주간 동행 / 주간 성장 : 가로 1:1 ══════════════════════ */
/* 두 칸을 가로 1:1 · 세로도 같은 높이로 맞춘다 */
@media (min-width:1081px){
  .hero2{grid-template-columns:1fr 1fr!important;align-items:stretch!important}
  .hero2>.panel{height:100%}
}
.hpanel,.hpanel2{display:flex;flex-direction:column;min-width:0}
.hsum{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}
.hsum b{display:inline-flex;align-items:baseline;gap:5px;border:1px solid var(--line);
  background:var(--card2);border-radius:8px;padding:4px 9px;font-size:12px;font-weight:600;
  color:var(--mute)}
.hsum b i{font-style:normal;font-size:15px;font-weight:800;color:var(--ink);
  font-variant-numeric:tabular-nums}
.hsum b.k{border-color:var(--acc);background:var(--acc-w)}
.hsum b.k i{color:var(--acc)}
.hli{border-top:1px solid var(--line2);padding:10px 0 9px}
.hli:first-child{border-top:0;padding-top:2px}
.hli .hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:7px;margin-bottom:3px}
.hli .hd .num{font-size:11.5px;font-weight:700;color:var(--acc)}
.hli h3{margin:0;font-size:17px;line-height:1.36;letter-spacing:-.02em;
  font-family:"Gothic A1",sans-serif;font-weight:800;text-wrap:balance}
.hli h3 a{color:var(--ink);text-decoration:none}
.hli h3 a:hover{color:var(--acc);text-decoration:underline;text-underline-offset:3px}
.hli .hb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.hli .hb .nbadge{margin:0}
.hwin{font-size:11.5px;color:var(--mute);font-weight:600}
@media (max-width:1080px){ .hli h3{font-size:19px} }
/* 주간 동행 : 숫자만 크게 · 주간 성장 : 한 건을 크게 */
.hsum.big{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 0}
.hsum.big b{display:block;padding:11px 13px 9px;border-radius:10px}
.hsum.big b i{display:block;font-size:24px;line-height:1.12;letter-spacing:-.02em;
  white-space:nowrap}
.hsum.big b span{display:block;margin-top:2px;font-size:12.5px;font-weight:600;
  color:var(--mute);white-space:nowrap}
.hnote{margin:12px 0 0;font-size:12.5px;line-height:1.55;color:var(--mute)}
.hli.one{padding-top:6px}

/* ══════════════════════════════════════════════════════════════
   되돌린 뒤 남긴 것 두 가지 (2026-09-03)
   ① 기사 카드 : 상자 대신 목록 — 카드가 12~46장이라 상자로 두면 격자가 된다
   ② 명조 : 머리 제목과 인트로 문구에만. 섹션·탭·패널 제목은 고딕 그대로
   (밴드판은 map_shell_밴드판_백업.html · 그 이전은 map_shell_회색배경_백업.html)
   ══════════════════════════════════════════════════════════════ */

/* ① 기사 카드 — 상자 대신 목록 (기사 탭 · 뉴스레터 탭 공통) */
.cards{gap:0 18px!important}

/* ② 명조는 머리와 인트로에만 */
h1,.intro .ik{font-family:"Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo",serif;
  font-weight:700}
h1{font-size:29px;letter-spacing:-.01em}

/* ══════════════════════════════════════════════════════════════
   밝은판(채도) 채택 후 보정 — 2026-09-03
   ① 지표 타일 경계 : 배경이 밝아지며 파란 채움 타일과 대비가 1.01 까지
      떨어져 경계가 사라졌다. 채움을 한 단 내리고 테두리를 넣어 되살린다
      (테두리 vs 배경 대비 1.75)
   ② 지도 요약 카드 : 머리띠 · 구분선 · 그림자를 넣어 다듬는다
   ③ 인트로 : 문구를 파란 띠 위에 얹어 그 줄만 강조한다
   ══════════════════════════════════════════════════════════════ */

/* ① 지표 타일 경계 */
.stat{border:1px solid var(--tile-ln)!important}
.stat.hl{background:var(--hl)!important;border-color:var(--hl-ln)!important}
.stat.tl{border-color:var(--teal)!important}
/* 여백도 밝은판 기준으로 (흰 면적이 늘면 색이 맑게 읽힌다) */
.panel{padding:22px 24px 24px}
.card{padding:15px 16px 13px}
.stat{padding:15px 17px!important}
.stats{gap:12px!important}
.cols2{gap:20px!important}
.hero2{gap:20px!important}
.trend{gap:16px!important}
.mgrid{gap:14px!important}
.mcard{padding:14px 15px 12px}
.tf{padding:12px 14px 6px}
.tabs{margin:22px 0 24px}
.wrap{padding:30px 22px 64px}
.cards>.card{padding:15px 2px 14px!important}
.acard{padding:15px 2px 14px!important}

/* ② 지도 요약 카드 */
.msum{pointer-events:none;filter:drop-shadow(0 2px 3px rgba(18,60,122,.13))
  drop-shadow(0 8px 14px rgba(18,60,122,.10))}
.msum .mscard{fill:var(--card);stroke:var(--line);stroke-width:1}
.msum .mshead{fill:var(--acc-w);stroke:none}
.msum .msrail{fill:var(--acc)}
.msum .mst{fill:var(--acc);font-size:12.5px;font-weight:800;
  font-family:"Gothic A1",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.msum .msl{stroke:var(--line2);stroke-width:1}
.msum .msk{fill:var(--mute);font-size:11px;font-weight:600;
  font-family:"IBM Plex Sans KR",sans-serif}
.msum .msv{fill:var(--ink);font-size:15.5px;font-weight:800;
  font-family:"Gothic A1",sans-serif;font-variant-numeric:tabular-nums}
.msum .msf{fill:var(--mute);font-size:11.5px;font-weight:700;
  font-family:"IBM Plex Sans KR",sans-serif;font-variant-numeric:tabular-nums}

/* ③ 인트로 : 문구를 띠 위에 */

  padding:38px 22px 34px;box-shadow:0 10px 40px rgba(18,60,122,.28);
  animation:iband .8s cubic-bezier(.2,.75,.2,1) both}
.intro .ib::before,.intro .ib::after{content:"";display:block;height:2px;
  background:rgba(255,255,255,.26);max-width:520px;margin:0 auto}

@media (prefers-reduced-motion:reduce){ .intro .ib{animation:none} }

/* ══ 탭 구분 · 글씨 키우기 (요청 2026-09-03) ══════════════════ */
/* 탭 3개가 글자만 나란히 있어 어디까지가 한 항목인지 모호했다.
   ① 항목 사이 세로 실선  ② 고른 탭은 연파랑 채움 + 3px 밑줄 */
.tabs{gap:0!important;border-bottom:1px solid var(--line)}
.tabs button{position:relative;padding:12px 20px 13px!important;font-size:17.5px!important;
  border-bottom:3px solid transparent!important;margin-bottom:-1px;border-radius:9px 9px 0 0}
.tabs button+button::before{content:"";position:absolute;left:0;top:9px;bottom:9px;
  width:1px;background:var(--line)}
.tabs button[aria-selected="true"]{background:var(--acc-w);
  border-bottom-color:var(--acc)!important;color:var(--acc)}
.tabs button[aria-selected="true"]::before,
.tabs button[aria-selected="true"]+button::before{background:transparent}
.tabs button:hover{color:var(--acc)}
.tabs .cnt{font-size:13px!important;margin-left:6px}

/* 패널 여백이 늘며 기사 카드가 1열로 떨어졌다 (268*2+18 > 544). 2열로 되돌린다 */
.cards{grid-template-columns:repeat(auto-fill,minmax(246px,1fr))!important}

/* 기사 46건 · 분류 칩 */

.ptitle.nt .pn{font-size:14px!important;margin-left:8px}

/* 지도 아래 부연 설명 (연도 색 범례 · 안내 문구) */

.ylegend i{width:14px!important;height:14px!important}
.ylegend .ynote2{font-size:13px!important}
.mapbox .ynote{font-size:12.5px!important}
.legend,.legend .lnote{font-size:13px!important}
.dnote{font-size:13.5px!important}

/* 전달 기록 — 한 단 더 */
.erow{padding:10px 11px!important;grid-template-columns:64px 1fr auto auto!important;
  gap:12px!important}
.erow .ed{font-size:14px!important}
.erow .en{font-size:16.5px!important}
.erow .ec{font-size:14px!important}
.erow .ea{font-size:16.5px!important;min-width:52px!important}
.erow .en i{font-size:12px!important}
.elist{max-height:440px!important}
.ptitle .pn{font-size:13.5px!important}

/* ══ 고른 도시 강조 · 지표 타일 표기 (요청 2026-09-03) ══════════ */
/* ① 고른 곳의 이름 — 원이 커진 만큼 글씨도 키운다. 흰 테두리를 두껍게 둘러
   촘촘한 전체 보기에서도 다른 이름 위로 또렷하게 얹힌다 */
.mk.sel .mlab{font-size:22px!important;font-weight:800!important;fill:var(--acc)!important;
  stroke:var(--card)!important;stroke-width:5px!important}
.kmap.dense .mk.sel .mlab{font-size:18px!important;stroke-width:4.2px!important}
.mk.sel .llead{stroke-width:1.4;opacity:.75}

/* ② 지표 타일 — 라벨을 위로, 숫자와 단위를 나눈다 */
.stat{display:flex!important;flex-direction:column;gap:0;justify-content:flex-start}
.stat .sl{order:1;font-size:12.5px!important;font-weight:600;color:var(--mute);
  letter-spacing:.02em;line-height:1.3}
.stat b.num{order:2;margin-top:5px;display:flex!important;align-items:baseline;gap:4px;
  font-size:31px!important;line-height:1.08;letter-spacing:-.03em}
.stat b.num em{font-style:normal;font-size:15px;font-weight:700;letter-spacing:0;
  color:var(--mute)}
.stat .sn{order:3;margin-top:4px;font-size:11.5px;color:var(--mute);font-weight:500}
.stat.hl .sl{color:var(--acc);opacity:.85}
.stat.hl b.num em{color:var(--acc);opacity:.7}
@media (max-width:520px){ .stat b.num{font-size:26px!important} }

/* ══ 크게 보기 2단 (지도 | 선택 상세 + 전달 기록) ══════════════
   패널을 복제하지 않고 실제 DOM 을 옮겨 온다. render() 가 id 로 그리므로
   어디에 있든 그대로 갱신되고, 표식 클릭도 살아 있다. 닫으면 제자리로 돌린다 */
.mbody{align-items:stretch!important;justify-content:stretch!important;
  padding:12px!important;gap:12px;background:transparent!important;overflow:hidden}
.mleft,.mright{min-width:0;min-height:0}
.mleft{flex:1 1 auto;display:flex;flex-direction:column}
.mright{flex:0 0 400px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;
  padding-right:2px}
.mleft>.panel{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.mleft #map{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
.mleft svg.kmap{max-height:100%!important;width:auto!important;max-width:100%}
.mleft .zoomb{display:none}
.mright .elist{max-height:none!important}
/* 오른쪽 칸이 좁아 '26-08-31 (월)' 같은 값이 두 줄로 꺾이던 것 */
.mright .kv dd{white-space:nowrap}
/* 오른쪽 칸(400px)에 2단은 좁다 — 위아래로 쌓는다 */
.mright .d2{grid-template-columns:1fr!important;gap:10px!important}
/* 지도에서 보기 → 를 오른쪽으로 밀어 제목 줄과 겹치지 않게 */
.alist .ai .m .mlink{margin-left:auto}
@media (max-width:1000px){
  .mbody{flex-direction:column;overflow-y:auto}
  .mright{flex:0 0 auto;width:100%}
  .mleft>.panel{min-height:56vh}
}

/* ══ 주간 동행 : 관련 기사 미리보기 ═══════════════════════════ */
.hrel{margin-top:12px;border-top:1px solid var(--line2);padding-top:9px}
.hrel .hrt{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.hrel .hrt b{font-size:12.5px;font-weight:700;color:var(--mute)}
.hrl{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 0;
  border-top:1px solid var(--line2);cursor:pointer;font:inherit;color:inherit;
  display:grid;grid-template-columns:auto minmax(0,1fr);align-items:baseline;gap:9px}
.hrl:first-of-type{border-top:0}
.hrl .d{font-size:12.5px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.hrl .t{font-size:14.5px;font-weight:600;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrl:hover .t{color:var(--acc);text-decoration:underline;text-underline-offset:3px}
.hmore{width:100%;margin-top:8px;border:1px dashed var(--line);background:transparent;
  color:var(--acc);border-radius:9px;padding:9px;font:inherit;font-size:13.5px;
  font-weight:700;cursor:pointer}
.hmore:hover{border-color:var(--acc);background:var(--acc-w)}

/* ══ 기사 전체 보기 팝업 ══════════════════════════════════════ */
.abody{display:block!important;background:var(--card)!important;border-radius:12px;
  overflow-y:auto;padding:6px 18px 18px!important}
.alist .ai{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;
  align-items:baseline;border-top:1px solid var(--line2);padding:13px 0}
.alist .ai:first-child{border-top:0}
.alist .ai .d{font-size:13px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums;
  white-space:nowrap}
.alist .ai h4{margin:0;font-size:16px;line-height:1.42;font-weight:700;
  font-family:"Gothic A1",sans-serif}
.alist .ai h4 a{color:var(--ink);text-decoration:none}
.alist .ai h4 a:hover{color:var(--acc);text-decoration:underline;text-underline-offset:3px}
.alist .ai .m{margin-top:4px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;
  font-size:12.5px;color:var(--mute)}
.alist .ai .m .pr{font-weight:600}

/* ══════════════════════════════════════════════════════════════
   C2 시안 적용 (2026-09-07) — 흰 종이 위에 뜬 둥근 카드 + 계열색 3개
     시세 = 골드 · 나눔 = 파랑 · 소식 = 청록
   색은 장식이 아니라 '어느 종류의 정보인가' 를 말한다.
   되돌리려면 이 블록만 지우면 된다 (기준본 map_shell_확정_0907.html)
   ══════════════════════════════════════════════════════════════ */
:root{ --bg:#FFFFFF; --card2:#F7FAFF; --line:#E1E9F5; --line2:#EFF4FB; }
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#080C15; --card2:#141C29; --line:#2A3444; --line2:#212A38; }}
:root[data-theme="dark"]{ --bg:#080C15; --card2:#141C29; --line:#2A3444; --line2:#212A38; }
body{background:var(--bg)}

/* ── 부양형 : 테두리 대신 파란 기운의 그림자 + 둥근 모서리 ──── */
.panel,.hpanel,.hpanel2,.panel.mapbox{border:0!important;border-radius:18px!important;
  box-shadow:0 1px 2px rgba(18,60,122,.06),0 10px 30px rgba(18,60,122,.10)!important}
:root[data-theme="dark"] .panel,:root[data-theme="dark"] .hpanel,
:root[data-theme="dark"] .hpanel2,:root[data-theme="dark"] .panel.mapbox{
  box-shadow:0 1px 2px rgba(0,0,0,.55),0 10px 30px rgba(0,0,0,.45)!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .panel,
 :root:not([data-theme="light"]) .hpanel,:root:not([data-theme="light"]) .hpanel2,
 :root:not([data-theme="light"]) .panel.mapbox{
  box-shadow:0 1px 2px rgba(0,0,0,.55),0 10px 30px rgba(0,0,0,.45)!important}}
.card,.stat,.mcard,.tf{border-radius:14px!important}
.stats{border:0!important;gap:13px!important;padding:0!important}
.stat{border:0!important;background:var(--card)!important;padding:17px 19px!important;
  box-shadow:0 1px 2px rgba(18,60,122,.05),0 6px 18px rgba(18,60,122,.08)!important}
.stat.hl{background:var(--hl)!important}
.sect::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;
  background:var(--acc);margin-right:9px;vertical-align:.12em}
.tabs{border-bottom:0!important;gap:8px!important}
.tabs button{border-radius:999px!important;border-bottom:0!important;padding:11px 20px!important}
.tabs button[aria-selected="true"]{background:var(--acc)!important;color:#fff!important}
:root[data-theme="dark"] .tabs button[aria-selected="true"],
.tabs button[aria-selected="true"]{color:#fff!important}
.tabs button[aria-selected="true"] .cnt{color:#CFE1F7!important}
.tabs button+button::before{background:transparent!important}
.cards{gap:12px!important}
.cards>.card{background:var(--card2)!important;border:0!important;border-top:0!important;
  padding:15px 16px 14px!important}

/* ── 계열색 ① 시세 = 골드 ─────────────────────────────────── */
.trhead .sect{color:var(--mkt)}
.trhead .sect::before{background:var(--mkt)}
.tf,.mcard{background:var(--mkt-bg)!important;border:0!important}
.mkt .ptitle{color:var(--mkt)}
.mkt .ptitle::after{background:var(--mkt-ln)}

/* ── 계열색 ② 소식 = 청록 ─────────────────────────────────── */
/* 왼쪽은 파랑 기운, 오른쪽은 청록 기운 — 두 칸이 계열색으로 갈린다 */
.hpanel2{background:linear-gradient(158deg,var(--news-bg) 0%,var(--card) 60%)!important}
.hpanel2 .ptitle,.ptitle.nt{color:var(--news)}
.hpanel2 .ptitle::after,.ptitle.nt::after{background:var(--news-ln)}
.hpanel2 .hsum.big b.k{border-color:var(--news)!important;background:var(--news-bg)!important}
.hpanel2 .hsum.big b.k i,.hpanel2 .hsum.big b.k span{color:var(--news)!important}
.hpanel2 .hrl .d{color:var(--news)}
.hpanel2 .hrl:hover .t{color:var(--news)}
.hpanel2 .hmore{color:var(--news)}
.hpanel2 .hmore:hover{border-color:var(--news);background:var(--news-bg)}
.seg.cat button[aria-pressed="true"]{background:var(--news)!important}

/* ══════════════════════════════════════════════════════════════
   요청 11건 (2026-09-07 · 두 번째)
   되돌릴 때는 이 블록만 지운다. 기준본 map_shell_백업_0907b.html

.mk .mlab{font-size:17.5px!important;stroke-width:3.4!important}

.pcount{font-size:14px!important}
.msum .mst{font-size:14px!important}
.msum .msk{font-size:12.5px!important}
.msum .msv{font-size:17.5px!important}
.msum .msf{font-size:13px!important}
/* 지도 밑 부연 설명 */
.ylegend{font-size:16.5px!important}
.ylegend .ynote2{font-size:14px!important}
.mapbox .ynote{font-size:14px!important}
.legend,.legend .lnote{font-size:14.5px!important}

.dnote{font-size:15px!important}

/* ② 크게 보기 : 지도를 화면이 허용하는 최대까지 */
.modal{padding:8px!important}
